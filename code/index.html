<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>江湖无尽录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" rel="stylesheet" />
    <script>
      (function() {
        var t = 'night';
        try {
          var val = localStorage.getItem('jianghu-idle:theme:v1');
          if (val === 'night' || val === 'xuan' || val === 'bronze' || val === 'mist') {
            t = val;
          }
        } catch(e) {
          if (!(e instanceof DOMException)) throw e;
        }
        document.documentElement.setAttribute('data-theme', t);
        try {
          var c = localStorage.getItem('jianghu-idle:card:v1');
          if (c === 'gray' || c === 'teal' || c === 'wood' || c === 'lacquer') document.documentElement.setAttribute('data-card', c);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
