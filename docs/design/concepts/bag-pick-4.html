<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>行囊包裹形态挑选</title>
<style>
body{margin:0;background:#0d0f14;color:#e6e1d6;font:15px/1.7 "LXGW WenKai","PingFang SC",sans-serif;padding:32px 40px}
h1{font-size:24px;letter-spacing:.2em;margin:0 0 6px;font-family:"Noto Serif SC","Songti SC",serif}
figure{margin:24px 0 0}img{width:100%;max-width:1400px;display:block;border-radius:4px}
figcaption{margin-top:8px;color:#b9b2a3;font-size:15px;max-width:1400px}figcaption b{color:#e2b860;font-size:17px;margin-right:8px}
figcaption .c{display:block;color:#8f8a80;font-size:14px}
</style></head><body>
<h1>行囊 · 雾中人影不变，包裹换形态</h1>
<figure><img src="bw-bag-j.jpg"><figcaption><b>壬 · 挂起的卷包</b>一卷印花布挂在松枝上，从上往下展开，底边还卷着一截。
<span class="c">仍是布，但比摊在地上的包袱更立体；卷着的那截可以随背包格数变长变短。</span></figcaption></figure>
<figure><img src="bw-bag-i.jpg"><figcaption><b>辛 · 褡裢</b>一条两头装东西的长布袋，摊开在客栈长凳上，左右两个兜。
<span class="c">两个兜天然分成两区，比如左边兵器衣甲、右边零碎；但格子被中缝劈开，形态格（长兵器、二乘二衣甲）跨不过去。</span></figcaption></figure>
<figure><img src="bw-bag-k.jpg"><figcaption><b>癸 · 货郎百宝箱</b>一口带抽屉的旧木箱，抽屉一层层拉开，每个抽屉就是一格。
<span class="c">器物感最强、格子最规整；但木箱硬，离「包裹」最远，和之前否掉的箱笼接近。</span></figcaption></figure>
<figure><img src="bw-bag-h.jpg"><figcaption><b>子 · 书笈竹篓</b>书生背的竹编书笈，带小顶棚，前门打开，里面竹格放东西。
<span class="c">竹编有江湖行旅味，但格子少、像柜子，放八十格会挤。</span></figcaption></figure>
<figure><img src="bw-bag-f.jpg"><figcaption><b>己 · 蓝印花布包袱（上一轮）</b>留作对照。</figcaption></figure>
</body></html>
