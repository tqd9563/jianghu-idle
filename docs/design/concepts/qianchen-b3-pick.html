<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>前尘底蕴表现形式</title>
<style>
body{margin:0;background:#0d0f14;color:#e6e1d6;font:15px/1.7 "LXGW WenKai","PingFang SC",sans-serif;padding:32px 40px}
h1{font-size:24px;letter-spacing:.2em;margin:0 0 6px;font-family:"Noto Serif SC","Songti SC",serif}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
figure{margin:0}img{width:100%;display:block;border-radius:4px}
figcaption{margin-top:8px;color:#b9b2a3;font-size:14.5px}figcaption b{color:#e2b860;font-size:16px;margin-right:8px}
</style></head><body>
<h1>前尘 · 丙构图下底蕴的四种表现（画中文字为 AI 所写，只看形式）</h1>
<div class="row">
<figure><img src="qianchen-b3-seal.jpg"><figcaption><b>一 · 鉴藏印（推荐）</b>八方篆印盖在画上，级数越高印色越深越满；每世再盖一方</figcaption></figure>
<figure><img src="qianchen-b3-figures.jpg"><figcaption><b>三 · 往世八相</b>八位往世身影，级数越高墨色越实；意境最强，最难排、最难读</figcaption></figure>
<figure><img src="qianchen-b3-colophon.jpg"><figcaption><b>二 · 题跋直书</b>直接写在画的留白上，同修炼页「身手」写法；最简洁，但最像一张表</figcaption></figure>
<figure><img src="qianchen-b2-bing.jpg"><figcaption><b>原 · 题签</b>纸牌挂在画上</figcaption></figure>
</div></body></html>
