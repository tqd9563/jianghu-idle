<title>内功武学原型</title>
<!--
  issue #80 内功页 + 武学页改版 · 原型（只画桌面宽度）
  定稿：内功、武学并成一页「武功」——装配一行（主修印匣 | 武学印匣）、藏书一栏标题旁切内功 / 武学、右侧一本书翻开点中的那本。
  外壳照现行 App.tsx：左侧人物卷侧栏 + 舞台、每页底图同位；侧栏可在「内功」「武学」间切换，其余页签原型未画。
  两页同一套骨架：页头 → 上方一条「现在用着的」（内功＝主修进境，武学＝装配）→ 下方左「藏经 / 藏书」3 × 3 窄栏，右一本翻开的磁青书。

  内功页要点：
  · 主修：页头下一行，心法名 + 品质 / 路数章 + 重数，点它翻开主修那本。
  · 书页左页：书名旁写第几重与最高可至；下列内功提供的基础属性（气血 / 攻击 / 防御 / 命中 / 闪避，悬停看火候倍率与路数加成）；
    底部精进一重，点了重数、属性、要诀数值同步刷新并闪一下金。临关或内力不足时按钮置灰，缘由写在上方一行。
  · 心法要诀：只在翻开的书里出现一次。每条一行：名目 + 当前生效值；右侧挂会改它的关名（已过墨金、下一关暖金、再往后淡出、本品质够不着更淡），
    改了什么只写在悬停里，不铺在页面上。悬停一个关名，所有受同一关影响的要诀同时亮起。
  · 主修印匣：同武学装配印匣，石印换路数印（归海浪 / 镇岳山 / 蚀骨蝎，code/public/art/route/），印色按路数、描边与名字按品质，下写第几重。原型控制「样张」可看九部心法的印匣。
  · 精进后基础属性从旧值一格格跳到新值（约 0.9 秒）。
  · 换书翻页：点藏经 / 藏书里另一本时，书先合上露出封面（同书封、题签写书名），停 0.3 秒后以中缝为轴翻开约 1 秒，左页内容等封面落定再淡入；切页签、换预设不翻；系统开了「减少动态效果」则直接换。
  · 武学页即上一轮定稿：装配用印匣（印色按路数），书页磁青。

  素材：code/public/art/ 下 neigong.jpg、wuxue.jpg（页底图）、book-q1/2/3.png（书封）、cat/*.png（类目石印）、wuxue-open-ciqing.jpg（磁青书页）。
  file:// 直接打开即可。右下角白色面板是原型控制（可收起），不是设计内容。
-->

/* ═════════════ 内功 ═════════════ */

];
const SEGS = [[0, 2], [2, 4], [4, 6], [6, 20], [20, 40]];
const TIER_COUNT = { 寻常: 3, 上乘: 4, 绝学: 5 };
const QI_COEF = { 寻常: 1.0, 上乘: 1.1, 绝学: 1.2 };
const HH = { 寻常: 1.0, 上乘: 1.02, 绝学: 1.04 };
const ROUTE = { huashan: { name: '归海', tag: '刚猛' }, shaolin: { name: '镇岳', tag: '守御' }, tangmen: { name: '蚀骨', tag: '阴毒' } };
const NG = {
  jingleijue: { name: '百川诀', q: '寻常', r: 'huashan' }, zhenyuegong: { name: '镇岳功', q: '寻常', r: 'shaolin' }, shiguxinfa: { name: '蚀骨心法', q: '寻常', r: 'tangmen' },
  leimingjianjing: { name: '沧海功', q: '上乘', r: 'huashan' }, panshigong: { name: '磐石功', q: '上乘', r: 'shaolin' }, xuanyinjue: { name: '玄阴诀', q: '上乘', r: 'tangmen' },
  yuntaixinfa: { name: '沧溟真经', q: '绝学', r: 'huashan' }, putixingong: { name: '菩提心功', q: '绝学', r: 'shaolin' }, qianguxinjue: { name: '千蛊心诀', q: '绝学', r: 'tangmen' },
};
const PRESET = {
  a: { realm: 3, id: 'shiguxinfa', z: 5, passed: 2, dan: 7098, owned: ['jingleijue', 'zhenyuegong', 'shiguxinfa'] },
  b: { realm: 3, id: 'shiguxinfa', z: 6, passed: 2, dan: 9840, owned: ['jingleijue', 'zhenyuegong', 'shiguxinfa'] },
  c: { realm: 4, id: 'leimingjianjing', z: 13, passed: 3, dan: 6200, owned: ['leimingjianjing', 'xuanyinjue', 'jingleijue', 'zhenyuegong', 'shiguxinfa'] },
  d: { realm: 6, id: 'putixingong', z: 27, passed: 4, dan: 30210, owned: Object.keys(NG) },
};
const REALM = ['', '江湖新丁', '初窥门径', '小有所成', '炉火纯青', '一流高手', '一代宗师', '登峰造极'];

const zhongCost = (n) => Math.round(3490 * Math.pow(1.08, n - 1));
const qiMax = (realm, z, q) => Math.round((70 + 15 * (Math.max(realm, 2) - 2) + z) * QI_COEF[q]);
const pctx = (v) => `${Math.round(v * 10) / 10}`;

/**

function yaojue(r, q, realm, z, passed) {
  const L = Math.min(z, 10);
  const P = (k) => passed > k;
  if (r === 'tangmen') {
    const init = 1 + (P(0) ? 2 : 0), cap = P(1) ? 10 : 8, burst = P(2) ? 80 : 50;
    const coef = 12 + 1.8 * L + (P(3) ? 3 : 0) + (P(4) ? 2 : 0);
    return [
      { lb: '施毒', v: `开战施毒 <b>${init}</b> 层，每次命中 <b>+1</b> 层`, tiers: [[0, '初始 +2 层']] },

      { lb: '毒层', v: `上限 <b>${cap}</b> 层`, tiers: [[1, '8 → 10 层']] },
      { lb: '毒爆', v: `满层引爆 <b>${burst}%</b>`, tiers: [[2, '50% → 80%']] },
      { lb: '代价', v: `普攻伤害 <b>×0.60</b>`, tiers: [] },
      { lb: '气海', v: `×<b>${QI_COEF[q].toFixed(1)}</b> · 真气上限 <b>${qiMax(realm, z, q)}</b>`, tiers: [] },
    ];
  }
  if (r === 'huashan') {
    const cr = 10 + 2.5 * L, cd = 20 + 8 * L + (P(4) ? 20 : 0), sq = P(2) ? 3 : P(0) ? 4 : 5, bm = 400 + (P(1) ? 150 : 0) + (P(3) ? 50 : 0);
    return [
      { lb: '会心', v: `会心率 <b>+${pctx(cr)}pp</b>，会心伤害 <b>+${pctx(cd)}pp</b>`, tiers: [[4, '暴伤 +20pp']] },
      { lb: '先手', v: `开战首击<b>必定会心</b>`, tiers: [] },
      { lb: '叠浪', v: `每次会心叠 1 重，叠满 <b>${sq}</b> 重`, tiers: [[0, '5 → 4 重'], [2, '4 → 3 重']] },
      { lb: '排山倒海', v: `叠满时施展 <b>${bm}%</b>`, tiers: [[1, '400% → 550%'], [3, '+50pp']] },
      { lb: '气海', v: `×<b>${QI_COEF[q].toFixed(1)}</b> · 真气上限 <b>${qiMax(realm, z, q)}</b>`, tiers: [] },
    ];
  }
  const sh = 30 + (P(0) ? 15 : 0) + (P(4) ? 8 : 0), th = 25 + 3 * L + (P(1) ? 15 : 0) + (P(3) ? 5 : 0), df = 20 + 6 * L;
  return [

/** 进境线上某一重的横坐标（%）：五关之间等宽，段内按重数均分 */
function xOf(z) {
  if (z <= 0) return 0;
  for (let k = 0; k < SEGS.length; k++) { const [a, b] = SEGS[k]; if (z <= b) return (k + (z - a) / (b - a)) * 20; }
  return 100;
}
/** 关口状态：done 已过 / wait 已到重数在等顿悟 / next 下一关 / later 更后 / na 本品质够不着 */
function tierState(i, q, z, passed) {
  if (i >= TIER_COUNT[q]) return 'na';
  if (i < passed) return 'done';
  if (i === passed) return z >= TIERS[i].at ? 'wait' : 'next';
  return 'later';
}
const gateOf = (q, z, passed) => (passed < TIER_COUNT[q] && z >= TIERS[passed].at ? TIERS[passed] : null);

const CNUM = (n) => n <= 10 ? NUM[n] : n < 20 ? `十${n % 10 ? NUM[n % 10] : ''}` : `${NUM[Math.floor(n / 10)]}十${n % 10 ? NUM[n % 10] : ''}`;
const BASE = { 3: { hp: 2900, atk: 290, def: 150 }, 4: { hp: 4950, atk: 490, def: 260 }, 6: { hp: 16800, atk: 1680, def: 880 } };
const ROUTE_PCT = { huashan: (L) => ({ atk: 0.06 * L }), shaolin: (L) => ({ hp: 0.06 * L, def: 0.20 + 0.06 * L }), tangmen: (L) => ({ atk: 0.01 * L }) };
/** 内功提供的基础属性 = 境界底数 × (火候倍率 × (1 + 路数加成) − 1)；命中 / 闪避按折合境界。同 engine/combat.ts makeBuild + neigong.ts neigongBuild */
function ngAttrs(id, realm, z) {
  const d = NG[id], base = BASE[realm];
  const dx = z / 20 * HH[d.q], M = Math.pow(1.7, dx), rp = ROUTE_PCT[d.r](Math.min(z, 10));
  const one = (k) => {
    const pct = rp[k] ?? 0;
    return { v: Math.round(base[k] * ((1 + pct) * M - 1)), tip: `火候 ×${M.toFixed(2)}${pct ? ` · ${ROUTE[d.r].name}一路 +${Math.round(pct * 100)}%` : ''}` };
  };
  return { hp: one('hp'), atk: one('atk'), def: one('def'), hit: Math.round(12 * dx), dodge: Math.round(3 * dx), dx };
}
function ngShelfInner() {

function renderNgBook() {
  const ids = ng.owned;

  const main = id === ng.id;

  const rows = yaojue(d.r, d.q, ng.realm, z, passed).map((y) => {

        <span>命中${val(at.hit, '火候折合境界 × 12', 'hit')}</span><span>闪避${val(at.dodge, '火候折合境界 × 3', 'dodge')}</span>

      const tr = tier(c), at = [0, ...TH];
      const pos = tr >= 3 ? 100 : ((tr + (c - at[tr]) / (at[tr + 1] - at[tr])) / 3) * 100;
      return `<div class="shi">${head}<div class="prof" data-tip="已出 ${c} 招"><div class="prof-line"><i style="width:${pos}%"></i></div>${TIER4.map((x, i) => `<span class="pn${i < tr ? ' p' : i === tr ? ' c' : ''}" style="left:${(i / 3) * 100}%"><b></b><em>${x}</em></span>`).join('')}</div></div>`;
    }
    const got = d.pages == null ? true : k < d.pages;
    const why = !got ? `<span>缺少残页</span>` : lr.includes(k - 1) ? `<span>待第${CN[k]}式圆满</span><span class="cnt">${d.forms[k - 1][3]} <small>/ ${TH[2]}</small></span>` : `<span>待第${CN[k]}式圆满</span>`;
    return `<div class="shi locked">${head}<div class="lk">${d.q !== '寻常' ? `<i class="leaf${got ? ' got' : ''}"></i>` : ''}${why}</div></div>`;
  }).join('');
  return `
    <div class="pg l">
      <div class="ttl"><span class="nm">${d.n}</span>
        <div class="side"><span class="ptag q${QN[d.q]}">${d.q}</span><span class="ptag rt t-${d.rt}">${d.rt}</span>
          ${d.res ? '<span class="ptag res" data-tip="与所修内功同路，招式伤害 ×1.15">共鸣</span>' : ''}${d.benmen ? '<span class="ptag res" data-tip="本门武学：练熟所需出招数少两成">本门</span>' : ''}</div></div>
      <span class="bigico ico rf t-${d.rt}" style="background-image:url('${A}cat/${ICON[d.cat]}.png')" data-tip="${big} · ${d.cat}"></span>
      <div class="params">
        <span>伤害倍率<b>×${d.m0}%</b></span><span>真气消耗<b>${d.cost}</b></span><span>冷却回合<b>${d.cd}</b></span>
        <span><span class="dotted" data-tip="已装各门的触发几率相加就是每回合出招的机会，最多 60%">触发几率</span><b>${d.p}%</b></span><span>附加特效<b>${d.fx}</b></span>
      </div>
      <div class="need${need.ok ? ' ok' : ''}">${need.text}</div>${btn}
    </div>
    <div class="pg r">${rows}<div class="foot">${d.q}${big === '暗器' ? '暗器' : d.cat + '法'} · 共${CN[d.forms.length]}式</div></div>`;
}

/* ═════════════ 渲染与交互 ═════════════ */
const ART = { wugong: 'wuxue.jpg', neigong: 'neigong.jpg', wuxue: 'wuxue.jpg', cultivate: 'cultivate.jpg', battle: 'battle-village.jpg', bag: 'wuxue.jpg', sect: 'sect.jpg' };
function render() {
  document.body.dataset.tab = ui.tab;
  $('.js-art').style.setProperty('--art', `url('${A}${ART[ui.tab]}')`);
  document.querySelectorAll('.js-nav button').forEach((b) => b.toggleAttribute('aria-current', b.dataset.tab === ui.tab) || b.removeAttribute('aria-current'));
  document.querySelectorAll('.js-nav button').forEach((b) => { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); });
  if (ui.tab === 'wugong') { $('.js-realm').innerHTML = `${REALM[ng.realm]}<small>第${NUM[ng.realm]}境</small>`; $('.js-dan').textContent = fmt(ng.dan); }
  else if (ui.tab !== 'neigong') { $('.js-realm').innerHTML = `${REALM[3]}<small>第三境</small>`; $('.js-dan').textContent = '7,098'; }
  $('.js-page').innerHTML = ui.tab === 'wugong' ? renderWugong() : `<div class="placeholder">此页原型未画，沿用线上</div>`;
}
/** 打字机式上涨：从旧值一格格跳到新值 */
function countUp() {
  document.querySelectorAll('[data-to]').forEach((el) => {
    const from = +el.dataset.from, to = +el.dataset.to, steps = Math.min(Math.abs(to - from), 18), dur = 900;
    for (let i = 1; i <= steps; i++) setTimeout(() => { el.textContent = `+${fmt(from + (to - from) * i / steps)}`; }, (dur / steps) * i);
  });
}
/** 换书时合上再翻开：封面同藏书书封，题签写书名 */
const lastOpen = { neigong: null, wuxue: null, wugong: null };
function flipIfChanged() {
  const ngSel = ng.cur && ng.owned.includes(ng.cur) ? ng.cur : ng.id;
  const kind = ui.tab === 'wugong' ? ui.wgOpen : ui.tab;
  const id = kind === 'neigong' ? ngSel : kind === 'wuxue' ? wx.cur : null;
  const key = ui.tab === 'wugong' ? `${kind}:${id}` : id;
  if (!id) return;
  const prev = lastOpen[ui.tab]; lastOpen[ui.tab] = key;
  if (prev === null || prev === key || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const open = $('.open'), right = $('.right');
  let cover;
  if (kind === 'wuxue') { const d = WX[id]; cover = `<div class="face front wx q${QN[d.q]}${d.ghost ? ' ghost' : ''}"><i class="cv"></i><span class="slip">${d.n}</span><span class="seal">${SEAL[d.cat] ?? d.cat}</span></div>`; }
  else { const d = NG[id]; cover = `<div class="face front ng q${QN[d.q]}"><i class="cv"></i><span class="slip">${d.name}</span></div>`; }
  open.classList.add('closed');
  right.insertAdjacentHTML('beforeend', `<div class="flip-wrap"><div class="flipper">${cover}<div class="face back"></div></div></div>`);
  const wrap = right.querySelector('.flip-wrap'), fl = wrap.firstElementChild;
  setTimeout(() => { fl.classList.add('go'); open.classList.add('opening'); }, 320);
  setTimeout(() => { wrap.remove(); open.classList.remove('closed', 'opening'); }, 320 + 1000);
}
function rerenderSame() { // 同页内刷新不重播入场动画
  const page = $('.js-page');
  page.style.animation = 'none';
  render();
  flipIfChanged();
  countUp();
  requestAnimationFrame(() => { page.style.animation = ''; });
}

document.addEventListener('click', (e) => {
  if (e.target.closest('.js-sheet')) { e.target.closest('.js-sheet').remove(); return; }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-sheet')) { document.body.insertAdjacentHTML('beforeend', sheetHTML()); return; }
  const press = (sel) => document.querySelectorAll(`.proto ${sel}`).forEach((x) => x.setAttribute('aria-pressed', x === b));
  if (b.closest('.js-nav')) { ui.tab = b.dataset.tab; render(); lastOpen.neigong = null; lastOpen.wuxue = null; lastOpen.wugong = null; flipIfChanged(); return; }
  if (b.classList.contains('js-fold')) { b.closest('.proto').classList.toggle('folded'); return; }
  if (b.dataset.pre) { lastOpen.neigong = null; lastOpen.wugong = null; Object.assign(ng, structuredClone(PRESET[b.dataset.pre]), { pre: b.dataset.pre, cur: null, cat: 'all' }); press('[data-pre]'); }
  ng.bump = false;
  if (b.classList.contains('js-up')) { ng.prevAt = ngAttrs(ng.id, ng.realm, ng.z); ng.dan -= zhongCost(ng.z + 1); ng.z += 1; ng.cur = ng.id; ui.wgOpen = 'neigong'; ng.bump = true; }
  if (b.dataset.sim === 'dan') ng.dan += 10000;
  if (b.dataset.sim === 'wu') { const g = gateOf(NG[ng.id].q, ng.z, ng.passed); if (g) { ng.passed += 1; ng.cur = ng.id; ui.wgOpen = 'neigong'; ng.bump = true; } }
  if (b.dataset.ng) { ng.cur = b.dataset.ng; ui.wgOpen = 'neigong'; if (b.closest('.carry')) ui.wgShelf = 'neigong'; }
  if (b.dataset.ngcat) ng.cat = b.dataset.ngcat;
  if (b.dataset.wx) { wx.cur = b.dataset.wx; ui.wgOpen = 'wuxue'; if (b.closest('.carry')) ui.wgShelf = 'wuxue'; }
  if (b.dataset.kind) ui.wgShelf = b.dataset.kind;
  if (b.dataset.wxcat) { wx.cat = b.dataset.wxcat; wx.page = 0; }
  if (b.dataset.pg) wx.page += +b.dataset.pg;
  if (b.hasAttribute('data-toggle')) { const i = wx.desk.indexOf(wx.cur); i >= 0 ? wx.desk.splice(i, 1) : wx.desk.push(wx.cur); }
  if (b.dataset.s) { wx.slots = +b.dataset.s; wx.desk = wx.desk.slice(0, wx.slots); press('[data-s]'); }
  if (b.dataset.w != null && b.closest('.proto')) { wx.weapon = b.dataset.w; press('[data-w]'); }
  rerenderSame();
});

// 悬停提示 + 关口与要诀互相点亮
const tip = $('.js-tip');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelector('.js-sheet')?.remove(); });
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (t) { const r = t.getBoundingClientRect(); tip.innerHTML = t.dataset.tip; tip.style.left = `${Math.min(r.left, innerWidth - 310)}px`; tip.style.top = `${r.bottom + 6}px`; tip.classList.add('on'); }
  else tip.classList.remove('on');
  document.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl'));
  const g = e.target.closest('[data-tier]');
  if (g) {
    const i = g.dataset.tier;
    document.querySelectorAll(`[data-tier="${i}"]`).forEach((x) => x.classList.add('hl'));
    document.querySelectorAll('.yj').forEach((row) => { if (row.dataset.rows.split(' ').includes(i)) row.classList.add('hl'); });
  }
});
render();
flipIfChanged();
</script>
</body>
