<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>活江湖原型</title>
<!-- 活江湖第一期原型（docs/systems/living-jianghu/design.md）第三轮。
     ① 战斗页三层：江湖舆图（AI 水墨底图，十卷标在图上）→ 点卷放大到那片地域、据点以地标小画浮出 → 点据点进战斗（关卡线、对阵、战报）。
     ② 江湖编年右栏：两种摆法可切换——A 每页常驻；B 修炼、战斗两页常驻，其余页收成窄边，点开浮出。
     ③ 新一世「转世醒来」演出。
     mock 数据照设计稿：第四世沈砚（会稽人氏），江湖历 220 年，第二境，正走到卷三江南。
     舆图用样张二 code/public/art/jianghu-map-2.jpg；据点地标 code/public/art/lm/*.png（均 liclick gpt-image-2.5-sunburst）。 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" rel="stylesheet" />
<style>
:root {
  --bg: oklch(0.155 0.013 262); --bg-deep: oklch(0.125 0.012 262); --wash: oklch(0.19 0.014 262); --wash-2: oklch(0.225 0.016 262);
  --ink: oklch(0.91 0.012 85); --muted: oklch(0.76 0.015 85); --faint: oklch(0.64 0.014 262); --hair: oklch(0.30 0.016 262 / 0.7);
  --gold: oklch(0.78 0.13 78); --ink-gold: oklch(0.75 0.075 76); --done-line: oklch(0.50 0.045 70); --todo-line: oklch(0.40 0.014 262 / 0.7);
  --cinnabar: oklch(0.66 0.14 32); --hp: oklch(0.62 0.17 25); --qi: oklch(0.74 0.10 215); --foe: oklch(0.72 0.12 30);
  --zheng: oklch(0.76 0.09 245); --xie: oklch(0.72 0.11 320); --court: oklch(0.76 0.10 135); --jh: oklch(0.78 0.012 262);
  --font-display: "Noto Serif SC", "Songti SC", STSong, serif;
  --font-body: "LXGW WenKai", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --ease-sharp: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --rail-w: 248px; --dock-w: 320px;
  --z-sticky: 20; --z-drawer: 30; --z-ceremony: 40; --z-tip: 60;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; font-feature-settings: "tnum"; }
button { font-family: inherit; }
button:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 1px; }

/* ═══════ 原型控制条（不属于游戏界面） ═══════ */
.proto-bar { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 9px 20px; background: oklch(0.1 0.01 262 / 0.94); border-bottom: 1px solid var(--hair); font-size: 13px; }
.proto-bar .t { font-family: var(--font-display); letter-spacing: 0.2em; color: var(--muted); }
.proto-bar .lbl { color: var(--faint); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--wash); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; color: var(--faint); cursor: pointer; font-size: 13px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--wash-2); color: var(--ink); }
.proto-bar .go { border: 0; background: none; color: var(--ink-gold); cursor: pointer; font-size: 13px; padding: 4px 6px; }

/* ═══════ 外壳：人物卷侧栏 + 舞台 + 编年栏 ═══════ */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--dock-col, var(--dock-w)); min-height: calc(100vh - var(--bar-h, 46px)); }
.rail { background: var(--bg-deep); padding: 26px 22px; display: flex; flex-direction: column; gap: 4px; }
.rail .brand { font-family: var(--font-display); letter-spacing: 0.25em; color: var(--faint); font-size: 12.5px; }
.rail .realm { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: 0.12em; margin-top: 18px; line-height: 1.3; }
.rail .who { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.18em; margin-top: 6px; }
.rail .age { color: var(--muted); font-size: 12.5px; }
.rail .body { color: var(--faint); font-size: 12.5px; margin-top: 2px; }
.rail .res { margin-top: 22px; display: grid; gap: 6px; font-size: 13px; color: var(--faint); }
.rail .res div { display: flex; justify-content: space-between; }
.rail .res b { color: var(--ink); font-weight: 600; }
.rail .brush { height: 1px; margin: 22px 0 14px; background: linear-gradient(to right, transparent, oklch(0.5 0.03 76 / 0.6) 20%, oklch(0.5 0.03 76 / 0.6) 80%, transparent); }
.rail nav { display: grid; gap: 4px; }
.rail nav button { border: 0; background: none; text-align: left; cursor: pointer; font-family: var(--font-display); font-size: 18px; letter-spacing: 0.35em; padding: 9px 12px; border-radius: 8px; color: var(--muted); }
.rail nav button:hover { color: var(--ink); }
.rail nav button[aria-current="page"] { background: oklch(0.78 0.13 78 / 0.09); color: var(--gold); }
.stage { position: relative; isolation: isolate; padding: 30px 40px 70px; min-width: 0; }
.stage.arted::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 100vh; z-index: -1; pointer-events: none;
  background: url('../../code/public/art/battle-village.jpg') center top / cover no-repeat, var(--bg); opacity: 0.5; filter: brightness(0.75) saturate(0.5);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 30%, rgba(0,0,0,0.35) 62%, transparent 92%); mask-image: linear-gradient(to bottom, #000 0%, #000 30%, rgba(0,0,0,0.35) 62%, transparent 92%); }
.view[hidden] { display: none; }

.jh-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.jh-head h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.18em; margin: 0; line-height: 1.3; }
.jh-head .vol { font-family: var(--font-display); color: var(--ink-gold); letter-spacing: 0.3em; font-size: 14px; margin-bottom: 2px; min-height: 1.6em; }
.jh-head .sub { color: var(--muted); font-size: 12.5px; }
.jh-head .sub b { color: var(--ink); font-weight: 600; }
.back { border: 0; background: none; color: var(--ink-gold); cursor: pointer; font-family: var(--font-display); letter-spacing: 0.2em; font-size: 14px; padding: 4px 0; }
.back:hover { color: var(--gold); }
.back[hidden] { display: none; }
.jh-sec { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.25em; color: var(--ink); margin: 0; font-weight: 600; }

/* ═══════ 江湖舆图 ═══════
   底图即画：不加底框，四周羽化融进夜底；放大到一卷时整张图平移缩放，卷名隐去、据点浮出 */
.map { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px;
  -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); }
.map-in { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .9s var(--ease-quart); --k: 1; }
.map-in .art { position: absolute; inset: 0; background: var(--map-art) center / cover no-repeat; filter: brightness(0.92) saturate(0.7); }
.map.zoomed .art { filter: brightness(0.68) saturate(0.55); transition: filter .6s .3s; }
/* 卷名标签：反向缩放保持字号 */
.vlab { position: absolute; transform: translate(-50%, -50%) scale(calc(1 / var(--k))); display: grid; justify-items: center; gap: 4px; border: 0; background: none; padding: 6px 8px; cursor: pointer; transition: opacity .35s; }
.vlab .dot { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: oklch(0.12 0.01 262 / 0.75); box-shadow: inset 0 0 0 1px oklch(0.6 0.02 262 / 0.7); }
.vlab .dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: oklch(0.42 0.012 262); }
.vlab .nm { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.25em; color: var(--faint); text-shadow: 0 0 8px #000, 0 0 3px #000; white-space: nowrap; }
.vlab .tt { font-size: 11.5px; color: var(--faint); text-shadow: 0 0 6px #000; letter-spacing: 0.1em; white-space: nowrap; }
.vlab.open .dot::after { background: var(--ink-gold); }
.vlab.open .nm { color: var(--ink); }
.vlab.open .tt { color: var(--muted); }
.vlab.here .dot { box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 14px oklch(0.78 0.13 78 / 0.55); }
.vlab.here .dot::after { background: var(--gold); }
.vlab.here .nm { color: var(--gold); }
.vlab[aria-disabled="true"] { cursor: default; }
.vlab.here:hover .nm { text-shadow: 0 0 12px oklch(0.78 0.13 78 / 0.6), 0 0 3px #000; }
.map.zoomed .vlab { opacity: 0; pointer-events: none; }
/* 江南分图：建筑直接画在图里。放大动画走完后淡入，盖住被拉糊的舆图；退回时先淡出 */
.reg { position: absolute; inset: 0; background: url('../../code/public/art/jianghu-region-jiangnan.jpg') center / cover no-repeat; opacity: 0; pointer-events: none; transition: opacity .25s; filter: brightness(0.9) saturate(0.8); }
.map.zoomed .reg { opacity: 1; pointer-events: auto; transition: opacity .7s .8s; }
/* 据点：只是图上一块可点的区域，状态用游戏里的手法——未开被云雾遮住、在打的有烛光、已破的落墨金印 */
.spot { position: absolute; width: 13%; height: 21%; transform: translate(-50%, -55%); border: 0; background: none; padding: 0; cursor: pointer; }
.spot .glow { position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(closest-side, oklch(0.8 0.13 78 / 0.32), transparent); mix-blend-mode: screen; opacity: 0; transition: opacity .3s; pointer-events: none; }
.spot:not(.locked):hover .glow { opacity: 0.7; }
.spot.cur .glow { opacity: 1; animation: candle 3.2s ease-in-out infinite alternate; }
@keyframes candle { from { opacity: 0.65; } to { opacity: 1; } }
.spot .mist { position: absolute; inset: -18% -22%; pointer-events: none; opacity: 0; transition: opacity .6s; }
.spot .mist i { position: absolute; border-radius: 50%; filter: blur(14px); background: radial-gradient(closest-side, oklch(0.72 0.01 262 / 0.9), oklch(0.6 0.01 262 / 0.55) 60%, transparent); animation: drift 11s ease-in-out infinite alternate; }
.spot .mist i:nth-child(1) { inset: 8% 18% 22% 4%; }
.spot .mist i:nth-child(2) { inset: 20% 2% 6% 30%; animation-duration: 14s; animation-direction: alternate-reverse; }
.spot .mist i:nth-child(3) { inset: 30% 25% 18% 20%; animation-duration: 9s; }
@keyframes drift { from { transform: translateX(-4%); } to { transform: translateX(5%); } }
.spot.locked { cursor: default; }
.spot.locked .mist { opacity: 1; }
.spot .lab { position: absolute; left: 50%; top: 96%; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; white-space: nowrap; pointer-events: none; }
.spot .nm { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.15em; color: var(--ink); text-shadow: 0 0 8px #000, 0 0 3px #000, 0 0 14px #000; display: flex; align-items: center; gap: 6px; }
.spot .sm { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); text-shadow: 0 0 6px #000, 0 0 3px #000; }
.spot .al { font-family: var(--font-display); font-size: 10.5px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px; background: oklch(0.12 0.01 262 / 0.8); pointer-events: auto; }
.spot .al.z { color: var(--zheng); box-shadow: inset 0 0 0 1px oklch(0.76 0.09 245 / 0.7); }
.spot .al.x { color: var(--xie); box-shadow: inset 0 0 0 1px oklch(0.72 0.11 320 / 0.7); }
.spot .po { font-size: 11px; width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 3px; background: oklch(0.75 0.075 76 / 0.85); color: oklch(0.15 0.01 262); font-weight: 700; text-shadow: none; }
.spot.done .nm { color: var(--ink-gold); }
.spot.cur .nm { color: var(--gold); }
.spot.locked .nm { color: var(--faint); }
.spot:not(.locked):hover .nm { color: var(--gold); }

/* ═══════ 关卡线（照 battle.css .bt-track） ═══════ */
.map-h { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 10px 0; }
.map-h h2 { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.2em; margin: 0; font-weight: 700; }
.map-h .of { color: var(--muted); font-size: 12.5px; }
.track .tbar { position: relative; height: 18px; }
.track .rail-line { position: absolute; left: 0; right: 0; top: 8.5px; height: 1px; background: repeating-linear-gradient(to right, var(--todo-line) 0 3px, transparent 3px 6px); }
.track .fill { position: absolute; left: 0; top: 8px; height: 1.5px; border-radius: 1px; background: var(--done-line); }
.track .mk { position: absolute; top: 5px; width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg); background: var(--bg); box-shadow: inset 0 0 0 1px oklch(0.55 0.08 76); }
.track .mk.got { background: var(--ink-gold); box-shadow: none; }
.track .mk.boss { width: 11px; height: 11px; top: 3.5px; box-shadow: inset 0 0 0 1.5px var(--cinnabar); }
.track .mk.boss.got { background: var(--cinnabar); }
.track .here { position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.track .near { display: flex; gap: 6px; margin: 14px 0 0; flex-wrap: wrap; }
.track .near button { border: 0; background: none; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 7px; font-family: var(--font-display); font-size: 13.5px; color: var(--faint); cursor: pointer; }
.track .near button.done { color: var(--muted); }
.track .near button.done:hover { background: var(--wash); color: var(--ink); }
.track .near button.elite { color: var(--ink-gold); }
.track .near button.boss { color: var(--cinnabar); }
.track .near button.cur { background: oklch(0.78 0.13 78 / 0.12); color: var(--gold); font-weight: 600; }
.track .near button.sel { box-shadow: inset 0 0 0 1px var(--muted); }
.track .near button:disabled { cursor: default; color: oklch(0.42 0.012 262); }

/* ═══════ 关卡线三案 ═══════
   共同点：不再一排数字按钮；20 关只画一遍；守关的人（副手 / 镇守 / 门主）用印记标出，悬停见其人 */
.map-h .prog { margin-left: auto; color: var(--muted); font-size: 13px; }
.map-h .prog b { color: var(--ink); font-family: var(--font-display); font-weight: 600; }
.seal { display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 700; border-radius: 3px; line-height: 1; }
.seal.aide, .seal.warden { color: var(--ink-gold); box-shadow: inset 0 0 0 1.5px oklch(0.75 0.075 76 / 0.8); background: oklch(0.12 0.01 262 / 0.75); }
.seal.boss { color: oklch(0.95 0.02 60); background: var(--cinnabar); }
.seal.got { opacity: 0.6; }

/* 甲 山路行旅：一条墨线小路蜿蜒过去，走过的实线、没走的虚线，人在路上提一盏灯 */
.trail { position: relative; height: 128px; margin: 4px 0 6px; }
.trail svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.trail path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.trail .todo { stroke: oklch(0.6 0.02 262 / 0.55); stroke-width: 1.5; stroke-dasharray: 3 6; }
.trail .walk { stroke: var(--ink-gold); stroke-width: 2.5; opacity: 0.85; }
.trail .st { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 6px; cursor: pointer; display: grid; place-items: center; }
.trail .st:disabled { cursor: default; }
.trail .st i { width: 6px; height: 6px; border-radius: 50%; background: oklch(0.5 0.015 262); display: block; }
.trail .st.done i { background: var(--ink-gold); }
.trail .st .seal { width: 22px; height: 22px; font-size: 12px; }
.trail .st .seal.boss { width: 30px; height: 30px; font-size: 16px; }
.trail .st.cur i { width: 12px; height: 12px; background: var(--gold); box-shadow: 0 0 0 4px oklch(0.78 0.13 78 / 0.18), 0 0 18px var(--gold); }
.trail .st.sel:not(.cur) i, .trail .st.sel:not(.cur) .seal { outline: 1.5px solid var(--muted); outline-offset: 3px; }
.trail .st:not(:disabled):hover i { transform: scale(1.4); }
.trail .lab { position: absolute; transform: translateX(-50%); font-family: var(--font-display); font-size: 14px; letter-spacing: 0.2em; color: var(--gold); white-space: nowrap; text-shadow: 0 0 8px #000; pointer-events: none; }

/* 乙 章回墨点：当前一关作大标题，下面一串墨点，五点一组好数 */
.hui { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 28px; align-items: end; margin: 6px 0 4px; }
.hui .big { display: flex; align-items: center; gap: 10px; }
.hui .big h3 { margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: 0.25em; color: var(--ink); min-width: 4.6em; text-align: center; }
.hui .big button { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 6px; font-family: var(--font-display); }
.hui .big button:disabled { color: oklch(0.35 0.012 262); cursor: default; }
.hui .ahead { color: var(--muted); font-size: 13px; padding-bottom: 8px; }
.hui .ahead b { color: var(--ink-gold); font-family: var(--font-display); font-weight: 600; letter-spacing: 0.1em; }
.dots { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.dots .gap { width: 14px; }
.dots button { border: 0; background: none; padding: 5px 4px; cursor: pointer; display: grid; place-items: center; }
.dots button:disabled { cursor: default; }
.dots i { display: block; width: 11px; height: 11px; border-radius: 52% 46% 55% 44%; box-shadow: inset 0 0 0 1.5px oklch(0.5 0.015 262); }
.dots .done i { background: var(--ink-gold); box-shadow: none; opacity: 0.85; }
.dots .cur i { background: var(--gold); box-shadow: 0 0 14px var(--gold); }
.dots .sel:not(.cur) i, .dots .sel:not(.cur) .seal { outline: 1.5px solid var(--muted); outline-offset: 3px; }
.dots .seal { width: 20px; height: 20px; font-size: 11.5px; }

/* 丙 竹简：一关一片竹简，两道编绳横穿；守关的人在简尾落印 */
.slips { position: relative; display: inline-flex; max-width: 100%; gap: 5px; padding: 14px 0 8px; overflow-x: auto; scrollbar-width: thin; }
.slips::before, .slips::after { content: ''; position: absolute; left: 0; right: 0; height: 1.5px; background: oklch(0.45 0.04 70 / 0.55); z-index: 0; }
.slips::before { top: 36px; } .slips::after { top: 100px; }
.slip { position: relative; z-index: 1; flex: 0 0 34px; height: 112px; border: 0; border-radius: 5px; cursor: pointer; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  background: linear-gradient(to right, oklch(0.27 0.025 85), oklch(0.31 0.03 85) 45%, oklch(0.25 0.022 85)); color: var(--muted); transition: transform .25s var(--ease-quart), box-shadow .25s; }
.slip .n { writing-mode: vertical-rl; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.1em; }
.slip .seal { width: 20px; height: 20px; font-size: 11.5px; }
.slip.done { background: linear-gradient(to right, oklch(0.24 0.035 75), oklch(0.28 0.045 75) 45%, oklch(0.22 0.03 75)); }
.slip.done .n { color: var(--ink-gold); }
.slip.cur { transform: translateY(-8px); box-shadow: inset 0 0 0 1.5px var(--gold), 0 6px 22px oklch(0.78 0.13 78 / 0.3); }
.slip.cur .n { color: var(--gold); font-weight: 700; }
.slip.sel:not(.cur) { transform: translateY(-5px); box-shadow: inset 0 0 0 1px var(--muted); }
.slip:disabled { cursor: default; background: linear-gradient(to right, oklch(0.21 0.015 85), oklch(0.235 0.018 85) 45%, oklch(0.2 0.014 85)); }
.slip:disabled .n { color: oklch(0.5 0.015 85); }
.slip:not(:disabled):not(.cur):hover { transform: translateY(-4px); }

/* ═══════ 据点场景：关卡点就在画里的路上 ═══════
   近处已过的关是点亮的石灯；眼前几关站着护院剪影；守关的人是画里的圆形头像；远处的关收成一组 */
.scene { position: relative; aspect-ratio: 16 / 9; margin: -30px -40px 0; background: var(--scene-art, none) center / cover no-repeat;
  -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent); }
.stage.arted.has-scene::before { display: none; }
.scene.flat + .duel { margin-top: 10px; }
.scene.flat { aspect-ratio: auto; margin: 0; -webkit-mask-image: none; mask-image: none; }
.scene.flat .sc-head, .scene.flat .sc-prog { position: static; }
.scene.flat .sc-head { margin-bottom: 4px; }
.scene.flat .nodes { display: none; }
.sc-head { position: absolute; left: 40px; top: 26px; z-index: 2; text-shadow: 0 0 12px #000, 0 0 4px #000; }
.sc-head h2 { font-family: var(--font-display); font-size: 40px; font-weight: 700; letter-spacing: 0.18em; margin: 6px 0 2px; line-height: 1.2; }
.sc-head .of { color: var(--muted); font-size: 13.5px; letter-spacing: 0.1em; display: flex; align-items: center; gap: 6px; }
.sc-prog { position: absolute; left: 40px; top: 136px; z-index: 2; color: var(--muted); font-size: 13px; text-shadow: 0 0 8px #000; }
.sc-prog b { color: var(--ink); font-family: var(--font-display); font-weight: 600; }
.nodes { position: absolute; inset: 0; }
.nd { position: absolute; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: 50% 50%; border: 0; background: none; padding: 0; cursor: pointer; display: block; }
/* 定位基准是底座（或对钩、小点）的圆心，正落在路上；人影、头像立在其上，关名挂在其下 */
.nd > .lb { position: absolute; left: 50%; top: calc(100% + 4px); transform: translateX(-50%); margin: 0; }
.nd .gd, .nd .md { position: absolute; left: 50%; transform: translateX(-50%); }
.nd .gd { bottom: 30%; }
.nd .md { bottom: 70%; }
.nd:disabled { cursor: default; }
.nd .lb { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.12em; color: var(--muted); white-space: nowrap; text-shadow: 0 0 8px #000, 0 0 3px #000; margin-top: 2px; }
/* 点线串起各关；已过的一段是墨金点 */
.nodes svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.nodes svg path { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-width: 3; stroke-dasharray: 0 9; }
.nodes svg .todo { stroke: oklch(0.88 0.015 85 / 0.7); }
.nodes svg .walk { stroke: var(--ink-gold); }
/* 已过的关：对钩 */
.nd .ck { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: oklch(0.12 0.01 262 / 0.85); box-shadow: inset 0 0 0 1.5px var(--ink-gold); color: var(--ink-gold); font-size: 13px; font-weight: 700; }
.nd.done .lb { color: var(--ink-gold); }
/* 未过的关：护院剪影立在一枚小底座上 */
.nd .gd { width: 30px; height: 40px; background: url('../../code/public/art/scene/guard.png') center bottom / contain no-repeat; filter: drop-shadow(0 0 1.5px oklch(0.85 0.03 85 / 0.6)); }
.nd .bs { display: block; width: 32px; height: 10px; border-radius: 50%; background: oklch(0.22 0.012 262 / 0.85); box-shadow: inset 0 0 0 1.5px oklch(0.85 0.015 85 / 0.55); }
.nd.cur .gd { width: 40px; height: 54px; filter: drop-shadow(0 0 8px oklch(0.8 0.13 78 / 0.6)); }
.nd.cur .bs { width: 46px; height: 13px; background: oklch(0.78 0.13 78 / 0.15); box-shadow: 0 0 0 1.5px var(--gold), 0 0 14px var(--gold); animation: candle 2.6s ease-in-out infinite alternate; }
.nd.cur .lb { color: var(--gold); font-size: 14px; }
/* 远处收起的关：路上一个小点 */
.nd .fd { display: block; width: 7px; height: 7px; border-radius: 50%; background: oklch(0.85 0.015 85 / 0.6); }
/* 守关之人：圆形头像 + 竖印 */
.nd .md { width: 56px; height: 56px; border-radius: 50%; background: var(--pt) center / cover no-repeat, var(--bg-deep); box-shadow: 0 0 0 2px var(--ink-gold), 0 0 0 4px oklch(0.12 0.01 262 / 0.8), 0 8px 20px #000; }
.nd.boss .md { width: 64px; height: 64px; box-shadow: 0 0 0 2.5px var(--cinnabar), 0 0 0 5px oklch(0.12 0.01 262 / 0.8), 0 8px 20px #000; }
.nd .md .tg { position: absolute; right: -16px; top: 4px; writing-mode: vertical-rl; font-family: var(--font-display); font-weight: 700; font-size: 12px; padding: 4px 2px; border-radius: 3px; background: oklch(0.12 0.01 262 / 0.9); color: var(--ink-gold); box-shadow: inset 0 0 0 1px oklch(0.75 0.075 76 / 0.8); }
.nd.boss .md .tg { background: var(--cinnabar); color: oklch(0.96 0.02 60); box-shadow: none; }
.nd.done .md { filter: grayscale(0.85) brightness(0.7); }
.nd.sel:not(.cur) .md, .nd.sel:not(.cur) .ck, .nd.sel:not(.cur) .bs { outline: 1.5px dashed var(--muted); outline-offset: 4px; border-radius: 50%; }
.nd:not(:disabled):hover .lb { color: var(--gold); }
.grp { position: absolute; transform: translate(-50%, 0); font-family: var(--font-display); font-size: 12.5px; letter-spacing: 0.1em; color: var(--faint); white-space: nowrap; text-shadow: 0 0 8px #000, 0 0 3px #000; pointer-events: none; }

/* ═══════ 对阵（照 battle.css .duel） ═══════ */
.duel { position: relative; display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px minmax(0, 1fr) 150px; gap: 12px 18px; align-items: end; margin: -90px -40px 0; padding: 0 40px;
  background: radial-gradient(ellipse 60% 100% at 50% 100%, oklch(0.2 0.015 262 / 0.9), transparent 70%); }
.duel .side { padding-bottom: 20px; }
.duel .vs { padding: 0 0 34px; font-size: 40px; color: var(--ink-gold); opacity: 0.85; }
.bust { width: 150px; height: 200px; object-fit: contain; object-position: bottom; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom, #000 70%, transparent); }
div.bust { background: var(--bust) center bottom / contain no-repeat; }
div.bust.round { width: 128px; height: 128px; align-self: center; margin-bottom: 26px; border-radius: 50%; background: var(--bust) center / cover no-repeat; -webkit-mask-image: none; mask-image: none; box-shadow: 0 0 0 2px var(--ink-gold), 0 0 0 5px oklch(0.12 0.01 262 / 0.8); }
div.bust.round.boss { box-shadow: 0 0 0 2.5px var(--cinnabar), 0 0 0 5px oklch(0.12 0.01 262 / 0.8); }
/* 挑战按钮：两侧各一道墨线收于菱形 */
.btn.orn { position: relative; }
.btn.orn::before, .btn.orn::after { content: ''; position: absolute; top: 50%; width: 70px; height: 1px; background: linear-gradient(to var(--d, left), transparent, oklch(0.78 0.13 78 / 0.6)); }
.btn.orn::before { right: 100%; margin-right: 10px; --d: right; }
.btn.orn::after { left: 100%; margin-left: 10px; --d: left; }
.side .name { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 0.12em; }
.side .name .hao { font-size: 17px; color: var(--foe); letter-spacing: 0.06em; margin-right: 4px; }
.side .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.side .desc [data-tip] { text-decoration: underline dotted oklch(0.6 0.02 262); text-underline-offset: 3px; cursor: help; }
.side.enemy { text-align: right; }
.meter { margin-top: 14px; }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.side.enemy .meter .lbl { flex-direction: row-reverse; }
.ink-bar { position: relative; height: 7px; margin-top: 5px; }
.ink-bar::before { content: ''; position: absolute; inset: 2px 0; border-radius: 3px; background: oklch(0.12 0.01 262 / 0.7); }
.ink-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; border-radius: 4px; background: linear-gradient(to right, oklch(0.5 0.16 25), var(--hp) 70%, oklch(0.7 0.16 30)); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 14px), transparent); }
.side.enemy .ink-bar i { left: auto; right: 0; background: linear-gradient(to left, oklch(0.5 0.16 25), var(--hp) 70%, oklch(0.7 0.16 30)); -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 14px), transparent); }
.vs { text-align: center; padding-top: 16px; font-family: var(--font-display); color: var(--muted); font-size: 26px; }
.act { margin-top: 26px; display: grid; justify-items: center; }
.btn { border: 0; font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.16em; padding: 11px 26px; border-radius: 10px; min-width: 220px; color: var(--gold); cursor: pointer;
  background: linear-gradient(to bottom, oklch(0.78 0.13 78 / 0.16), oklch(0.78 0.13 78 / 0.05)); box-shadow: inset 0 0 0 1px oklch(0.78 0.13 78 / 0.55); transition: box-shadow .2s; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--gold), 0 0 16px oklch(0.78 0.13 78 / 0.25); }

/* ═══════ 战报 ═══════ */
.log-wrap { margin-top: 34px; }
.log { height: 260px; overflow-y: auto; padding: 6px 2px 4px; margin-top: 10px; scrollbar-width: thin; scrollbar-color: oklch(0.3 0.016 262) transparent; }
.log .rh { font-family: var(--font-display); color: var(--faint); letter-spacing: 0.15em; margin: 12px 0 4px; font-size: 13px; }
.log .p { color: var(--muted); line-height: 1.85; padding: 1px 0; max-width: 46em; }
.log .me { color: var(--ink-gold); } .log .foe { color: var(--foe); } .log .sk { color: var(--qi); } .log .dm { color: var(--ink); font-weight: 600; }
.log .p.win { color: var(--ink-gold); margin-top: 10px; }
.log .cause, .log .rumor { display: flex; gap: 12px; align-items: baseline; max-width: 46em; line-height: 1.85; }
.log .cause { padding: 8px 0 6px; color: var(--ink); }
.log .rumor { padding: 2px 0 8px; color: var(--muted); }
.log .at { font-family: var(--font-display); letter-spacing: 0.2em; white-space: nowrap; font-size: 13.5px; }
.log .cause .at { color: var(--ink-gold); } .log .rumor .at { color: var(--faint); }

/* ═══════ 江湖编年：常驻右栏 ═══════
   一条时间流，新的在上；类别靠标签字与字色区分（不靠侧条），玩家自己的事用墨金 */
.dock { background: var(--bg-deep); position: sticky; top: var(--bar-h, 46px); height: calc(100vh - var(--bar-h, 46px)); display: flex; flex-direction: column; min-width: 0; }
.dock .tabs { display: flex; gap: 22px; padding: 26px 22px 0; border-bottom: 1px solid var(--hair); }
.dock .tabs button { border: 0; background: none; padding: 0 0 10px; font-family: var(--font-display); font-size: 15px; letter-spacing: 0.25em; color: var(--faint); cursor: pointer; position: relative; }
.dock .tabs button[aria-selected="true"] { color: var(--ink); }
.dock .tabs button[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0.25em; bottom: -1px; height: 1.5px; background: var(--ink-gold); }
.dock .feed { flex: 1; overflow-y: auto; padding: 6px 22px 30px; scrollbar-width: thin; scrollbar-color: oklch(0.3 0.016 262) transparent; }
.dock .now { padding: 14px 0 10px; color: var(--faint); font-size: 12.5px; }
.dock .now b { color: var(--ink); font-family: var(--font-display); letter-spacing: 0.15em; font-weight: 600; }
.ev { padding: 12px 0; border-bottom: 1px solid oklch(0.26 0.014 262 / 0.6); }
.ev:last-child { border-bottom: 0; }
.ev .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ev .cat { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.2em; font-weight: 600; }
.ev .yr { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.ev .tx { margin-top: 4px; color: var(--muted); font-size: 13.5px; line-height: 1.75; text-wrap: pretty; }
.ev.me .cat { color: var(--ink-gold); } .ev.me .tx { color: var(--ink); }
.ev.zheng .cat { color: var(--zheng); } .ev.xie .cat { color: var(--xie); } .ev.court .cat { color: var(--court); } .ev.jh .cat { color: var(--jh); }
.ev.big { margin: 4px -10px; padding: 12px 10px; border-radius: 8px; border-bottom: 0; background: oklch(0.62 0.17 25 / 0.1); }
.ev.big .cat { color: var(--cinnabar); }
.ev.big .tx { color: var(--ink); }
.ev.fresh { animation: evin .7s var(--ease-quart) both; }
@keyframes evin { from { opacity: 0; transform: translateY(-6px); } }
/* 乙 年表：按年分组，年份一列，一条细轴串起各事，点色表类别 */
.yb { display: grid; grid-template-columns: 92px minmax(0, 1fr); padding-top: 14px; }
.yb .y { font-family: var(--font-display); color: var(--muted); font-size: 12.5px; letter-spacing: 0.04em; white-space: nowrap; line-height: 1.5; padding-top: 2px; }
.yb ol { list-style: none; margin: 0; padding: 0 0 4px 16px; box-shadow: inset 1px 0 0 var(--hair); }
.yb li { position: relative; padding: 0 0 12px; color: var(--muted); font-size: 13.5px; line-height: 1.75; text-wrap: pretty; }
.yb li::before { content: ''; position: absolute; left: -20px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--faint)); box-shadow: 0 0 0 3px var(--bg-deep); }
.yb li .s { color: var(--faint); font-size: 12px; margin-right: 6px; }
.yb li.me { --c: var(--ink-gold); color: var(--ink); }
.yb li.zheng { --c: var(--zheng); } .yb li.xie { --c: var(--xie); } .yb li.court { --c: var(--court); } .yb li.jh { --c: var(--jh); }
.yb li.big { --c: var(--cinnabar); color: var(--ink); }
.yb li.big::before { width: 9px; height: 9px; left: -21px; top: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 12px 0 4px; font-size: 12px; color: var(--faint); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
/* 丙 竖排史册：右起竖行，一事一段，年份作段首；横向滚动往左是更早 */
.feed.vert { writing-mode: vertical-rl; overflow-x: auto; overflow-y: hidden; padding: 22px 22px 18px; }
.vv { margin: 0 0 0 26px; font-size: 14.5px; line-height: 2; letter-spacing: 0.1em; color: var(--muted); text-indent: 0; }
.vv .y { font-family: var(--font-display); font-weight: 700; color: var(--ink); letter-spacing: 0.2em; }
.vv .ss { font-family: var(--font-display); color: var(--faint); }
.vv .me { color: var(--ink-gold); } .vv .big { color: var(--cinnabar); }
.vv .zheng, .vv .xie, .vv .court, .vv .jh { color: var(--muted); }
.vv .ev-v[data-tip] { cursor: help; }
.vv-now { font-family: var(--font-display); color: var(--ink); letter-spacing: 0.3em; margin-left: 26px; font-size: 15px; }
/* 丁 头条简讯：最近一桩大事作头条，其下按类别筛的一行一事 */
.hd { padding: 18px 0 16px; border-bottom: 1px solid var(--hair); }
.hd .k { font-family: var(--font-display); color: var(--cinnabar); font-size: 13px; letter-spacing: 0.25em; }
.hd .k span { color: var(--faint); letter-spacing: 0.05em; margin-left: 8px; font-family: var(--font-body); font-size: 12px; }
.hd .t { font-family: var(--font-display); font-size: 19px; line-height: 1.6; margin-top: 8px; letter-spacing: 0.06em; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 0 6px; }
.chips button { border: 0; background: none; padding: 3px 7px; border-radius: 6px; font-size: 12.5px; color: var(--faint); cursor: pointer; }
.chips button:hover { color: var(--ink); }
.chips button[aria-pressed="true"] { background: var(--wash-2); color: var(--ink); }
.brief { margin: 0; padding: 7px 0; font-size: 13.5px; line-height: 1.7; color: var(--muted); text-wrap: pretty; }
.brief b { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; margin-right: 8px; letter-spacing: 0.1em; }
.brief .yr { color: var(--faint); font-size: 11.5px; margin-left: 6px; white-space: nowrap; }
.brief.me { color: var(--ink); } .brief.me b { color: var(--ink-gold); }
.brief.zheng b { color: var(--zheng); } .brief.xie b { color: var(--xie); } .brief.court b { color: var(--court); } .brief.jh b { color: var(--jh); } .brief.big b { color: var(--cinnabar); }
.brief.fresh, .yb li.fresh, .vv.fresh { animation: evin .7s var(--ease-quart) both; }

/* B 摆法：操作页上编年收成窄边，点开从右侧浮出 */
.dock .edge { display: none; }
.shell.dock-min { --dock-col: 52px; }
.shell.dock-min .dock > :not(.edge) { display: none; }
.shell.dock-min .dock .edge { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; height: 100%; padding: 26px 0; border: 0; background: none; cursor: pointer; color: var(--faint); }
.dock .edge .vt { writing-mode: vertical-rl; font-family: var(--font-display); font-size: 15px; letter-spacing: 0.4em; }
.dock .edge:hover .vt { color: var(--ink); }
.dock .edge .n { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; color: var(--bg); background: var(--gold); }
.dock .edge .n.big { background: var(--cinnabar); }
.dock .edge .n[hidden] { display: none; }
.shell.dock-min.dock-open .dock { position: fixed; right: 0; top: var(--bar-h, 46px); width: var(--dock-w); z-index: var(--z-drawer); box-shadow: -24px 0 60px oklch(0.05 0.01 262 / 0.75); animation: drawin .35s var(--ease-quart) both; }
.shell.dock-min.dock-open .dock .feed { display: block; }
.shell.dock-min.dock-open .dock .tabs { display: flex; }
.shell.dock-min.dock-open .dock .edge { display: none; }
.dock .close { display: none; }
.shell.dock-min.dock-open .dock .close { display: block; margin-left: auto; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 0 10px; }
@keyframes drawin { from { transform: translateX(24px); opacity: 0; } }
/* 其余页签：只画出版面占位，示意宽度 */
.ph-note { color: var(--faint); font-size: 12.5px; margin: 0 0 18px; }
.ph { background: var(--wash); border-radius: 10px; }
.ph-grid { display: grid; gap: 14px; }
/* 往世：一世一行，点开看那一世的事 */
.past { border-bottom: 1px solid var(--hair); }
.past > button { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; width: 100%; border: 0; background: none; text-align: left; padding: 14px 0; cursor: pointer; color: var(--ink); }
.past .n { font-family: var(--font-display); color: var(--faint); font-size: 12.5px; letter-spacing: 0.15em; align-self: baseline; }
.past .nm { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.15em; font-weight: 600; }
.past .nm .hao { color: var(--ink-gold); font-size: 14px; letter-spacing: 0.06em; margin-right: 4px; }
.past .chev { color: var(--faint); font-size: 10px; align-self: center; transition: transform .25s var(--ease-sharp); }
.past .end { grid-column: 2 / 4; color: var(--faint); font-size: 12px; }
.past[data-open] .chev { transform: rotate(90deg); }
.past .bd { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease-sharp); }
.past[data-open] .bd { grid-template-rows: 1fr; }
.past .bd > div { overflow: hidden; }

/* ═══════ 悬停提示 ═══════ */
.tip { position: fixed; z-index: var(--z-tip); max-width: 300px; padding: 9px 12px; border-radius: 8px; background: oklch(0.2 0.014 262 / 0.97); box-shadow: 0 14px 40px oklch(0.05 0.01 262 / 0.7), inset 0 0 0 1px var(--hair); font-size: 12.5px; color: var(--muted); pointer-events: none; opacity: 0; transition: opacity .12s; line-height: 1.7; }
.tip.on { opacity: 1; }
.tip b { color: var(--ink); font-weight: 600; }
.tip .gold { color: var(--ink-gold); }

/* ═══════ 转世醒来（整屏演出，照 shell.css .jh-ceremony） ═══════ */
.ceremony { position: fixed; inset: 0; z-index: var(--z-ceremony); display: grid; place-items: center; text-align: center; padding: 20px; overflow-y: auto;
  background: radial-gradient(ellipse at 50% 40%, oklch(0.25 0.03 200 / 0.95), oklch(0.09 0.012 262 / 0.98) 72%); }
.ceremony[hidden] { display: none; }
.ceremony > div > * { animation: rise .8s var(--ease-sharp) both; }
.ceremony > div > *:nth-child(2) { animation-delay: .2s; } .ceremony > div > *:nth-child(3) { animation-delay: .4s; }
.ceremony > div > *:nth-child(4) { animation-delay: .7s; } .ceremony > div > *:nth-child(5) { animation-delay: 1.1s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } }
.ceremony .kick { font-family: var(--font-display); letter-spacing: 0.6em; color: var(--ink-gold); font-size: 14px; }
.ceremony h2 { font-family: var(--font-display); font-size: clamp(40px, 7vw, 64px); letter-spacing: 0.3em; margin: 16px 0 4px; font-weight: 700; }
.ceremony .d { color: var(--muted); letter-spacing: 0.1em; }
.ceremony .since { margin: 34px auto; max-width: 30em; display: grid; gap: 10px; text-align: left; }
.ceremony .since p { margin: 0; color: var(--muted); line-height: 1.85; text-wrap: pretty; }
.ceremony .since p em { font-style: normal; color: var(--ink); }
.ceremony .since p .mine { color: var(--ink-gold); }

@media (prefers-reduced-motion: reduce) {
  .map-in, .vlab, .reg, .map-in .art { transition: none !important; }
  .spot .mist i, .spot.cur .glow { animation: none; }

<script>

const OPEN_UPTO = 4, HERE = 2;
const ZOOM = { k: 3, cx: 74, cy: 66 };

/* 卷三江南：赶路图 + 三章并排；坐标是放大前整张舆图上的 % */
const ROAD = { id: 'r', name: '姑苏驿道', total: 20, done: 20, foe: '剪径毛贼', x: 14.5, y: 15 };
const CHAPTERS = [

      { id: 'a2', name: '千岩山门', layer: '门户', total: 20, done: 7, foe: '千岩寺武僧', x: 13.5, y: 77,

        aide: { name: '「算珠」顾三', post: '绸庄管事', gen: 5, pt: 'p-gusan' },

        aide: { name: '「红绡」柳娘', post: '画舫鸨母', gen: 7 },
        warden: { name: '苏绮', post: '画舫主事', gen: 3 } },
      { id: 'c2', name: '十里花阵', layer: '门户', total: 20, done: 0, foe: '花影坊女弟子', x: 82, y: 74,

];
const allMaps = () => [ROAD, ...CHAPTERS.flatMap((c) => c.maps)];
const facOf = (id) => CHAPTERS.find((c) => c.maps.some((m) => m.id === id));
const Y = (p) => p * 56.25 / 100;
let selMap = 'a2', selStage = null, peek = false;

/* ═══════ 舆图 ═══════ */
function buildMap() {
  VOLS.forEach(([n, t, x, y], i) => {
    const b = document.createElement('button');
    b.className = 'vlab' + (i <= OPEN_UPTO ? ' open' : '') + (i === HERE ? ' here' : '');
    b.style.left = x + '%'; b.style.top = y + '%';
    if (i > OPEN_UPTO) { b.setAttribute('aria-disabled', 'true'); b.dataset.tip = `打穿卷${CN[i - 1]}任一家的门户后开启`; }
    b.innerHTML = `<span class="dot"></span><span class="nm">${n}</span><span class="tt">卷${CN[i]} · ${t}</span>`;
    if (i === HERE) b.onclick = () => setZoom(true);
    mapIn.appendChild(b);
  });
  renderPins();
}
function renderPins() {
  reg.innerHTML = '';
  const add = (m, c, lockedBy) => {
    const b = document.createElement('button'), done = m.done >= m.total;
    b.className = `spot${done ? ' done' : ''}${m.done && !done ? ' cur' : ''}${lockedBy ? ' locked' : ''}`;
    b.style.left = m.x + '%'; b.style.top = m.y + '%';
    const prog = done ? '已破' : m.done ? `${m.done} / ${m.total}` : `${m.total} 关`;
    const sm = c ? `<span class="al ${c.al}">${c.al === 'z' ? '正' : '邪'}</span>${c.fac} · ${prog}` : `赶路 · ${prog}`;
    b.innerHTML = `<span class="glow"></span><span class="mist"><i></i><i></i><i></i></span><span class="lab"><span class="nm">${m.name}${done ? '<span class="po">破</span>' : ''}</span><span class="sm">${sm}</span></span>`;
    if (c) b.querySelector('.al').dataset.tip = `<b>${c.fac}</b> · ${c.tier}<br>擅长${c.skill} · 镇宗 <span class=gold>${c.sig}</span>${c.join ? '<br>可拜入' : ''}`;
    if (lockedBy) b.dataset.tip = `先破${lockedBy}`;
    else b.onclick = () => openFight(m.id);
    reg.appendChild(b);
  };
  add(ROAD, null);
  CHAPTERS.forEach((c) => {
    const [m1, m2] = c.maps;
    add(m1, c);
    add(m2, c, m1.done < m1.total ? m1.name : null);
  });
}
function setZoom(on) {
  map.classList.toggle('zoomed', on);
  const k = on ? ZOOM.k : 1;
  mapIn.style.setProperty('--k', k);
  const tx = on ? 50 - ZOOM.cx * k : 0, ty = on ? 50 - ZOOM.cy * k : 0;
  mapIn.style.transform = `translate(${tx}%, ${ty}%) scale(${k})`;
  mapBack.hidden = !on;
  mapKick.textContent = on ? `卷三 · ${VOLS[HERE][1]}` : '';
  mapTitle.textContent = on ? '江南' : '江湖';
  const cleared = CHAPTERS.filter((c) => c.maps[1].done >= c.maps[1].total).length;
  mapSub.innerHTML = on ? `已破 <b>${cleared}</b> / ${CHAPTERS.length} 家` : `此世行至 <b>卷三 · 江南</b>`;
}
mapBack.onclick = () => setZoom(false);

/* ═══════ 战斗（第三层） ═══════ */
function openFight(id) {
  selMap = id; selStage = null;
  document.getElementById('v-map').hidden = true;
  document.getElementById('v-fight').hidden = false;
  stage.classList.add('arted');
  renderFight();
}
fightBack.onclick = () => {
  document.getElementById('v-fight').hidden = true;
  document.getElementById('v-map').hidden = false;
  stage.classList.remove('arted');
};
function stageInfo(m, n) {
  const mid = Math.round(m.total / 2);
  if (m.boss && n === m.total) return { kind: 'boss', who: m.boss };
  if (m.warden && n === m.total) return { kind: 'elite', who: m.warden };
  if ((m.boss || m.warden) && n === mid) return { kind: 'elite', who: m.aide };
  return { kind: 'normal' };
}
const whoTip = (m, w) => `<b>${w.name}</b> · ${facOf(m.id).fac}${w.post}<br>第 ${w.gen} 任${w.past ? '<br>' + w.past : ''}`;
const SEAL_CH = { aide: '副', warden: '守', boss: '主' };
const ART = '../../code/public/art/scene/';
/* 场景里路上的 20 个点（% 坐标，按顾家绸庄场景图标定），由近及远 */
const SCENES = {
  guzhuang: { art: '../../code/public/art/scene/guzhuang.jpg', pts: [[9.5,80],[12.5,73],[16.5,67],[22,61.5],[28,58.5],[35,56.5],[42,55],[49,53.5],[57,51],[72,41.5],[77,43],[81,45],[83.5,42.5],[85.5,39.5],[87,36.5],[88.5,33.5],[90,30.5],[91.2,28.2],[92.2,26.5],[92.5,23.5]] },
};
function stageRole(m, n) {
  const s = stageInfo(m, n);
  if (s.kind === 'boss') return 'boss';
  if (s.kind === 'elite') return s.who === m.aide ? 'aide' : 'warden';
  return null;
}
function renderNodes(m, next) {
  const sc = SCENES[m.scene];
  const ahead = 5;   // 眼前几关画出人影，再远的只剩熄着的石灯
  let html = '', far = [];
  for (let n = 1; n <= m.total; n++) {
    const [x, y] = sc.pts[n - 1], role = stageRole(m, n), w = stageInfo(m, n).who, done = n <= m.done;
    const near = next && n >= next && n < next + ahead;
    const can = done || n === next || (peek && n === selStage);
    const sc_ = (0.62 + 0.38 * y / 100).toFixed(2);
    let inner, cls = 'nd';
    if (role) { inner = `<span class="md" style="--pt:url('${ART}${w.pt}.png')"><span class="tg">${SEAL_CH[role]}</span></span><span class="bs"></span><span class="lb">第${cnNum(n)}关</span>`; cls += role === 'boss' ? ' boss' : ''; }
    else if (done) inner = `<span class="ck">✓</span><span class="lb">第${cnNum(n)}关</span>`;
    else if (near) inner = `<span class="gd"></span><span class="bs"></span><span class="lb">第${cnNum(n)}关</span>`;
    else { inner = '<span class="fd"></span>'; far.push(n); }
    cls += (done ? ' done' : '') + (n === next ? ' cur' : '') + (n === selStage ? ' sel' : '');
    const tip = w ? whoTip(m, w) : `第${cnNum(n)}关 · ${m.foe}`;
    html += `<button class="${cls}" style="left:${x}%;top:${y}%;--s:${sc_}" data-n="${n}" data-tip="${tip}"${can ? '' : ' disabled'}>${inner}</button>`;
  }
  // 远处一段未到的关，收成一组标签
  const runs = [];
  far.forEach((n) => { const r = runs[runs.length - 1]; if (r && r[r.length - 1] === n - 1) r.push(n); else runs.push([n]); });
  runs.filter((r) => r.length > 1).forEach((r) => {
    const mid = sc.pts[r[0] - 1];
    html += `<span class="grp" style="left:${mid[0]}%;top:${mid[1] + 2.5}%">第${cnNum(r[0])}至${cnNum(r[r.length - 1])}关</span>`;
  });
  // 点线：Catmull-Rom 平滑穿过各关的落脚点
  const P = sc.pts, Y = (q) => q * 0.5625, curve = (ps) => ps.map((p, i) => {
    if (!i) return `M${p[0]} ${Y(p[1])}`;
    const a = ps[i - 2] || ps[i - 1], b = ps[i - 1], c = p, d = ps[i + 1] || p;
    return `C ${b[0] + (c[0] - a[0]) / 6} ${Y(b[1] + (c[1] - a[1]) / 6)}, ${c[0] - (d[0] - b[0]) / 6} ${Y(c[1] - (d[1] - b[1]) / 6)}, ${c[0]} ${Y(c[1])}`;
  }).join(' ');
  html = `<svg viewBox="0 0 100 56.25" preserveAspectRatio="none"><path class="todo" d="${curve(P)}"/><path class="walk" d="${curve(P.slice(0, next ?? m.total))}"/></svg>` + html;
  nodes.innerHTML = html;
  nodes.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { selStage = +b.dataset.n; renderFight(); });
}
/* 没有场景图的据点（原型里只画了顾家绸庄）：退回一条墨线小路 */
function renderTrail(m, next) {
  const Yp = (x) => 64 + 26 * Math.sin(x * Math.PI * 2.2 + 0.6) - 10 * x;
  const N = 120, pts = Array.from({ length: N + 1 }, (_, i) => [i / N, Yp(i / N)]);
  const pos = (n) => (n - 0.5) / m.total * 0.94 + 0.03;
  const d = (upto) => pts.filter(([x]) => x <= upto).map(([x, y], i) => `${i ? 'L' : 'M'}${x * 1000} ${y}`).join(' ');
  const doneX = m.done ? pos(Math.min(next ?? m.total, m.total)) : 0;
  trk.className = 'trail';
  trk.innerHTML = `<svg viewBox="0 0 1000 128" preserveAspectRatio="none"><path class="todo" d="${d(1)}"/><path class="walk" d="${d(doneX)}"/></svg>` +
    Array.from({ length: m.total }, (_, i) => {
      const n = i + 1, x = pos(n), role = stageRole(m, n), done = n <= m.done;
      const can = done || n === next || (peek && n === selStage), w = stageInfo(m, n).who;
      const inner = role ? `<span class="seal ${role}${done ? ' got' : ''}">${SEAL_CH[role]}</span>` : '<i></i>';
      return `<button class="st${done ? ' done' : ''}${n === next ? ' cur' : ''}${n === selStage ? ' sel' : ''}" style="left:${x * 100}%;top:${Yp(x) / 128 * 100}%" data-n="${n}" data-tip="${w ? whoTip(m, w) : `第${cnNum(n)}关`}"${can ? '' : ' disabled'}>${inner}</button>`;
    }).join('') +
    (next ? `<span class="lab" style="left:${pos(next) * 100}%;top:${(Yp(pos(next)) + 16) / 128 * 100}%">第${cnNum(next)}关</span>` : '');
  trk.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { selStage = +b.dataset.n; renderFight(); });
}
function renderFight() {
  const m = allMaps().find((x) => x.id === selMap), fac = facOf(m.id);
  const next = m.done < m.total ? m.done + 1 : null;
  if (selStage === null) selStage = next ?? m.total;
  mapName.textContent = m.name;
  mapOf.innerHTML = fac ? `<span class="seal ${fac.al === 'z' ? 'aide' : 'boss'}" style="width:18px;height:18px;font-size:11px">${fac.al === 'z' ? '正' : '邪'}</span>${fac.fac} · ${m.layer === '门户' ? '门户' : '外围'}` : '赶路';
  mapProg.innerHTML = m.done >= m.total ? '已破' : `已过 <b>${m.done}</b> / ${m.total} 关`;
  const sc = SCENES[m.scene];
  scene.classList.toggle('flat', !sc);
  stage.classList.toggle('has-scene', !!sc);
  scene.style.setProperty('--scene-art', sc ? `url('${sc.art}')` : 'none');
  if (sc) { trk.innerHTML = ''; trk.className = ''; renderNodes(m, next); } else { nodes.innerHTML = ''; renderTrail(m, next); }
  const s = stageInfo(m, selStage), role = stageRole(m, selStage);
  if (s.who) {
    const h = s.who.name.match(/^(「.+」)(.+)$/);
    foeName.innerHTML = h ? `<span class="hao">${h[1]}</span>${h[2]}` : s.who.name;
    foeDesc.innerHTML = `<span data-tip="${whoTip(m, s.who)}">${fac.fac}${s.who.post}</span>`;
    foeHp.textContent = s.kind === 'boss' ? '21,800 / 21,800' : '9,960 / 9,960';
  } else {
    foeName.textContent = m.foe;
    foeDesc.textContent = fac ? `${fac.fac} · ${m.name}` : m.name;
    foeHp.textContent = '6,380 / 6,380';
  }
  foeBust.className = 'bust foe' + (s.who?.pt ? ' round' + (role === 'boss' ? ' boss' : '') : '');
  foeBust.style.setProperty('--bust', `url('${ART}${s.who?.pt ?? 'foe'}.png')`);
  fightBtn.textContent = `挑战第${cnNum(selStage)}关`;
  renderLog(m, s);
}
const CAUSE = {
  r: ['姑苏', '姑苏驿道近来多有剪径之徒，商旅往来皆结伴而行。'],
  a: ['千岩寺', '千岩寺今岁广开外客试炼，江南少年多往一试。'],
  b: ['会稽顾氏', '顾氏新主顾长风继立，广募江湖好手护院。'],
  c: ['花影坊', '秦淮画舫一夜失踪过客三人，坊间皆指花影坊所为。'],
};
function renderLog(m, s) {
  const [at, line] = CAUSE[m.id[0]];

    <div class="cause"><span class="at">${at}</span><span>${line}</span></div>
    ${m.id === 'a2' ? '<div class="rumor"><span class="at">江湖传闻</span><span>黑风盟主阎彪沉疴不起，盟中诸舵主暗自角力。</span></div>' : ''}
    <div class="rh">【第一回合】</div>
    <div class="p"><span class="me">你</span>一式松涛剑法递出，剑意未至，<span class="foe">${foe}</span>已觉寒气扑面，侧身稍迟，肩头着了一记，<span class="dm">1,284</span>。</div>
    <div class="p"><span class="foe">${foe}</span>沉肩回撞，<span class="me">你</span>借势退开半步，只受了 <span class="dm">412</span>。</div>
    <div class="rh">【第二回合】</div>
    <div class="p"><span class="me">你</span>使出<span class="sk">一式「松风入壑」</span>，剑光过处，<span class="foe">${foe}</span>踉跄后退，<span class="dm">2,016</span>。</div>
    ${s.kind === 'boss' && m.id === 'a2' ? `<div class="p win">${foe}收棍合十：「后生可畏，老衲让了。」</div>` : ''}`;
}

/* ═══════ 江湖编年（常驻右栏） ═══════
   类别：此身（玩家名，墨金）· 正道 · 邪道 · 朝廷 · 江湖（世家、帮会等）· 大事（朱砂淡底） */
const CAT = { zheng: '正道', xie: '邪道', court: '朝廷', jh: '江湖', big: '大事' };
const NOW = [
  ['me', '江湖历 220 年 春', '沈砚破千岩寺云栈香市，知客僧慧远不敌。'],
  ['xie', '江湖历 220 年 春', '夜阑风雨楼「惊蛰」易人，新惊蛰来历不明。'],
  ['xie', '江湖历 219 年 冬', '黑风盟主阎彪沉疴不起，盟中诸舵主暗自角力。'],
  ['court', '江湖历 219 年 秋', '镇关军移防陇右，关中驿道盘查转严。'],
  ['jh', '江湖历 218 年', '会稽顾氏家主顾承业病故，长子顾长风继立。'],
  ['me', '江湖历 218 年 春', '沈砚过苍崖派外客试炼，迎客峰剑师严孤舟让位闭关。'],
  ['big', '江湖历 217 年', '千蛇窟与苍崖派会于淮上，各折一名护法，两家自此结怨。'],
  ['zheng', '江湖历 217 年', '乾元观新掌教即位，闭山三月。'],
  ['me', '江湖历 216 年 秋', '沈砚破蒿里寨，寨主胡七败走。'],
  ['jh', '江湖历 215 年 夏', '蒿里寨主胡七誓寻「快剑」陆青传人。'],
  ['me', '江湖历 215 年 春', '会稽少年沈砚，年十八，始入江湖。'],
];
const PAST = [
  ['第三世', '陆青', '「快剑」', '江湖历 170 — 215 年 · 卒于洛阳，年六十三', [
    ['me', '江湖历 190 年 冬', '陆青破黑风盟北岭分舵，江湖始称「快剑陆青」。'],
    ['jh', '江湖历 174 年', '黑风盟主阎奎卒，其弟阎彪继立。'],
    ['me', '江湖历 174 年 秋', '陆青破蒿里寨，寨主「独眼」胡三败走。'],
    ['me', '江湖历 170 年 春', '洛阳少年陆青，年十八，始入江湖。']]],
  ['第二世', '林晚', '', '江湖历 146 — 170 年 · 殁于淮北，年四十二', [
    ['me', '江湖历 170 年 冬', '林晚独闯淮霜堂，殁于淮北。'],
    ['me', '江湖历 146 年 春', '淮阴女子林晚，年十八，始入江湖。']]],
  ['第一世', '周伯安', '', '江湖历 100 — 146 年 · 卒于齐鲁，年六十四', [
    ['me', '江湖历 100 年 夏', '周伯安败于江湖人之手，得前辈传功。'],
    ['me', '江湖历 100 年 春', '泰安少年周伯安，年十八，始入江湖。']]],
];
const evHtml = ([c, y, t], who, fresh) => `<div class="ev ${c}${fresh ? ' fresh' : ''}"><div class="h"><span class="cat">${c === 'me' ? who : CAT[c]}</span><span class="yr">${y}</span></div><div class="tx">${t}</div></div>`;
let dockTab = 'now', newsN = 0, feedStyle = 'head', chip = 'all';
const D = '〇一二三四五六七八九';
const cnNum = (n) => { const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10;
  return (h ? D[h] + '百' : '') + (t ? (t === 1 && !h ? '' : D[t]) + '十' : (h && o ? '零' : '')) + (o ? D[o] : ''); };
const yrOf = (y) => +y.match(/(\d+)/)[1], seasonOf = (y) => (y.match(/年 (.)$/) || [])[1] || '';
const catName = (c, who) => c === 'me' ? who : CAT[c];
const COLORS = { me: 'var(--ink-gold)', zheng: 'var(--zheng)', xie: 'var(--xie)', court: 'var(--court)', jh: 'var(--jh)', big: 'var(--cinnabar)' };
function yearHtml(evs, who, fresh, legend) {
  const groups = [];
  evs.forEach((e, i) => { const y = yrOf(e[1]); let g = groups[groups.length - 1]; if (!g || g.y !== y) groups.push(g = { y, list: [] }); g.list.push([e, i]); });
  return (legend ? `<div class="legend">${Object.keys(COLORS).map((c) => `<span><i style="background:${COLORS[c]}"></i>${catName(c, who)}</span>`).join('')}</div>` : '') +
    groups.map((g) => `<div class="yb"><div class="y">${cnNum(g.y)}年</div><ol>${g.list.map(([[c, y, t], i]) =>
      `<li class="${c}${fresh && !i ? ' fresh' : ''}" data-tip="${catName(c, who)}">${seasonOf(y) ? `<span class="s">${seasonOf(y)}</span>` : ''}${t}</li>`).join('')}</ol></div>`).join('');
}
function nowHtml(evs, who, fresh) {
  if (feedStyle === 'year') return yearHtml(evs, who, fresh, true);
  if (false) {
    const groups = [];
    evs.forEach((e, i) => { const y = yrOf(e[1]); let g = groups[groups.length - 1]; if (!g || g.y !== y) groups.push(g = { y, list: [] }); g.list.push([e, i]); });
    return `<div class="legend">${Object.keys(COLORS).map((c) => `<span><i style="background:${COLORS[c]}"></i>${catName(c, who)}</span>`).join('')}</div>` +
      groups.map((g) => `<div class="yb"><div class="y">${cnNum(g.y)}年</div><ol>${g.list.map(([[c, y, t], i]) =>
        `<li class="${c}${fresh && !i ? ' fresh' : ''}" data-tip="${catName(c, who)}">${seasonOf(y) ? `<span class="s">${seasonOf(y)}</span>` : ''}${t}</li>`).join('')}</ol></div>`).join('');
  }
  if (feedStyle === 'vert') {
    // 编年体：一年一段，年号起头，同季的事不重复写季，事与事连写
    const groups = [];
    evs.forEach((e, i) => { const y = yrOf(e[1]); let g = groups[groups.length - 1]; if (!g || g.y !== y) groups.push(g = { y, list: [] }); g.list.push([e, i]); });
    return `<div class="vv-now">第四世　${who}</div>` + groups.map((g) => {
      let last = null;
      const body = g.list.slice().reverse().map(([[c, y, t]]) => {
        const ss = seasonOf(y), lead = ss && ss !== last ? `<span class="ss">${ss}，</span>` : ''; last = ss || last;
        return `${lead}<span class="ev-v ${c}" data-tip="${catName(c, who)}">${t}</span>`;
      }).join('');
      return `<p class="vv${fresh && g === groups[0] ? ' fresh' : ''}"><span class="y">${cnNum(g.y)}年</span>　${body}</p>`;
    }).join('');
  }
  if (feedStyle === 'head') {
    const top = evs.find((e) => e[0] === 'big');
    const rest = evs.filter((e) => e !== top && (chip === 'all' || e[0] === chip));
    const chips = [['all', '全部'], ['me', who], ['zheng', '正道'], ['xie', '邪道'], ['court', '朝廷'], ['jh', '江湖']];
    return (top ? `<div class="hd${fresh && evs[0] === top ? ' fresh' : ''}"><div class="k">江湖大事<span>${top[1]}</span></div><div class="t">${top[2]}</div></div>` : '') +
      `<div class="chips">${chips.map(([k, n]) => `<button data-chip="${k}" aria-pressed="${chip === k}">${n}</button>`).join('')}</div>` +
      rest.map(([c, y, t], i) => `<p class="brief ${c}${fresh && !i && evs[0] !== top ? ' fresh' : ''}"><b>${catName(c, who)}</b>${t}<span class="yr">${y.replace('江湖历 ', '')}</span></p>`).join('');
  }
  return `<div class="now"><b>第四世 · ${who}</b>　江湖历 215 年至今</div>` + evs.map((e, i) => evHtml(e, who, fresh && i === 0)).join('');
}
function renderFeed(freshFirst) {
  feed.classList.toggle('vert', dockTab === 'now' && feedStyle === 'vert');
  if (dockTab === 'now') {
    feed.innerHTML = nowHtml(NOW, '沈砚', freshFirst);
    feed.querySelectorAll('[data-chip]').forEach((b) => b.onclick = () => { chip = b.dataset.chip; renderFeed(); });
  } else {
    feed.innerHTML = PAST.map(([n, name, hao, end, evs]) => `<div class="past">
      <button aria-expanded="false"><span class="n">${n}</span><span class="nm">${hao ? `<span class="hao">${hao}</span>` : ''}${name}</span><span class="chev">▶</span><span class="end">${end}</span></button>
      <div class="bd"><div>${yearHtml(evs, name)}</div></div></div>`).join('');
    feed.querySelectorAll('.past > button').forEach((b) => b.onclick = () => {
      const p = b.parentElement, on = !p.hasAttribute('data-open'); p.toggleAttribute('data-open', on); b.setAttribute('aria-expanded', on);
    });
  }
}

document.querySelectorAll('.dock .tabs button').forEach((b) => b.onclick = () => {
  dockTab = b.dataset.t;
  document.querySelectorAll('.dock .tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  renderFeed();
});

/* ═══════ 控制条 ═══════ */
map.style.setProperty('--map-art', "url('../../code/public/art/jianghu-map-2.jpg')");

/* ═══════ 页签与编年摆法 ═══════
   B：修炼、战斗是「看着挂机」的页，编年常驻；其余是「动手操作」的页，编年收成窄边，有新事记数 */
const TABS = ['修炼', '战斗', '行囊', '武功', '门派', '市集', '前尘'];
const WATCH = ['修炼', '战斗'];
let tab = '战斗', dockMode = 'B', unread = 0, unreadBig = false;
const shell = document.querySelector('.shell');
const PH = {
  修炼: `<div class="ph-grid" style="grid-template-columns: 1.4fr 1fr"><div class="ph" style="height:420px"></div><div class="ph-grid"><div class="ph" style="height:130px"></div><div class="ph" style="height:130px"></div><div class="ph" style="height:130px"></div></div></div>`,
  行囊: `<div class="ph-grid" style="grid-template-columns: 220px 1fr"><div class="ph-grid">${'<div class="ph" style="height:96px"></div>'.repeat(4)}</div><div class="ph-grid" style="grid-template-columns: repeat(auto-fill, minmax(64px, 1fr))">${'<div class="ph" style="aspect-ratio:1"></div>'.repeat(30)}</div></div>`,
  武功: `<div class="ph-grid" style="grid-template-columns: 1fr 1.3fr"><div class="ph-grid" style="grid-template-columns: repeat(3, 1fr)">${'<div class="ph" style="aspect-ratio:3/4"></div>'.repeat(9)}</div><div class="ph" style="min-height:460px"></div></div>`,
  门派: `<div class="ph-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))">${'<div class="ph" style="height:150px"></div>'.repeat(6)}</div>`,
  市集: `<div class="ph-grid" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))">${'<div class="ph" style="height:170px"></div>'.repeat(8)}</div>`,
  前尘: `<div class="ph-grid" style="grid-template-columns: 1fr 1fr"><div class="ph" style="height:300px"></div><div class="ph" style="height:300px"></div><div class="ph" style="height:200px;grid-column:1/3"></div></div>`,
};
function renderNav() {
  nav.innerHTML = TABS.map((t) => `<button${t === tab ? ' aria-current="page"' : ''}>${t}</button>`).join('');
  nav.querySelectorAll('button').forEach((b) => b.onclick = () => setTab(b.textContent));
}
function setTab(t) {
  tab = t;
  const battle = t === '战斗';
  document.getElementById('v-map').hidden = !battle;
  document.getElementById('v-fight').hidden = true;
  stage.classList.remove('arted');
  const pg = document.getElementById('v-page');
  pg.hidden = battle;
  if (!battle) pg.innerHTML = `<header class="jh-head"><h1>${t}</h1></header><p class="ph-note">原型占位：此页内容不在本轮范围，只示意版面宽度。</p>${PH[t]}`;
  renderNav(); applyDock();
}
function applyDock() {
  const min = dockMode === 'B' && !WATCH.includes(tab);
  shell.classList.toggle('dock-min', min);
  if (!min) { shell.classList.remove('dock-open'); unread = 0; unreadBig = false; }
  renderUnread();
}
function renderUnread() {
  unreadEl.hidden = !unread; unreadEl.textContent = unread; unreadEl.classList.toggle('big', unreadBig);
}
const unreadEl = document.getElementById('unread');
edge.onclick = () => { shell.classList.add('dock-open'); unread = 0; unreadBig = false; renderUnread(); };
dockClose.onclick = () => shell.classList.remove('dock-open');
document.addEventListener('click', (e) => {
  if (shell.classList.contains('dock-open') && !e.target.closest('.dock') && !e.target.closest('.proto-bar')) shell.classList.remove('dock-open');
});
dockSeg.querySelectorAll('button').forEach((b) => b.onclick = () => {
  dockSeg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  dockMode = b.dataset.d; applyDock();
});
document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => {
  const g = b.dataset.go;
  if (g === 'news') {
    const POOL = [['big', '江湖历 220 年 夏', '鸣沙教东出玉门，河西三镇闭城自守。'], ['zheng', '江湖历 220 年 夏', '苍梧派掌门寿终，首徒韩铮继任。'], ['jh', '江湖历 220 年 夏', '鸣镝镖局总镖头遇伏于淮北，镖银尽失。']];
    NOW.unshift(POOL[newsN++ % POOL.length]);
    if (shell.classList.contains('dock-min') && !shell.classList.contains('dock-open')) { unread++; unreadBig ||= NOW[0][0] === 'big'; renderUnread(); }
    dockTab = 'now'; document.querySelectorAll('.dock .tabs button').forEach((x) => x.setAttribute('aria-selected', x.dataset.t === 'now'));
    renderFeed(true); feed.scrollTop = 0; feed.scrollLeft = 0; return;
  }
  if (tab !== '战斗') setTab('战斗');
  if (!document.getElementById('v-fight').hidden) fightBack.onclick();
  if (g === 'map') setZoom(false);
  if (g === 'vol') setZoom(true);
  if (g === 'warden') { setZoom(true); openFight('a1'); selStage = 20; renderFight(); }
  if (g === 'boss') { setZoom(true); peek = true; openFight('a2'); selStage = 20; renderFight(); peek = false; }
});
wake.onclick = () => { cer.hidden = false; };
wakeGo.onclick = () => { cer.hidden = true; };
addEventListener('keydown', (e) => { if (e.key === 'Escape') cer.hidden = true; });

/* ═══════ 悬停提示 ═══════ */
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.classList.remove('on'); return; }
  tip.innerHTML = t.dataset.tip;
  const r = t.getBoundingClientRect();
  tip.classList.add('on');
  const w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (r.bottom + 8) + 'px';
});

const setBarH = () => document.documentElement.style.setProperty('--bar-h', document.querySelector('.proto-bar').offsetHeight + 'px');
setBarH(); addEventListener('resize', setBarH);
buildMap();
setZoom(false);
renderFeed();
setTab('战斗');
</script>
