<title>门派页改版原型</title>
<!--
  门派改造（docs/systems/sect-overhaul/design.md v0.4）· 门派页原型
  器物型页：拜山是一排石碑，地位是一挂腰牌，差事是一筒竹签，兑换是一架多宝格。信息长在器物上，不装通用卡片。
  外壳照现行 code/src/App.tsx：人物卷侧栏 + 舞台；≤860px 换顶部资源条 + 底部页签栏。底图沿用 code/public/art/sect.jpg。

  视图（右下角白色面板切换，不是设计内容）：
  · 未拜入：卷二 · 两淮三家石碑（苍崖派 / 千帆帮 / 千蛇窟）；点碑选中，下方主按钮「拜入 苍崖派」，帮会写「入伙 千帆帮」。
    面板「卷三」切到已到江南：千岩寺、花影坊两块碑带金点出现。
  · 苍崖派（大派三档内功 + 兼修惊鸿进阶「飞泉诀」），默认第三级内门弟子、递送剑帖进行中。
  · 千帆帮（小门小户、帮会称谓、无绝学、无镇派内功），默认第四级舵主：第四级在货架上没有新段，第五级只多一件镇浪铁篙。
  · 拜入后也可从面板切任一级地位、空闲 / 进行中、贡献宽裕 / 拮据；「交差」把进行中的差事直接走完，贡献从签旁浮起，够了就升一级。

  未解锁的取舍（同一条规矩用在差事与货架上）：
  · 地位腰牌六块全挂出来，未到的压暗——这是进度，本就该看得见终点。
  · 差事签与货架段：已解锁的全显示；「下一级」只露一个背影——竹签反扣无字、货架段挂着竹帘只透出几件东西的轮廓，
    悬停才说「亲传弟子可领 / 可换」；再往后的整段隐藏。这样不剧透名字与价钱，但眼前这一级的盼头摆在那儿。
  · 升级时新解锁的那根签与那段货架带金点出现（看过即灭），对应的腰牌亮起一圈烛光。
  · 隐世门派碧磷洞（卷九、凭因缘才拜得）在拜山页上完全不出现；没到的卷整卷不出现。

  数字：贡献 / 门槛 / 价钱都是占位（待 sim）。门槛按「每级大致同样时长」粗排：600 / 1600 / 3100 / 5500 / 9400；
  差事每时贡献照 design.md §5（2 小时 20/32/50/80/130/200，8 小时七五折）。数字用文楷 600、不开等宽数字、不加千分位。
  装备图是现有图标顶替（松纹剑用青锋剑图等），42 件门派装备图待生成；装备品阶（上乘 / 珍品）为占位。
  新类名一律 mp- 前缀，已查过 code/src/styles 无撞名（行囊 .g1–.g5、.slip、.ledger 都避开了）。
-->

.mp-slip.back::before { content: ''; position: absolute; inset: 22px 19px 40px; border-left: 1px solid oklch(0.22 0.02 60 / 0.6); border-right: 1px solid oklch(0.4 0.03 70 / 0.3); }

/* 残页：撕下的一角书页，边缘着品质色 */
.mp-page { position: relative; width: 58px; height: 78px; transform: rotate(-4deg); filter: drop-shadow(0 6px 10px oklch(0.05 0.01 262 / 0.55)) drop-shadow(0 0 1px var(--qa));

/* 装备：道具图 + 品阶描边、底晕、角标 */
.mp-gear { position: relative; width: 58px; height: 88px; border-radius: 6px; display: grid; place-items: center;

/* 浮字：操作反馈浮在对象旁 */
.mp-float { position: fixed; z-index: var(--z-float); pointer-events: none; font-family: var(--font-body); font-weight: 600; font-size: 17px; color: var(--gold); white-space: nowrap;

<script>
const A = '../../code/public/art/';
const CAT_IMG = { 剑: 'jian', 刀: 'dao', 枪: 'qiang', 棍: 'gun', 拳: 'quan', 掌: 'zhang', 指: 'zhi', 腿: 'tui', 暗器: 'anqi' };

// 地位门槛（本世累计贡献，占位待 sim）

/** 按 §4 兑换资格排一家的货架：键 = 解锁的地位级 */
function shelfOf(id) {
  const d = SECTS[id], sh = {};
  const put = (lv, it) => (sh[lv] = sh[lv] || []).push(it);
  const ngItem = (name, q, route, k) => ({ id: name, kind: 'ng', name, q, route, price: PRICE[k] });
  d.common.forEach(([n, c]) => put(1, { id: n, kind: 'wx', name: n, cat: c, q: 1, price: PRICE.wx }));
  put(1, ngItem(d.ng[0], 1, d.route, 'ng1'));
  if (d.side && d.side.lv === 1) put(1, ngItem(d.side.name, 1, d.side.route, 'ng1'));
  put(2, { id: d.upper[0], kind: 'pg', name: d.upper[0], form: d.upper[1], q: 2, price: PRICE.pg2 });
  put(2, { id: d.gear[0][0], kind: 'gear', name: d.gear[0][0], img: d.gear[0][1], grade: '上乘', price: PRICE.gear1 });
  put(3, ngItem(d.ng[1], 2, d.route, 'ng2'));
  if (d.side && d.side.lv === 3) put(3, ngItem(d.side.name, 2, d.side.route, 'ng2'));
  d.jue.forEach((n) => put(4, { id: n, kind: 'pg', name: n, form: '第一式', q: 3, price: PRICE.pg3 }));
  if (d.ng[2]) put(5, ngItem(d.ng[2], 3, d.route, 'ng3'));
  put(5, { id: d.gear[1][0], kind: 'gear', name: d.gear[1][0], img: d.gear[1][1], grade: '珍品', price: PRICE.gear2 });
  return sh;
}

// ───────── 状态
const S = { view: 'home', sect: 'cangya', cum: 2140, bal: 860, owned: new Set(['百川诀', '松涛剑法']), sel: 3, dur: 8,
  task: { tier: 3, dur: 8, start: Date.now() - (2 * 3600 + 48 * 60) * 1000 }, fresh: new Set(), vol3: false, pick: 'cangya', rise: 0, arrive: 0 };
const level = () => { let l = 1; for (let i = 2; i <= 6; i++) if (S.cum >= NEED[i]) l = i; return l; };
const gainOf = (tier, dur) => (dur === 2 ? RATE2[tier] * 2 : RATE8[tier] * 8);
const endOf = (t) => t.start + t.dur * 3600 * 1000;

// ───────── 渲染
const page = document.getElementById('page');
const esc = (s) => String(s);

function render() {
  document.body.dataset.view = S.view;
  page.innerHTML = S.view === 'join' ? joinHTML() : homeHTML();
  if (S.view === 'home') tick();
  syncProto();
}

function camp(c) { return `<span class="mp-camp ${c === '正' ? 'z' : 'x'}" data-tip="${c}道">${c}</span>`; }
function rtTag(route) { return `<span class="mp-rt t-${ROUTE_TONE[route]}">${route}</span>`; }

function joinHTML() {
  const vols = VOLS.filter((v) => v.no === 2 || S.vol3);
  const d = SECTS[S.pick];
  return `<header class="mp-head"><div class="mp-title"><h1>拜山</h1></div></header>
  ${vols.map((v) => `<section class="mp-vol">
    <div class="mp-vol-h">卷${CN[v.no]}<span class="rg">${v.region}</span></div>
    <div class="mp-steles" role="radiogroup" aria-label="${v.region}的门派">
    ${v.ids.map((id) => { const s = SECTS[id]; return `<button type="button" class="mp-stele${v.no === 3 ? ' arrive' : ''}" role="radio" aria-checked="${S.pick === id}" data-pick="${id}">
      <div class="stone">${v.no === 3 ? '<span class="jh-fresh fresh"></span>' : ''}${camp(s.camp)}
        <span class="nm">${s.name}</span>
        <span class="facts">
          <span class="tier">${s.tier}</span>
          <span data-tip="${s.size === '大派' ? '入门 · 进阶 · 镇派三档内功' : '入门 · 进阶两档内功'}">${s.size}</span>
          ${rtTag(s.route)}
          <span class="cats">${s.cats.map((c) => `<i class="mp-cat" style="background-image:url('${A}cat/${CAT_IMG[c]}.png')" data-tip="${c}"></i>`).join('')}</span>
        </span>
      </div><div class="base"></div></button>`; }).join('')}
    </div></section>`).join('')}
  <div class="mp-join-foot"><button type="button" class="jh-btn" id="joinBtn">${d.join} ${d.name}</button></div>`;
}

function homeHTML() {
  const d = SECTS[S.sect], lv = level(), sh = shelfOf(S.sect);
  // 腰牌
  const plaques = d.titles.map((t, i) => {
    const k = i + 1, cls = k < lv ? 'done' : k === lv ? 'cur' : 'todo';
    const tip = k <= lv ? `累计 ${NEED[k]} 贡献` : `累计 ${NEED[k]} 贡献可升`;
    return `<div class="mp-plaque ${cls}${S.rise === k ? ' rise' : ''}" data-tip="${tip}"><div class="wood"><b>${t}</b></div></div>`;
  }).join('');
  // 进度线：腰牌中心之间按段插值
  const seg = 100 / 5;
  let pct = (lv - 1) * seg;
  if (lv < 6) pct += seg * Math.min(1, (S.cum - NEED[lv]) / (NEED[lv + 1] - NEED[lv]));
  const track = `<div class="mp-track"><span class="todo"></span><span class="done" style="width:${pct}%"></span><span class="tip" style="left:${pct}%" data-tip="累计 ${S.cum} 贡献"></span>
    ${lv < 6 ? `<span class="need num" style="left:${lv * seg}%">${NEED[lv + 1]}</span>` : ''}</div>`;

  // 差事签：已解锁的全显示，下一级反扣，再后隐藏
  const run = S.task;
  const slips = d.errands.map((n, i) => {
    const k = i + 1;
    if (k > lv + 1) return '';
    if (k === lv + 1) return `<button type="button" class="mp-slip back" disabled data-tip="${d.titles[k - 1]}可领"></button>`;
    const isRun = run && run.tier === k;
    const tip = `每时 ${RATE2[k]} 贡献 · 8 小时每时 ${RATE8[k]}`;
    return `<button type="button" class="mp-slip${isRun ? ' run' : ''}${S.arrive === k ? ' arrive' : ''}" aria-pressed="${!run && S.sel === k}" ${run ? 'disabled' : ''} data-slip="${k}" data-tip="${tip}">
      ${S.fresh.has('s' + k) ? '<span class="jh-fresh"></span>' : ''}<span class="nm">${n}</span><span class="rate num">${RATE2[k]}/时</span></button>`;
  }).join('');

  let ticket;
  if (run) {
    ticket = `<div class="mp-incense" id="incense">
      <div class="who"><span class="serif">${d.errands[run.tier - 1]}</span><span class="rk">${run.dur} 小时</span></div>
      <div class="line"><span class="todo"></span><span class="done" id="incDone"></span><span class="ember" id="incEmber"></span></div>
      <div class="meta"><span class="left" id="incLeft"></span><span class="gain">+<span class="num">${gainOf(run.tier, run.dur)}</span> 贡献</span></div>
    </div>`;
  } else {
    const k = Math.min(S.sel, lv);
    ticket = `<div class="who"><span class="serif">${d.errands[k - 1]}</span></div>
      <div class="mp-durs">${[2, 8].map((h) => `<button type="button" class="mp-dur" aria-pressed="${S.dur === h}" data-dur="${h}" data-tip="每时 ${h === 2 ? RATE2[k] : RATE8[k]} 贡献">
        <span class="h">${h} 小时</span><span class="g num">+${gainOf(k, h)}</span></button>`).join('')}</div>
      <button type="button" class="jh-btn" id="goBtn">派出</button>`;
  }

  // 货架
  const rows = [1, 2, 3, 4, 5].map((k) => {
    const items = sh[k];
    if (!items || k > lv + 1) return '';
    const veil = k > lv;
    const fresh = S.fresh.has('w' + k);
    const tag = `<div class="mp-tag"${veil ? ` data-tip="${d.titles[k - 1]}可换"` : ''}>${fresh ? '<span class="jh-fresh"></span>' : ''}<b>${d.titles[k - 1]}</b></div>`;
    if (veil) {
      return `<div class="mp-tierrow veil">${tag}<div class="mp-blind" data-tip="${d.titles[k - 1]}可换">${items.map((it) => `<span class="ghost${it.kind === 'gear' ? ' gear' : ''}"><i></i></span>`).join('')}</div></div>`;
    }
    return `<div class="mp-tierrow${S.arrive === k ? ' arrive' : ''}" data-row="${k}">${tag}<div class="mp-wares">${items.map(wareHTML).join('')}</div></div>`;
  }).join('');

  return `<header class="mp-head">
    <div class="mp-title"><h1>${d.name}</h1>
      <div class="mp-marks">${camp(d.camp)}<span class="tier">${d.tier}</span>${rtTag(d.route)}${d.side ? rtTag(d.side.route) : ''}</div></div>
    <div class="mp-ledger">
      <div class="cell"><span class="k">贡献</span><span class="v num" id="bal">${S.bal}</span></div>
      <div class="cell"><span class="k">累计</span><span class="v sm num" id="cum">${S.cum}</span></div>
    </div>
  </header>
  <section class="mp-rack" aria-label="地位"><span class="cord"></span><div class="mp-plaques">${plaques}</div>${track}</section>
  <div class="mp-lower">
    <section><h2 class="mp-sec">差事</h2>
      <div class="mp-tube"><div class="mp-slips">${slips}</div><div class="mouth"></div></div>
      <div class="mp-ticket">${ticket}</div>
    </section>
    <section><h2 class="mp-sec">兑换</h2><div class="mp-shelf">${rows}</div></section>
  </div>`;
}

function wareHTML(it) {
  const owned = S.owned.has(it.id);
  let obj, q = '', sub = '', tip = '';
  if (it.kind === 'wx') {
    q = 'mp-q1'; tip = `寻常 · ${it.cat} · 全本`;
    obj = `<span class="mp-book wx"><span class="cv"></span><span class="sl">${it.name}</span><span class="seal">${it.cat === '暗器' ? '镖' : it.cat}</span></span>`;
  } else if (it.kind === 'ng') {
    q = 'mp-q' + it.q; tip = `${['', '入门', '进阶', '镇派'][it.q]}内功 · ${it.route}`;
    obj = `<span class="mp-book ng q${it.q} t-${ROUTE_TONE[it.route]}"><span class="cv"></span><span class="sl">${it.name}</span><span class="seal">${it.route[0]}</span></span>`;
  } else if (it.kind === 'pg') {
    q = 'mp-q' + it.q; sub = it.form; tip = `${it.q === 3 ? '绝学' : '上乘'}残页 · 一页一式`;
    obj = `<span class="mp-page q${it.q}"><i></i><b>${it.form}</b></span>`;
  } else {
    q = 'mp-gr-' + it.grade; tip = `${it.grade} · ${SECTS[S.sect].slot}`;
    obj = `<span class="mp-gear"><img src="${A}gear/${it.img}.png" alt=""></span>`;
  }
  const nameColor = it.kind === 'gear' ? ` style="color:var(--gc)"` : '';
  const short = it.price - S.bal;
  const act = owned ? `<span class="mp-got">已得</span>`
    : `<button type="button" class="mp-buy" data-buy="${it.id}" data-price="${it.price}" ${short > 0 ? 'disabled' : ''}><b>${it.price}</b> 贡献</button>${short > 0 ? `<span class="mp-short">还差 <span class="num">${short}</span></span>` : ''}`;
  return `<div class="mp-ware ${q}${owned ? ' owned' : ''}" data-ware="${it.id}"><span class="obj" data-tip="${tip}">${obj}</span><span class="nm"${nameColor}>${it.name}${sub ? `<span class="sub">${sub}</span>` : ''}</span>${act}</div>`;
}

// ───────── 计时
function fmtLeft(ms) {
  const min = Math.max(0, Math.ceil(ms / 60000)), h = Math.floor(min / 60);
  return h > 0 ? `还剩 ${h} 小时 ${min % 60} 分` : `还剩 ${min} 分`;
}
function tick() {
  if (S.view !== 'home' || !S.task) return;
  const t = S.task, now = Date.now(), total = t.dur * 3600 * 1000, left = endOf(t) - now;
  if (left <= 0) return settle();
  const p = Math.max(0, Math.min(100, (1 - left / total) * 100));
  const done = document.getElementById('incDone'), ember = document.getElementById('incEmber'), lt = document.getElementById('incLeft');
  if (done) { done.style.width = p + '%'; ember.style.left = p + '%'; lt.textContent = fmtLeft(left); }
}
setInterval(tick, 1000);

function settle() {
  const t = S.task; if (!t) return;
  const g = gainOf(t.tier, t.dur), before = level();
  const anchor = document.querySelector(`[data-slip="${t.tier}"]`);
  const r = anchor && anchor.getBoundingClientRect();
  S.task = null; S.cum += g; S.bal += g; S.sel = t.tier;
  const after = level();
  S.rise = 0; S.arrive = 0;
  if (after > before) {
    S.rise = after; S.arrive = after;
    S.fresh.add('s' + after); if (shelfOf(S.sect)[after]) S.fresh.add('w' + after);
  }
  render();
  if (r) floatAt(r.left + r.width / 2, r.top - 8, `+${g}`);
  floatAtEl(document.getElementById('bal'), `+${g}`);
  if (after > before) { const pl = document.querySelectorAll('.mp-plaque')[after - 1]; floatAtEl(pl, SECTS[S.sect].titles[after - 1], 'seal'); }
}

// ───────── 浮字
function floatAt(x, y, text, cls = '') {
  const f = document.createElement('div'); f.className = 'mp-float ' + cls; f.textContent = text;
  f.style.left = x + 'px'; f.style.top = Math.max(36, y) + 'px'; document.body.appendChild(f);
  setTimeout(() => f.remove(), 1500);
}
function floatAtEl(el, text, cls) { if (!el) return; const r = el.getBoundingClientRect(); floatAt(r.left + r.width / 2, r.top - 14, text, cls); }

// ───────── 交互
page.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pick) { S.pick = b.dataset.pick; render(); return; }
  if (b.id === 'joinBtn') {
    const id = S.pick; Object.assign(S, { view: 'home', sect: id, cum: 0, bal: 0, owned: new Set(), task: null, sel: 1, fresh: new Set(), rise: 1, arrive: 0 });
    render(); floatAtEl(document.querySelector('.mp-head h1'), SECTS[id].join === '入伙' ? '入伙' : '入门', 'seal'); return;
  }
  if (b.dataset.slip) { const k = +b.dataset.slip; S.sel = k; S.fresh.delete('s' + k); S.arrive = 0; S.rise = 0; render(); return; }
  if (b.dataset.dur) { S.dur = +b.dataset.dur; S.arrive = 0; S.rise = 0; render(); return; }
  if (b.id === 'goBtn') {
    const k = Math.min(S.sel, level());
    S.task = { tier: k, dur: S.dur, start: Date.now() }; S.arrive = 0; S.rise = 0;
    render(); floatAtEl(document.querySelector(`[data-slip="${k}"]`), '领差', 'seal'); return;
  }
  if (b.dataset.buy) {
    const price = +b.dataset.price; if (S.bal < price) return;
    const r = b.getBoundingClientRect();
    S.bal -= price; S.owned.add(b.dataset.buy); S.arrive = 0; S.rise = 0;
    render(); floatAt(r.left + r.width / 2, r.top - 6, `−${price}`, 'spend');
  }
});
page.addEventListener('mouseover', (e) => {
  const row = e.target.closest('[data-row]');
  if (row && S.fresh.has('w' + row.dataset.row)) { S.fresh.delete('w' + row.dataset.row); const dot = row.querySelector('.mp-tag .jh-fresh'); if (dot) dot.remove(); }
});

// 悬停提示
const tip = document.getElementById('tip');
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]'); if (!t) { tip.classList.remove('on'); return; }
  tip.textContent = t.dataset.tip; tip.classList.add('on');
  const r = t.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + 'px';
});

// ───────── 原型控制
const proto = document.getElementById('proto');
function syncProto() {
  proto.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', S.view === 'join'));
  proto.querySelectorAll('[data-sect]').forEach((b) => b.setAttribute('aria-pressed', S.view === 'home' && S.sect === b.dataset.sect));
  proto.querySelectorAll('[data-vol3]').forEach((b) => b.setAttribute('aria-pressed', String(+S.vol3) === b.dataset.vol3));
  proto.querySelectorAll('[data-lv]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.lv === level()));
  proto.querySelectorAll('[data-task]').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.task === 'run') === !!S.task));
  proto.querySelectorAll('[data-rich]').forEach((b) => b.setAttribute('aria-pressed', (S.bal >= 3000) === (b.dataset.rich === '1')));
}
const PRESET = {
  cangya: { cum: 2140, bal: 860, owned: ['百川诀', '松涛剑法'], task: { tier: 3, dur: 8, ago: 2 * 3600 + 48 * 60 } },
  qianfan: { cum: 4020, bal: 1230, owned: ['赤胆功', '渡江棍法', '分水篙'], task: { tier: 4, dur: 2, ago: 38 * 60 } },
};
function setLevel(lv) {
  S.cum = NEED[lv] + Math.round((lv < 6 ? NEED[lv + 1] - NEED[lv] : 2000) * 0.55);
  if (S.task && S.task.tier > lv) S.task.tier = lv;
  S.sel = Math.min(S.sel, lv);
}
proto.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S.rise = 0; S.arrive = 0;
  if (b.id === 'fold') { proto.classList.toggle('folded'); b.textContent = proto.classList.contains('folded') ? '+' : '—'; return; }
  if (b.dataset.view) S.view = 'join';
  if (b.dataset.sect) {
    const p = PRESET[b.dataset.sect];
    Object.assign(S, { view: 'home', sect: b.dataset.sect, cum: p.cum, bal: p.bal, owned: new Set(p.owned), fresh: new Set(), sel: p.task.tier, dur: p.task.dur,
      task: { tier: p.task.tier, dur: p.task.dur, start: Date.now() - p.task.ago * 1000 } });
  }
  if (b.dataset.vol3) S.vol3 = b.dataset.vol3 === '1';
  if (b.dataset.lv) setLevel(+b.dataset.lv);
  if (b.dataset.task === 'idle') S.task = null;
  if (b.dataset.task === 'run' && !S.task) S.task = { tier: Math.min(S.sel, level()), dur: 8, start: Date.now() - 2 * 3600 * 1000 };
  if (b.dataset.rich) S.bal = b.dataset.rich === '1' ? 6000 : 180;
  if (b.id === 'finish') { if (!S.task) S.task = { tier: level(), dur: 8, start: Date.now() }; S.task.start = Date.now() - S.task.dur * 3600 * 1000 - 1000; settle(); return; }
  render();
});

// 地址参数：?view=join / ?sect=qianfan / ?lv=5，方便截图
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('sect') && PRESET[q.get('sect')]) proto.querySelector(`[data-sect="${q.get('sect')}"]`).click();
  if (q.get('view') === 'join') S.view = 'join';
  if (q.get('vol3')) S.vol3 = true;
  if (q.get('lv')) setLevel(+q.get('lv'));
  if (q.get('idle')) S.task = null;
  if (q.get('fold')) { proto.classList.add('folded'); document.getElementById('fold').textContent = '+'; }
  render();
})();
</script>
</body>
