.page-battle .bt-band .bb.hp .v { background: linear-gradient(to right, oklch(0.55 0.15 27), oklch(0.66 0.15 30)); }
.page-battle .bt-band .bb.qi .v { background: linear-gradient(to right, oklch(0.55 0.08 225), var(--qi)); }
.page-battle .bt-band .bb .sh { background: oklch(0.8 0.07 230 / 0.6); transition: transform .5s var(--ease-sharp); }
.page-battle .bt-band .bb.mirror { transform: scaleX(-1); }
/* 飘字：盖在底带之上，不受底带毛边遮罩裁切 */
.page-battle .bt-pops { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.page-battle .bt-pops .dmg { position: absolute; top: 38%; font-family: var(--font-display); font-weight: 700; font-size: 26px; color: oklch(0.72 0.17 30); text-shadow: 0 0 10px #000, 0 0 3px #000; animation: bt-dmgup 1.1s var(--ease-quart) forwards; }
.page-battle .bt-pops .dmg.crit { font-size: 36px; color: var(--gold); }
@keyframes bt-dmgup { 0% { opacity: 0; transform: translate(-50%, 6px) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -54px) scale(1); } }
/* 挑战按钮落在带内：金底卷云龙纹牌 */
.page-battle .bt-act { position: relative; margin-top: -70px; margin-bottom: 20px; display: grid; justify-items: center; gap: 12px; }
.page-battle .bt-duel-btn { border: 0; min-width: 320px; padding: 22px 56px; cursor: pointer; font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.4em; color: oklch(0.17 0.012 262);
  background: url('../../code/public/art/scene/duel-btn2.png') center / 100% 100% no-repeat; transition: filter .2s; }
.page-battle .bt-duel-btn:hover:not(:disabled) { filter: brightness(1.15); }
.page-battle .bt-duel-btn:disabled { cursor: default; filter: saturate(0.4) brightness(0.8); }
.page-battle .bt-duel-btn:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }
.page-battle .bt-act-sub { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }

/* 增减益标记（battle-status-prototype.html）：石印一行，己方靠左、敌方靠右；下挂三点 = 余几回合，最后一回合明暗呼吸；毒右下角标层数 */
.page-battle .fx-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; padding-bottom: 8px; }
.page-battle .side.enemy .fx-row { justify-content: flex-end; }
.page-battle .fx { position: relative; width: 30px; height: 30px; animation: fx-in .42s var(--ease-sharp); }
.page-battle .fx img { width: 30px; height: 30px; object-fit: contain; display: block; animation: fx-flash .7s ease-out; }
.page-battle .fx .pips { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); display: flex; gap: 3px; }
.page-battle .fx .pips span { width: 4px; height: 4px; border-radius: 50%; background: oklch(0.36 0.014 262); transition: background .3s, box-shadow .3s; }
.page-battle .fx.buff .pips span.on { background: var(--gold); box-shadow: 0 0 4px oklch(0.78 0.13 78 / 0.7); }
.page-battle .fx.debuff .pips span.on { background: var(--cinnabar); box-shadow: 0 0 4px oklch(0.66 0.14 32 / 0.7); }
.page-battle .fx .n { position: absolute; right: -5px; bottom: -5px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--bg-deep); color: var(--poison); font-size: 10.5px; line-height: 15px; text-align: center; font-weight: 700; box-shadow: 0 0 0 1px oklch(0.72 0.14 145 / 0.5); }
.page-battle .fx.last img { animation: fx-fade 1.2s ease-in-out infinite alternate; }
/* 层数角标随归属着色（毒绿是默认、己方金）；叠满待爆发时印面金光呼吸 */
.page-battle .fx.buff .n { color: var(--gold); box-shadow: 0 0 0 1px oklch(0.78 0.13 78 / 0.5); }
.page-battle .fx.brim img { animation: fx-brim .5s ease-in-out infinite alternate; }
@keyframes fx-brim { from { filter: drop-shadow(0 0 3px oklch(0.85 0.12 80 / 0.6)); } to { filter: brightness(1.35) drop-shadow(0 0 9px oklch(0.85 0.12 80)); } }
@keyframes fx-in { from { opacity: 0; transform: scale(1.5); } }

@keyframes fx-fade { to { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .page-battle .fx, .page-battle .fx img, .page-battle .fx.last img, .page-battle .fx.brim img { animation: none; } }
.jh-tip .fx-buff { color: var(--gold); }
.jh-tip .fx-debuff { color: oklch(0.74 0.13 32); }
.jh-tip .fx-du { color: var(--poison); }
.page-battle .fame { margin-top: 12px; font-size: 12.5px; color: var(--ink-gold); }

/* 挂机中状态条 */
.page-battle .idle-bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; padding: 10px 18px; border-radius: 10px; background: oklch(0.78 0.13 78 / 0.06); box-shadow: inset 0 0 0 1px oklch(0.78 0.13 78 / 0.25); font-size: 13px; color: var(--muted); }
.page-battle .idle-bar .serif { color: var(--gold); letter-spacing: 0.15em; }
.page-battle .idle-bar b { color: var(--ink); font-weight: 600; }
.page-battle .idle-bar .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: idle-pulse 1.6s ease-out infinite alternate; }
@keyframes idle-pulse { from { opacity: 1; } to { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .page-battle .idle-bar .pulse { animation: none; } }

/* ═══════ 战报：不装盒子，顶端墨色淡出；回合抬头 + 成段叙述 ═══════ */
.page-battle .bt-log-wrap { margin-top: 30px; }
.page-battle .bt-log {
  height: 250px; overflow-y: auto; padding: 6px 2px 4px; scroll-behavior: smooth;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 44px); mask-image: linear-gradient(to bottom, transparent, #000 44px);
  scrollbar-width: thin; scrollbar-color: oklch(0.3 0.016 262) transparent;
}
.page-battle .bt-log .empty { color: var(--faint); padding: 40px 0; text-align: center; font-family: var(--font-display); letter-spacing: 0.2em; }

.page-battle .bt-log .p { color: var(--muted); line-height: 1.85; padding: 1px 0; max-width: 46em; animation: bt-in .35s var(--ease-sharp); }
@keyframes bt-in { from { opacity: 0; transform: translateY(4px); } }
.page-battle .bt-log .p .me { color: var(--ink-gold); }
.page-battle .bt-log .p .foe { color: oklch(0.72 0.12 30); }
.page-battle .bt-log .p .sk { color: var(--qi); }
.page-battle .bt-log .p .dm { color: var(--ink); font-weight: 600; }
.page-battle .bt-log .p .cr { color: var(--crit); font-weight: 700; }
.page-battle .bt-log .p.win { color: var(--ink-gold); margin-top: 10px; }
.page-battle .bt-log .p.lose { color: var(--muted); margin-top: 10px; }
.page-battle .bt-log .p.loot { color: var(--gold); }

.page-battle .bt-log .p.loot .dup { color: var(--muted); }
.page-battle .bt-log .p.rumor { color: var(--muted); margin-bottom: 6px; }
.page-battle .bt-log .p.rumor .serif { color: var(--ink-gold); letter-spacing: 0.15em; }

/* ═══════ 战报 / 战况：同一处切换（issue #77，原型 docs/design/battle-stats-prototype.html） ═══════ */
.page-battle .bt-tabs { display: flex; gap: 26px; align-items: baseline; margin-bottom: 12px; }
.page-battle .bt-tabs button.jh-sec { position: relative; margin: 0; padding: 0 0 4px; border: 0; background: none; cursor: pointer; color: var(--faint); }
.page-battle .bt-tabs button.jh-sec[aria-selected="true"] { color: var(--ink); }
.page-battle .bt-tabs button.jh-sec[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0.25em; bottom: -2px; height: 1.5px; background: var(--ink-gold); }

.page-battle .bt-tabs .dot { position: absolute; right: -4px; top: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.page-battle .bt-tabs .res { margin-left: auto; font-family: var(--font-display); letter-spacing: 0.15em; font-size: 13px; color: var(--faint); }
.page-battle .bt-tabs .res.win { color: var(--ink-gold); }
.page-battle .bt-tabs .res.lose { color: var(--cinnabar); }

/* 战况：一本账，不装盒子；全用正文字体，只靠颜色分武学 / 路数 / 普攻 */
.page-battle .bt-tally { min-height: 250px; display: grid; grid-template-columns: auto minmax(0, 340px); justify-content: start; gap: 0 64px; align-content: start;
  padding: 6px 2px; font-family: var(--font-body); animation: tally-in .25s var(--ease-sharp); }
@keyframes tally-in { from { opacity: 0; } }
.page-battle .bt-tally .grp { display: grid; grid-template-columns: 200px 220px; gap: 0 52px; align-content: start; }
.page-battle .bt-tally .grp > .sh { grid-column: 1 / -1; }
.page-battle .bt-tally .sh { color: var(--faint); font-size: 13px; margin: 3px 0 6px; }
.page-battle .bt-tally .ledger { display: grid; align-content: start; }
.page-battle .bt-tally .li { display: flex; align-items: baseline; gap: 8px; min-height: 30px; padding: 3px 0; }
.page-battle .bt-tally .li .k { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
.page-battle .bt-tally .li .lead { flex: 1; min-width: 12px; align-self: center; height: 1px; transform: translateY(3px);
  background: repeating-linear-gradient(to right, var(--todo-line) 0 2px, transparent 2px 6px); }
.page-battle .bt-tally .li .v { color: var(--ink); font-size: 16px; min-width: 3.2em; text-align: right; white-space: nowrap; }
.page-battle .bt-tally .dmg .li .v { font-size: 15px; }
.page-battle .bt-tally .dmg .li:not(.sub) + .li:not(.sub), .page-battle .bt-tally .dmg .li.sub + .li:not(.sub) { margin-top: 8px; }
.page-battle .bt-tally .li.sub { min-height: 26px; }
.page-battle .bt-tally .li.sub .k { color: var(--faint); font-size: 12.5px; padding-left: 1em; }
.page-battle .bt-tally .dmg .li.sub .v { font-size: 13px; color: var(--muted); }
.page-battle .bt-tally .wxb { display: grid; align-content: start; }
.page-battle .bt-tally .wx { --c: var(--qi); display: grid; grid-template-columns: 6.5em 3.6em minmax(48px, 1fr) 3em; align-items: center; gap: 0 12px; min-height: 30px; }
.page-battle .bt-tally .wx.plain { --c: oklch(0.55 0.014 262); }
.page-battle .bt-tally .wx.m-poison { --c: var(--poison); }
.page-battle .bt-tally .wx.m-burst { --c: var(--crit); }
.page-battle .bt-tally .wx.m-thorns { --c: var(--ink-gold); }
.page-battle .bt-tally .wx .n { color: var(--c); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-battle .bt-tally .wx.plain .n { color: var(--muted); }
.page-battle .bt-tally .wx .c { color: var(--faint); font-size: 12.5px; text-align: right; white-space: nowrap; }
.page-battle .bt-tally .wx .bar { position: relative; height: 3px; }
.page-battle .bt-tally .wx .bar::before { content: ''; position: absolute; left: 0; right: 0; top: 1px; height: 1px; background: repeating-linear-gradient(to right, var(--todo-line) 0 2px, transparent 2px 5px); }
.page-battle .bt-tally .wx .bar i { position: absolute; left: 0; top: 0; width: 100%; height: 3px; border-radius: 2px; background: var(--c); transform-origin: left; transition: transform .5s var(--ease-sharp); }
.page-battle .bt-tally .wx .p { text-align: right; color: var(--ink); font-size: 13px; }
.page-battle .bt-tally .more { justify-self: start; border: 0; background: none; padding: 2px 0 6px; color: var(--ink-gold); font-size: 12.5px; cursor: pointer; font-family: inherit; }
.page-battle .bt-tally .more:hover { color: var(--gold); }
.page-battle .bt-tally .more:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; border-radius: 3px; }

/* 自动连战：挑战按钮下一枚小方框，勾上墨金对勾；默认不勾 */
.page-battle .bt-chain { position: relative; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--faint); font-size: 12.5px; user-select: none; padding: 2px 4px; border-radius: 4px; transition: color .15s; }
.page-battle .bt-chain:hover { color: var(--muted); }
.page-battle .bt-chain input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.page-battle .bt-chain .box { position: relative; width: 13px; height: 13px; border-radius: 3px; box-shadow: inset 0 0 0 1px oklch(0.5 0.014 262); transition: box-shadow .15s, background .15s; }
.page-battle .bt-chain:hover .box { box-shadow: inset 0 0 0 1px var(--muted); }
.page-battle .bt-chain input:checked + .box { background: oklch(0.78 0.13 78 / 0.14); box-shadow: inset 0 0 0 1px var(--ink-gold); }
.page-battle .bt-chain input:checked + .box::after { content: ''; position: absolute; left: 4px; top: 1.5px; width: 3.5px; height: 7px; border: solid var(--gold); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.page-battle .bt-chain input:checked ~ .t { color: var(--muted); }
.page-battle .bt-chain input:focus-visible + .box { outline: 1.5px solid var(--gold); outline-offset: 2px; }

/* ═══════ 战败演出：剩余气血一行（悬停看诊断与战报） ═══════ */
.jh-ceremony .bt-fail-left { width: min(360px, 80vw); margin: 30px auto; text-align: left; }
.jh-ceremony .bt-fail-left .lbl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }

/* ═══════ 手机宽度 ═══════ */
@media (max-width: 860px) {
  .page-battle .vlab .nm { font-size: 13px; letter-spacing: 0.1em; } .page-battle .vlab .tt { display: none; }
  .page-battle .bt-mapwrap { margin: -20px -16px 0; }
  .page-battle .bt-map-head { left: 16px; right: 16px; top: 18px; flex-direction: column; align-items: flex-start; gap: 2px; }
  .page-battle .bt-scene { margin: -20px -16px 0; }
  .page-battle .sc-head { left: 16px; } .page-battle .sc-head h2 { font-size: 26px; }
  .page-battle .bt-duel { margin: 0; }
  .page-battle .bt-band { grid-template-columns: 1fr 40px 1fr; min-height: 0; padding: 24px 12px 10px; gap: 0 10px; }
  .page-battle .bt-band .bust { display: none; }
  .page-battle .bt-band .side { padding: 0 0 70px; }
  .page-battle .bt-band .side .desc { flex-wrap: wrap; white-space: normal; }
  .page-battle .bt-band .side .name { font-size: 19px; }
  .page-battle .bt-band .vs { padding: 20px 0 0; font-size: 20px; }
  .page-battle .bt-duel-btn { min-width: 0; width: min(320px, 90%); }
  /* 场景缩到一屏宽：关卡点缩小，只留当前一关的关名 */
  .page-battle .nd > .lb { display: none; }
  .page-battle .nd.cur > .lb { display: block; }
  .page-battle .nd .md { width: 34px; height: 34px; }
  .page-battle .nd.boss .md { width: 40px; height: 40px; }
  .page-battle .nd .md .tg { right: -12px; top: 0; font-size: 10px; padding: 2px 1px; }
  .page-battle .nd .ck { width: 16px; height: 16px; font-size: 9px; }
  .page-battle .nd .bs { width: 22px; height: 7px; }
  .page-battle .nd .gd { width: 20px; height: 27px; }
  .page-battle .nodes .grp { display: none; }
  .page-battle .bt-band .side .name { white-space: normal; }
  .page-battle .bt-band .side .name .hao { display: block; margin: 0; }
}
@media (max-width: 1100px) {
  .page-battle .bt-tally { grid-template-columns: minmax(0, 1fr); }

  .page-battle .bt-tally .wxb { margin-top: 18px; }
}
@media (max-width: 560px) {
  .page-battle .bt-tally .grp { grid-template-columns: minmax(0, 1fr); }

}
@media (prefers-reduced-motion: reduce) {
  .page-battle .bt-map .map-in, .page-battle .vlab, .page-battle .bt-map .reg, .page-battle .bt-map .art { transition: none !important; }
  .page-battle .spot .mist i, .page-battle .spot.cur .glow, .page-battle .nd.cur .bs, .page-battle .bt-band .bust.hit { animation: none; }
  .page-battle .bt-pops .dmg { animation-duration: .5s; }
  .page-battle .bt-log .p { animation: none; }
  .page-battle .bt-tally, .page-battle .bt-tally .wx .bar i, .page-battle .bt-chain, .page-battle .bt-chain .box { animation: none; transition: none; }
}

/* 推关失败二选一：退回按钮带 5 秒倒计时，底边金线随之缩短（docs/design/idle-ux-prototype.html ②） */
.jh-btn.count { overflow: hidden; }
.jh-btn.count .left { display: inline-block; min-width: 1.2em; margin-left: 0.4em; color: var(--muted); font-family: var(--font-body); letter-spacing: 0; }
.jh-btn.count::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--gold); opacity: 0.6;
  transform-origin: left; animation: count-down 5s linear forwards; }
@keyframes count-down { to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .jh-btn.count::after { display: none; } }

/*---*/
/* 武功页（内功 + 武学合一）—— 定稿原型 docs/design/gongfa-prototype.html（issue #80）。
 * 骨架：页头 → 装配一行（主修印匣 | 武学印匣）→ 左「藏书」3 × 3 窄栏（标题旁切内功 / 武学）/ 右一本翻开的磁青书。 */

.wg { --nijin: oklch(0.83 0.1 82); }
/* 键盘可达：印匣、书封、切换与书页按钮都给一道暖金焦点线 */
.wg :is(button, [data-tip]):focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

/* ═══════ 品质 / 路数色、石印 ═══════ */
.qg1 { --qc: oklch(0.72 0.015 85); --qa: oklch(0.6 0.015 85 / 0.35); }
.qg2 { --qc: oklch(0.78 0.09 212); --qa: oklch(0.74 0.10 215 / 0.45); }
.qg3 { --qc: var(--gold); --qa: oklch(0.78 0.13 78 / 0.6); }
.wg-ico { display: block; background: center / contain no-repeat; }
/* 石印原图朱砂，按路数换色（刚猛即原色） */
.rf.t-绵长 { --rf: hue-rotate(100deg) saturate(0.7) brightness(1.2); }
.rf.t-守御 { --rf: hue-rotate(210deg) saturate(0.85) brightness(1.15); }
.rf.t-诡谲 { --rf: hue-rotate(290deg) saturate(0.8) brightness(1.1); }
.rf.t-阴毒 { --rf: hue-rotate(160deg) saturate(0.7) brightness(1.0); }
.rf .wg-ico, .wg-ico.rf { filter: var(--rf, none); }

/* ═══════ 装配：印匣 —— 石印放在品质色描边的方匣里，名字着品质色 ═══════ */
.wg-carry { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 30px; align-items: stretch; }
.wg-carry .sep { width: 1px; margin: 6px 0 24px; background: linear-gradient(to bottom, transparent, var(--hair) 20%, var(--hair) 80%, transparent); }
.ya { border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; align-content: start; gap: 7px; width: 78px; color: inherit; }
.ya .box { width: 64px; height: 64px; border-radius: 8px; display: grid; place-items: center; transition: transform .25s var(--ease-sharp), box-shadow .25s;
  background: radial-gradient(circle at 50% 60%, color-mix(in oklch, var(--qc) 16%, transparent), oklch(0.17 0.012 262 / 0.6) 70%); box-shadow: inset 0 0 0 1px var(--qa); }
.ya.qg3 .box { box-shadow: inset 0 0 0 1px var(--qa), 0 0 14px oklch(0.78 0.13 78 / 0.25); }
.ya .wg-ico { width: 44px; height: 44px; }
.ya .nm { font-family: var(--font-display); font-size: 14.5px; letter-spacing: 0.1em; color: var(--qc); white-space: nowrap; line-height: 1.2; }
.ya .mt { font-size: 11px; color: var(--faint); white-space: nowrap; line-height: 1; }
.ya.ng .mt { font-family: var(--font-display); font-size: 13px; color: var(--gold); letter-spacing: 0.05em; }
.ya:hover .box { transform: translateY(-2px); }
.ya[aria-current="true"] .box { box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 14px oklch(0.78 0.13 78 / 0.45); }
.ya.empty { cursor: default; }
.ya.empty .box { background: none; box-shadow: none; outline: 1px dashed oklch(0.42 0.014 262 / 0.9); outline-offset: -1px; }

/* ═══════ 左栏藏书 / 右翻开的书，等高 ═══════ */
.wg-study { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 36px; align-items: stretch; }
.wg-left { display: flex; flex-direction: column; }
.wg-sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.wg-sechead .jh-sec { margin: 0; }
.jh-seg.kind button { font-family: var(--font-display); letter-spacing: 0.2em; padding: 3px 12px; }
.wg-segrow { margin-bottom: 14px; }
.jh-seg.icons { flex-wrap: nowrap; align-items: center; gap: 1px; }
.jh-seg.icons button { padding: 4px 4.5px; display: inline-flex; align-items: center; }
.jh-seg.icons .wg-ico { width: 19px; height: 19px; filter: saturate(0.55) brightness(0.8); transition: filter .2s; }
.jh-seg.icons button[aria-pressed="true"] .wg-ico, .jh-seg.icons button:hover .wg-ico { filter: none; }
.wg-shelf { --row: 150px; height: calc(var(--row) * 3); display: grid; grid-template-columns: repeat(3, 76px); justify-content: space-between; grid-template-rows: repeat(3, var(--row)); padding: 0 6px; align-items: start;
  background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--row) - 30px), oklch(0.3 0.02 60 / 0.75) calc(var(--row) - 30px) calc(var(--row) - 27px), oklch(0.18 0.015 50 / 0.5) calc(var(--row) - 27px) calc(var(--row) - 24px), transparent calc(var(--row) - 24px) var(--row)); }
.wg-pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--faint); min-height: 34px; }
.wg-pager button { border: 0; background: none; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 7px; font-size: 15px; line-height: 1; }
.wg-pager button:hover:not(:disabled) { background: var(--wash); color: var(--ink); }
.wg-pager button:disabled { color: oklch(0.38 0.012 262); cursor: default; }
.wg-pager b { color: var(--ink); font-weight: 600; }
.wg-empty { display: grid; gap: 12px; justify-items: start; color: var(--muted); padding: 8px 4px; }
.wg-empty p { margin: 0; }

/* 书封：武学同一套封面按品阶换色（寻常麻灰、上乘绛紫、绝学朱红）；内功蓝 / 青 / 金三张原图。题签按原图上画好的米色签量位 */
.wg-book { position: relative; width: 76px; aspect-ratio: 0.65; margin-top: 4px; border: 0; padding: 0; background: none; cursor: pointer; color: inherit;
  filter: drop-shadow(0 8px 14px oklch(0.05 0.01 262 / 0.6)); transition: transform .25s var(--ease-sharp), filter .25s; }
.wg-book:hover { transform: translateY(-3px); }
.wg-book[aria-current="true"] { transform: translateY(-6px); filter: drop-shadow(0 0 10px oklch(0.78 0.13 78 / 0.4)); }
.wg-book small { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 7px; font-size: 11px; letter-spacing: 0.08em; color: var(--faint); white-space: nowrap; }
.wg-book small .rt { color: var(--tc); }
.cover .cv { position: absolute; inset: 0; background: url('../../code/public/art/book-q1.png') center / 100% 100% no-repeat; }
.cover.wx .cv { filter: sepia(0.7) saturate(0.55) brightness(0.8); }
.cover.wx.q2 .cv { filter: hue-rotate(60deg) saturate(0.85) brightness(0.8); }
.cover.wx.q3 .cv { background-image: url('../../code/public/art/book-q3.png'); filter: hue-rotate(-28deg) saturate(1.5) brightness(0.9); }
.cover.wx.ghost .cv { filter: sepia(0.7) saturate(0.3) brightness(0.5); }
.cover.wx.ghost.q2 .cv { filter: hue-rotate(60deg) saturate(0.55) brightness(0.5); }
.cover.wx.ghost.q3 .cv { filter: hue-rotate(-28deg) saturate(0.9) brightness(0.5); }
.cover.ng .cv { filter: brightness(0.85); }
.cover.ng.q2 .cv { background-image: url('../../code/public/art/book-q2.png'); }
.cover.ng.q3 .cv { background-image: url('../../code/public/art/book-q3.png'); }
.cover .slip { position: absolute; left: 11%; width: 17%; top: 6.5%; height: 62%; display: grid; place-items: center; writing-mode: vertical-rl;
  font-family: var(--font-display); font-size: 11.5px; letter-spacing: 0.12em; color: oklch(0.2 0.02 60); white-space: nowrap;
  background: oklch(0.88 0.035 85); box-shadow: inset 0 0 0 1px oklch(0.55 0.05 70 / 0.45); }
.cover.wx.q3 .slip, .cover.ng.q3 .slip { left: 12.7%; width: 18.8%; top: 8%; height: 63%; }
.cover.wx.ghost .slip { background: oklch(0.66 0.02 85); color: oklch(0.3 0.02 60); }
.cover.ng .slip { background: none; box-shadow: none; }
.cover.ng.q2 .slip { left: 16%; width: 16.5%; top: 8%; height: 61.5%; }
.cover .seal { position: absolute; right: 13%; bottom: 10%; width: 19px; height: 19px; display: grid; place-items: center; font-family: var(--font-display); font-size: 12px; line-height: 1;
  color: oklch(0.93 0.03 60); background: oklch(0.5 0.17 28 / 0.92); border-radius: 3px; box-shadow: inset 0 0 0 1.5px oklch(0.93 0.03 60 / 0.75), 0 1px 3px oklch(0.05 0.01 262 / 0.5); transform: rotate(-6deg); }
.cover.wx.ghost .seal { opacity: 0.5; }
.wg-book .on { position: absolute; top: -8px; right: -6px; font-size: 10.5px; padding: 1px 5px; border-radius: 3px; background: oklch(0.45 0.14 30); color: oklch(0.95 0.02 80); }

/* ═══════ 翻开的书：AI 仿真磁青纸（/art/wuxue-open-ciqing.jpg），书名式名泥金、数值象牙白；内容按页边用容器单位定位 ═══════ */
.wg-right { position: relative; }
/* 高度随左栏，但左栏没有藏书（空状态）时也不能把书压扁：保底一整栏搁板的高度 */
.wg-open { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 100%; min-height: 570px; container-type: size;
  background: linear-gradient(oklch(0.12 0.02 262 / 0.18), oklch(0.12 0.02 262 / 0.18)), url('../../code/public/art/wuxue-open-ciqing.jpg') center / 100% 100% no-repeat;
  filter: drop-shadow(0 18px 40px oklch(0.05 0.01 262 / 0.7));
  --ink: oklch(0.92 0.025 85); --muted: oklch(0.8 0.025 85); --faint: oklch(0.72 0.025 250); --hair: oklch(0.7 0.03 250 / 0.3); color: var(--ink); }
.wg-pg { position: relative; padding: calc(4cqh + 26px) calc(3cqw + 26px) calc(5cqh + 22px); display: flex; flex-direction: column; min-height: 0; }
.wg-pg.l { padding-right: calc(1.5cqw + 26px); }
.wg-pg.r { padding-left: calc(1.5cqw + 26px); }
.wg-ttl { display: flex; align-items: flex-start; gap: 16px; }
.wg-ttl .nm { writing-mode: vertical-rl; font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.22em; line-height: 1; padding: 4px 0; white-space: nowrap;
  color: var(--nijin); text-shadow: 0 0 10px oklch(0.78 0.13 78 / 0.25); }
.wg-ttl .side { display: grid; gap: 8px; align-content: start; justify-items: start; padding-top: 2px; }
.wg-ttl .ep { margin-top: 10px; font-family: var(--font-display); font-size: 14px; line-height: 1.5; letter-spacing: 0.1em; color: color-mix(in oklch, var(--muted) 82%, transparent); white-space: nowrap; }
.ptag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 3px; width: max-content; color: var(--muted); box-shadow: inset 0 0 0 1px var(--hair); white-space: nowrap; }
.ptag.q1 { background: oklch(0.3 0.014 262 / 0.55); }
.ptag.q2 { color: oklch(0.8 0.08 210); background: oklch(0.74 0.10 215 / 0.10); box-shadow: inset 0 0 0 1px oklch(0.74 0.10 215 / 0.4); }
.ptag.q3 { color: var(--gold); box-shadow: inset 0 0 0 1px oklch(0.78 0.13 78 / 0.55); background: oklch(0.78 0.13 78 / 0.1); }
.ptag.rt { color: color-mix(in oklch, var(--tc) 85%, white); background: color-mix(in oklch, var(--tc) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--tc) 45%, transparent); }
.ptag.res { color: var(--cinnabar); box-shadow: inset 0 0 0 1px oklch(0.66 0.14 32 / 0.5); cursor: help; }
.wg-bigico { position: absolute; right: calc(1.5cqw + 24px); top: calc(4cqh + 22px); width: 64px; height: 64px; transform: rotate(-6deg); filter: var(--rf, none) drop-shadow(0 3px 6px oklch(0.05 0.01 262 / 0.5)); cursor: help; }

/* 武学右页：每一式一行 + 熟练线 / 锁定行。绝学七式放不下一页：列表在页内滚动，底部淡出示意还有 */
.wg-forms { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 26px; margin-bottom: -14px;

.wg-prof .pn b { width: 11px; height: 11px; border-radius: 50%; background: oklch(0.3 0.04 255); box-shadow: inset 0 0 0 1px oklch(0.55 0.02 250); }

/* 内功右页：心法要诀，每条右侧挂会改它的关名；改了什么只放悬停 */

.wg-yj.hl { background: linear-gradient(to right, oklch(0.78 0.13 78 / 0.1), transparent 85%); }

.wg-ch.later { color: oklch(0.72 0.02 250); box-shadow: inset 0 0 0 1px oklch(0.6 0.02 250 / 0.3); }

.wg-ch.hl { box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 10px oklch(0.78 0.13 78 / 0.45); color: var(--gold); }

/* ═══════ 换书翻页：先合上露出封面，再以中缝为轴翻开；左页内容等封面落定再淡入 ═══════ */
.wg-flip { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; perspective: 2200px; perspective-origin: 0% 50%; z-index: 5; pointer-events: none; }
.wg-flipper { position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.5, .05, .25, 1); }

.wg-flipper .front { box-shadow: 0 18px 40px oklch(0.05 0.01 262 / 0.7); }

.wg-flipper .back { transform: rotateY(180deg); background: linear-gradient(to right, oklch(0.12 0.02 262 / 0.18), oklch(0.08 0.02 262 / 0.45)), url('../../code/public/art/wuxue-open-ciqing.jpg') left center / 200% 100% no-repeat; }
.wg-open .wg-pg.l > * { transition: opacity .3s; }

.wg-open.closed .wg-pg.l > * { opacity: 0; transition: none; }

/* ═══════ 转修 / 散功重修：轻量对话框（不是整屏演出） ═══════ */
.gf-veil { position: fixed; inset: 0; z-index: var(--z-modal); display: grid; place-items: center; padding: 20px;
  background: oklch(0.08 0.01 262 / 0.78); backdrop-filter: blur(3px); animation: gf-veil-in .3s var(--ease-sharp); }
@keyframes gf-veil-in { from { opacity: 0; } }
.gf-dlg { width: min(480px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; border-radius: 16px; padding: 26px 28px 24px;
  background: linear-gradient(170deg, oklch(0.22 0.016 262), oklch(0.17 0.014 262)); box-shadow: 0 20px 60px oklch(0.05 0.01 262 / 0.7);
  animation: gf-dlg-in .35s var(--ease-sharp); }
@keyframes gf-dlg-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
.gf-dlg h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 22px; letter-spacing: 0.2em; font-weight: 700; }

.gf-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 0; border-top: 1px solid var(--hair); }
.gf-kv:first-of-type { border-top: 0; }
.gf-kv .k { color: var(--muted); }
.gf-kv .v { font-weight: 600; text-align: right; }
.gf-kv .v.loss { color: oklch(0.72 0.12 30); }
.gf-kv .v small { display: block; font-size: 11.5px; font-weight: 400; color: var(--faint); }
.gf-dlg .note { margin: 14px 0 0; font-size: 13px; color: var(--faint); }
.gf-dlg .acts { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }

/* ═══════ 路数章：与品质章同形的实底章（同色淡底 + 同色细描边）；色相避开品质灰 / 青 / 金与装备品阶 ═══════ */
.jh-tag.tag { --tc: var(--muted); color: color-mix(in oklch, var(--tc) 85%, white); background: color-mix(in oklch, var(--tc) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--tc) 45%, transparent); }
.jh-tag.tag.t-刚猛, .tagc-刚猛, .t-刚猛 { --tc: oklch(0.72 0.16 28); }
.jh-tag.tag.t-绵长, .tagc-绵长, .t-绵长 { --tc: oklch(0.76 0.11 135); }
.jh-tag.tag.t-守御, .tagc-守御, .t-守御 { --tc: oklch(0.74 0.10 245); }
.jh-tag.tag.t-诡谲, .tagc-诡谲, .t-诡谲 { --tc: oklch(0.74 0.11 320); }
.jh-tag.tag.t-阴毒, .tagc-阴毒, .t-阴毒 { --tc: oklch(0.70 0.10 175); }
.tagc-刚猛, .tagc-绵长, .tagc-守御, .tagc-诡谲, .tagc-阴毒 { color: var(--tc); }

/* ═══════ 手机宽度：藏书与书上下叠，书的两页也上下叠 ═══════ */
@media (max-width: 860px) {
  .wg-carry { gap: 12px; }
  .wg-study { grid-template-columns: 1fr; gap: 26px; }
  .wg-shelf { grid-template-columns: repeat(3, 76px); justify-content: space-around; height: auto; grid-template-rows: none; grid-auto-rows: var(--row); }
  .wg-open { grid-template-columns: 1fr; container-type: inline-size; height: auto; min-height: 0; }
  .wg-pg, .wg-pg.l, .wg-pg.r { padding: 28px 24px; }
  .wg-forms { overflow: visible; -webkit-mask-image: none; mask-image: none; padding-bottom: 0; margin-bottom: 0; }
  .wg-bigico, .wg-zhu { right: 24px; top: 28px; }
  .wg-flip { display: none; }
  .wg-open.closed { clip-path: none; }
  .wg-open.closed .wg-pg.l > * { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .gf-veil, .gf-dlg { animation: none; }
  .wg-book, .ya .box { transition: none; }
  .wg-flip { display: none; }
  .wg-open.closed { clip-path: none; }
  .wg-open.closed .wg-pg.l > * { opacity: 1; }
}

/* 门派页（基准 docs/design/sect-overhaul-prototype.html + DESIGN.md「门派页」）
 * 场景型：驻地图 → 百务殿 / 典籍院 / 天工库内景，一整幅画即界面，字题在画上，右侧暗区题跋；左图右意。全部挂在 .sx 下。
 * 画框左上角与宽高由 JS 按舞台算（--ax/--ay/--aw/--ah），热区全按画幅百分比放，换尺寸不错位。 */

/* 页自带画：收起页底图，舞台去掉版心铺满（同修炼页） */
html.sx-own-art .jh-art { display: none; }
.jh-page:has(> .sx) { max-width: none; }
.sx { position: relative; overflow: hidden; background: #0b0d12; height: 100vh; min-height: 560px;
  margin: -30px calc(-1 * clamp(18px, 3.2vw, 48px)) -60px;
  --brush: url('../../code/public/art/scene/brush.png'); --scroll: url('../../code/public/art/scene/duel-btn2.png');
  --short: oklch(0.68 0.15 28); --seal-red: oklch(0.5 0.17 28 / 0.92);
  --q1: oklch(0.72 0.015 85); --q2: oklch(0.78 0.09 215); --q3: var(--gold); --g5: oklch(0.72 0.16 50); }
.sx.unready > * { visibility: hidden; }

/* ─── 视图：进一个推近淡入，出一个向所点建筑推近散去 ─── */
.sx-view { position: absolute; inset: 0; animation: sx-enter .55s .22s var(--ease-quart) both; }
@keyframes sx-enter { from { opacity: 0; } }
.sx-view.leave { pointer-events: none; animation: sx-leave .5s var(--ease-quart) forwards; z-index: 2; }
@keyframes sx-leave { to { opacity: 0; } }
.sx-art { position: absolute; left: var(--ax); top: var(--ay); width: var(--aw); height: var(--ah);
  transform-origin: var(--ox, 50%) var(--oy, 50%); animation: sx-art-in .7s .22s var(--ease-quart) both; }
@keyframes sx-art-in { from { transform: scale(1.05); } }
.sx-view.leave .sx-art { animation: sx-art-out .7s var(--ease-quart) forwards; }
@keyframes sx-art-out { to { transform: scale(1.32); filter: blur(3px) brightness(.7); } }
/* 底图 + 冷灰蓝调色（与修炼、战斗、前尘统一：去饱和压向灰蓝，暖色只留灯火），四边羽化融进夜底 */
.sx-pic { position: absolute; inset: 0;
  -webkit-mask: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 84%, transparent);
  -webkit-mask-composite: source-in; mask: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 84%, transparent); mask-composite: intersect; }
.sx-pic .img { position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat; filter: saturate(.62) brightness(.9) contrast(1.05); }
.sx-pic .tone { position: absolute; inset: 0; background: oklch(0.42 0.035 255); mix-blend-mode: color; opacity: .38; pointer-events: none; }
.sx-pic .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 62% 58% at 48% 52%, transparent 45%, oklch(0.12 0.015 260 / .5)); }

/* 页头：左上压字 */
.sx-head { position: absolute; left: 44px; top: 26px; z-index: 6; text-shadow: 0 0 8px #000, 0 0 3px #000, 0 2px 14px #000; }
.sx-head h1 { margin: 0; display: flex; align-items: flex-start; gap: 10px; font-family: var(--font-display); font-size: 40px; font-weight: 700; letter-spacing: .22em; line-height: 1.15; }
.sx-head h1 .seal { font-size: 10px; line-height: 1.15; letter-spacing: 0; writing-mode: vertical-rl; color: oklch(0.92 0.03 85);
  background: var(--seal-red); padding: 3px 2px; border-radius: 2px; margin-top: 9px; text-shadow: none; transform: rotate(-3deg); }
.sx-view.inner .sx-head h1 { font-size: 30px; letter-spacing: .26em; }
.sx-view.inner .sx-head .stand { font-size: 15px; margin-top: 6px; }
.sx-head .stand { margin-top: 8px; font-size: 16px; letter-spacing: .14em; color: var(--muted); }
.sx-head .stand b { color: var(--gold); font-weight: 600; margin-left: 4px; letter-spacing: .04em; }
.sx-back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0 0 10px; cursor: pointer;
  font-family: var(--font-display); font-size: 17px; letter-spacing: .2em; color: var(--ink-gold); text-shadow: inherit; }

.sx-back:focus-visible, .sx-gate .plq:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }

/* ═══ 驻地图：入口 = 建筑旁一块竖排名牌 + 牌下一团柔光 ═══ */
.sx-gate { position: absolute; inset: 0; pointer-events: none; }
.sx-gate .hit { position: absolute; pointer-events: auto; cursor: pointer; border: 0; padding: 0; background: none; }
.sx-gate .glow { position: absolute; width: calc(var(--aw) * .1); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, oklch(0.97 0.06 88) 0 3.5%, oklch(0.88 0.13 78 / .75) 8%, oklch(0.78 0.13 72 / .3) 24%, oklch(0.7 0.1 68 / .1) 42%, transparent 64%);
  transition: transform .35s var(--ease-quart), opacity .35s; opacity: .8; animation: sx-breath 4s ease-in-out infinite; }
@keyframes sx-breath { 50% { opacity: 1; } }
.sx-gate .plq { position: absolute; transform: translate(-50%, -100%); margin-top: calc(var(--aw) * -.016); pointer-events: auto; cursor: pointer;
  padding: 12px 7px; border: 0; background: oklch(0.13 0.012 262 / .86); color: var(--ink);
  box-shadow: inset 0 0 0 1px oklch(0.75 0.075 76 / .55), inset 0 0 0 3px oklch(0.13 0.012 262 / .86), inset 0 0 0 4px oklch(0.75 0.075 76 / .22), 0 4px 14px #000;
  writing-mode: vertical-rl; font-family: var(--font-body); font-weight: 700; font-size: clamp(17px, calc(var(--aw) * .0175), 24px); letter-spacing: .18em; line-height: 1;
  transition: color .25s, box-shadow .25s, background .25s; }
/* 上下两根轴头，像挂着的木牌 */
.sx-gate .plq::before, .sx-gate .plq::after { content: ''; position: absolute; left: -4px; right: -4px; height: 4px; border-radius: 2px; background: linear-gradient(oklch(0.55 0.05 70), oklch(0.32 0.03 60)); }
.sx-gate .plq::before { top: -3px; } .sx-gate .plq::after { bottom: -3px; }
.sx-gate:hover .plq, .sx-gate .plq:focus-visible { color: var(--gold); background: oklch(0.16 0.016 262 / .92);
  box-shadow: inset 0 0 0 1px oklch(0.82 0.11 78 / .9), inset 0 0 0 3px oklch(0.16 0.016 262 / .92), inset 0 0 0 4px oklch(0.82 0.11 78 / .35), 0 0 22px oklch(0.78 0.13 78 / .35), 0 4px 14px #000; }
.sx-gate:hover .glow { transform: translate(-50%, -50%) scale(1.35); opacity: 1; }
.sx-gate .new { position: absolute; top: -6px; right: -6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 0 2px oklch(0.13 0.012 262), 0 0 10px 2px oklch(0.78 0.13 78 / .7); }

/* ═══ 内景通用：右侧暗区题跋 ═══ */
.sx-insc { position: absolute; right: 40px; top: var(--ty, 18%); width: var(--tw, 320px); z-index: 5; text-shadow: 0 1px 8px oklch(0.08 0.01 262), 0 0 3px #000; }
.sx-shade { position: absolute; inset: 0 0 0 auto; width: var(--sw, 40%); pointer-events: none; z-index: 4;
  background: linear-gradient(to left, oklch(0.10 0.012 262 / .82), oklch(0.10 0.012 262 / .7) 30%, oklch(0.10 0.012 262 / .42) 58%, oklch(0.10 0.012 262 / .14) 82%, transparent); }
/* 黑宣纸：极淡的竖排古籍暗纹与栏线，只在暗区里隐约可见 */
.sx-paper { position: absolute; inset: 0; overflow: hidden; opacity: .022; writing-mode: vertical-rl; padding: 34px 26px 0 0;
  font-family: var(--font-display); font-size: 20px; line-height: 44px; letter-spacing: .5em; color: oklch(0.92 0.03 85);
  background: repeating-linear-gradient(to left, transparent 0 25px, oklch(0.85 0.06 80) 25px 26px, transparent 26px 44px);
  -webkit-mask: linear-gradient(to right, transparent, #000 50%), linear-gradient(to bottom, transparent, #000 12%, #000 85%, transparent); -webkit-mask-composite: source-in; mask: linear-gradient(to right, transparent, #000 50%), linear-gradient(to bottom, transparent, #000 12%, #000 85%, transparent); mask-composite: intersect; }
.sx-stroke { height: 7px; margin: 20px -6px 18px; background: oklch(0.6 0.04 80 / .45); -webkit-mask: var(--brush) center / 100% 100%; mask: var(--brush) center / 100% 100%; }
.sx-big { margin: 0; font-family: var(--font-display); font-size: 40px; font-weight: 700; letter-spacing: .2em; line-height: 1.2; }
.sx-tag { margin-top: 10px; font-size: 14px; letter-spacing: .16em; color: var(--ink-gold); }
.sx-desc { margin: 14px 0 0; font-size: 15px; line-height: 1.85; letter-spacing: .06em; color: #8A8F99; }
/* 主按钮：卷轴；次按钮：暗底墨金双线框，与卷轴形态不同 */
.sx-scroll { display: block; margin: 26px auto 0; width: 260px; max-width: 100%; height: 72px; border: 0; cursor: pointer; background: var(--scroll) center / 100% 100% no-repeat;
  font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .5em; padding-left: .5em; color: oklch(0.17 0.012 262); text-shadow: none; transition: filter .2s, transform .15s; }

.sx-scroll:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }
.sx-ghost { display: block; margin: 26px auto 0; width: 260px; max-width: 100%; height: 50px; cursor: pointer; background: oklch(0.14 0.012 262 / .6);
  border: 1px solid oklch(0.75 0.03 80 / .4); border-radius: 3px; box-shadow: inset 0 0 0 3px oklch(0.14 0.012 262 / .6), inset 0 0 0 4px oklch(0.75 0.03 80 / .14);
  font-family: var(--font-display); font-size: 17px; letter-spacing: .6em; padding-left: .6em; color: var(--muted); text-shadow: none; transition: color .2s, border-color .2s, background .2s; }
.sx-ghost:hover { color: var(--ink); border-color: oklch(0.8 0.05 80 / .65); background: oklch(0.18 0.014 262 / .75); }
.sx-ghost:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }

/* ═══ 百务殿 ═══ */
.sx-bian { position: absolute; left: 43.1%; top: 13.9%; transform: translate(-50%, -50%) rotate(8.4deg) skewX(-6deg); pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; font-size: calc(var(--aw) * .05); letter-spacing: .5em; padding-left: .5em; color: oklch(0.14 0.015 60 / .72);
  text-shadow: 0 1px 0 oklch(0.6 0.03 70 / .25); mix-blend-mode: multiply; }
/* 匾额压暗一层，让左上标题为主、画里的匾为辅 */
.sx-bian-dim { position: absolute; left: 27%; top: 0; width: 32%; height: 27%; pointer-events: none;
  background: radial-gradient(ellipse 55% 55% at 50% 50%, oklch(0.07 0.01 262 / .5), oklch(0.07 0.01 262 / .25) 70%, transparent); }
/* 六块挂牌：解锁的点亮、竖写差事名；选中更亮；派差中其余压暗 */
.sx-tab { position: absolute; border: 0; padding: 0; background: none; cursor: default; }
.sx-tab .lit { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; transition: opacity .35s, filter .35s;
  background: radial-gradient(ellipse 80% 62% at 50% 46%, oklch(0.66 0.11 72 / .95), oklch(0.48 0.10 62 / .8) 75%, oklch(0.38 0.08 58 / .7)); }
.sx-tab .halo { position: absolute; inset: -14% -40%; opacity: 0; pointer-events: none; mix-blend-mode: screen; transition: opacity .35s;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, oklch(0.7 0.13 72 / .32), transparent 70%); }
.sx-tab .nm { position: absolute; inset: 6% 0; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; opacity: 0;
  font-family: var(--font-display); font-weight: 700; font-size: calc(var(--aw) * .0185); letter-spacing: .14em; line-height: 1; color: oklch(0.2 0.03 50);
  text-shadow: 0 0 6px oklch(0.85 0.1 78 / .45); transition: opacity .35s; }
.sx-tab.on { cursor: pointer; }
.sx-tab.on .lit { opacity: .78; } .sx-tab.on .nm { opacity: 1; } .sx-tab.on .halo { opacity: .55; }
.sx-tab.on:hover .lit { opacity: .92; }
.sx-tab.sel .lit { opacity: 1; filter: brightness(1.22); } .sx-tab.sel .halo { opacity: 1; }
.sx-tab.sel .nm { color: oklch(0.16 0.03 45); }
.sx-tab.on:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }
.sx-hall.busy .sx-tab.on:not(.sel) { cursor: default; }
.sx-hall.busy .sx-tab.on:not(.sel) .lit { opacity: .5; } .sx-hall.busy .sx-tab.on:not(.sel) .nm { opacity: .7; }
/* 时长两档：菱形 + 名 + 贡献数，选中菱形填金 */
.sx-durs { display: grid; margin-top: 22px; border-top: 1px solid oklch(0.75 0.075 76 / .32); border-bottom: 1px solid oklch(0.75 0.075 76 / .32); }
.sx-durs .sx-dur:last-child::after { display: none; }
.sx-dur { display: flex; align-items: center; gap: 12px; border: 0; background: none; cursor: pointer; padding: 14px 2px 13px; position: relative; text-align: left; color: var(--muted); text-shadow: inherit; }
.sx-dur::after { content: ''; position: absolute; left: -4px; right: 0; bottom: 0; height: 3px; background: oklch(0.6 0.02 85 / .26); -webkit-mask: var(--brush) center / 100% 100%; mask: var(--brush) center / 100% 100%; }
.sx-dur .dm { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid oklch(0.75 0.075 76 / .7); flex: none; }
.sx-dur .dn { font-family: var(--font-display); font-size: 19px; letter-spacing: .2em; }
.sx-dur .dv { margin-left: auto; font-size: 14px; letter-spacing: .14em; color: var(--faint); }
.sx-dur .dv b { font-size: 24px; font-weight: 600; letter-spacing: 0; color: var(--ink-gold); margin: 0 6px 0 4px; }
.sx-dur:hover { color: var(--ink); }
.sx-dur.on { color: var(--ink); } .sx-dur.on .dm { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px oklch(0.78 0.13 78 / .6); }
.sx-dur.on .dv b { color: var(--gold); }
.sx-dur:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; }
.sx-kv { margin: 0; display: grid; gap: 14px; }
.sx-kv div { display: flex; align-items: baseline; gap: 16px; }
.sx-kv dt { width: 3em; font-size: 15px; letter-spacing: .2em; color: var(--faint); }
.sx-kv dd { margin: 0; font-size: 26px; font-weight: 600; color: var(--ink); }

/* 案上那炷香：香头一点火光随时间往下走，上面烧掉的一截被墨色盖去，香头飘一缕烟 */
.sx-joss { position: absolute; left: 35.8%; top: 0; width: 0; height: 0; pointer-events: none; }
.sx-joss .gone { position: absolute; left: calc(var(--aw) * -.0042); width: calc(var(--aw) * .0084); top: calc(var(--ah) * .662); height: calc(var(--ah) * (var(--tip) - .662));
  background: rgb(66 60 61); filter: blur(1.2px); border-radius: 40%; }
.sx-joss .ember { position: absolute; left: 0; top: calc(var(--ah) * var(--tip)); width: calc(var(--aw) * .0034); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: oklch(0.86 0.16 60); box-shadow: 0 0 4px 1px oklch(0.75 0.18 45), 0 0 14px 4px oklch(0.7 0.16 50 / .45); animation: sx-ember 2.2s ease-in-out infinite; }
@keyframes sx-ember { 50% { box-shadow: 0 0 6px 2px oklch(0.78 0.18 45), 0 0 20px 6px oklch(0.7 0.16 50 / .55); } }
.sx-joss .puff { position: absolute; left: 0; top: calc(var(--ah) * var(--tip)); width: calc(var(--aw) * .012); height: calc(var(--aw) * .022); margin: calc(var(--aw) * -.022) 0 0 calc(var(--aw) * -.006);
  border-radius: 50%; background: radial-gradient(ellipse, oklch(0.85 0.01 260 / .55), transparent 70%); filter: blur(2px); opacity: 0; animation: sx-puff 4.2s linear infinite; animation-delay: var(--d); }
@keyframes sx-puff { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 15% { opacity: .8; } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--aw) * -.07)) scale(1.8, 2.4); } }

/* ═══ 典籍院 / 天工库：右侧一列可换之物 + 选中详情 ═══ */
.sx-list { display: grid; }
.sx-row { display: flex; align-items: center; gap: 14px; border: 0; background: none; cursor: pointer; padding: 8px 6px 8px 4px; position: relative; text-align: left; color: var(--ink); text-shadow: inherit; opacity: .6; transition: opacity .2s; }
.sx-row::after { content: ''; position: absolute; left: -4px; right: 0; bottom: 0; height: 3px; background: oklch(0.6 0.02 85 / .22); -webkit-mask: var(--brush) center / 100% 100%; mask: var(--brush) center / 100% 100%; }
.sx-row .ic { width: 26px; height: 26px; flex: none; background: center / contain no-repeat; opacity: .8; }
.sx-row .ic.gear { filter: brightness(0) invert(.72) sepia(.5) saturate(1.6) hue-rotate(-8deg); }
.sx-row .rn { font-family: var(--font-display); font-size: 17px; letter-spacing: .14em; white-space: nowrap; }
.sx-row .rn small { font-family: var(--font-body); font-size: 12px; letter-spacing: .08em; color: var(--faint); margin-left: 8px; }
.sx-row .rp { margin-left: auto; font-size: 12px; letter-spacing: .14em; color: var(--faint); white-space: nowrap; }
.sx-row .rp b { font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--ink-gold); margin-right: 4px; }

.sx-row:hover { opacity: .85; }
.sx-row.on { opacity: 1; background: linear-gradient(to right, oklch(0.78 0.13 78 / .16), oklch(0.78 0.13 78 / .05) 55%, transparent 90%); }
.sx-row.on .ic { opacity: 1; filter: drop-shadow(0 0 4px oklch(0.78 0.13 78 / .5)); }
.sx-row.on .ic.gear { filter: brightness(0) invert(.86) sepia(.6) saturate(2.2) hue-rotate(-8deg) drop-shadow(0 0 4px oklch(0.78 0.13 78 / .5)); }
.sx-row.fresh { animation: sx-fresh 1.4s var(--ease-quart); }
@keyframes sx-fresh { 0% { background: oklch(0.78 0.13 78 / .18); } 100% { background: transparent; } }
.sx-row:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; }
.sx-q1 { color: var(--q1); } .sx-q2 { color: var(--q2); } .sx-q3 { color: var(--q3); } .sx-g5 { color: var(--g5); }
/* 列表与详情之间：── ◆ ── */
.sx-orn { display: flex; align-items: center; gap: 10px; margin: 18px 0 18px; }
.sx-orn::before, .sx-orn::after { content: ''; flex: 1; height: 1px; }
.sx-orn::before { background: linear-gradient(to right, transparent, oklch(0.75 0.075 76 / .5)); }
.sx-orn::after { background: linear-gradient(to left, transparent, oklch(0.75 0.075 76 / .5)); }
.sx-orn i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid oklch(0.75 0.075 76 / .75); position: relative; }
.sx-orn i::after { content: ''; position: absolute; inset: 1.5px; background: oklch(0.75 0.075 76 / .7); }
.sx-orn b { width: 3px; height: 3px; transform: rotate(45deg); background: oklch(0.75 0.075 76 / .5); }
/* 详情卷宗 */
.sx-card .nmrow { display: flex; align-items: baseline; gap: 12px; }

.sx-chop { display: inline-block; margin-left: 8px; font-family: var(--font-display); font-size: 11px; letter-spacing: .1em; color: oklch(0.95 0.02 85); background: var(--seal-red);
  padding: 1px 4px; border-radius: 2px; transform: rotate(-4deg) translateY(-2px); text-shadow: none; }
.sx-attrs { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; margin: 14px 0 0; }
.sx-attrs .a { display: flex; align-items: baseline; gap: 10px; padding: 8px 2px 7px; position: relative; }
.sx-attrs .a::after { content: ''; position: absolute; left: -4px; right: 0; bottom: 0; height: 3px; background: oklch(0.6 0.02 85 / .26); -webkit-mask: var(--brush) center / 100% 100%; mask: var(--brush) center / 100% 100%; }

.sx-card .sx-scroll { margin-top: 20px; }
.sx-own { display: block; width: max-content; margin: 22px auto 0; padding: 7px 16px 7px 22px; font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: .5em;
  color: var(--cinnabar); border: 1.5px solid oklch(0.66 0.14 32 / .7); border-radius: 3px; transform: rotate(-4deg); text-shadow: none; opacity: .85; }
.sx-own-gap { height: 74px; display: flex; align-items: center; }
/* 货多（地位高）时收紧行距，按钮不压到底边 */
.sx-insc.dense .sx-row { padding: 4px 6px 4px 4px; }

.sx-insc.dense .sx-scroll { margin-top: 14px; height: 62px; }

/* 操作反馈：浮在对象旁 */

/* ═══ 拜山（未拜入）：按卷分组，每家一张横卡，左是驻地缩略，右是名与气质 ═══ */
.sx-join { position: absolute; inset: 0; overflow-y: auto; padding: 26px 44px 40px; }
.sx-join h1 { margin: 0 0 6px; font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: .24em; text-shadow: 0 2px 14px #000; }
.sx-vol { margin-top: 22px; font-family: var(--font-display); font-size: 15px; letter-spacing: .25em; color: var(--ink-gold); display: flex; align-items: center; gap: 14px; }
.sx-vol::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, oklch(0.75 0.075 76 / .45), transparent); }
.sx-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-top: 12px; }
.sx-cardj { display: flex; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; height: 150px; overflow: hidden; border-radius: 4px;
  background: oklch(0.13 0.011 262 / .82); box-shadow: inset 0 0 0 1px oklch(0.75 0.075 76 / .18); transition: box-shadow .2s, transform .2s var(--ease-quart); }
.sx-cardj:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px oklch(0.75 0.075 76 / .4); }
.sx-cardj[aria-checked="true"] { box-shadow: inset 0 0 0 1px oklch(0.75 0.075 76 / .85), inset 0 0 0 3px oklch(0.13 0.011 262), inset 0 0 0 4px oklch(0.75 0.075 76 / .35), 0 0 24px oklch(0.78 0.13 78 / .14); }
.sx-cardj:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; }
.sx-cardj .th { flex: none; width: 34%; background: var(--img) 50% 55% / cover no-repeat; filter: saturate(.62) brightness(.85);
  -webkit-mask: linear-gradient(to right, #000 60%, transparent); mask: linear-gradient(to right, #000 60%, transparent); }
.sx-cardj .tx { flex: 1; min-width: 0; padding: 16px 18px 14px 6px; display: flex; flex-direction: column; }

/* 行囊页 —— docs/design/battle-loot-prototype.html `#p-bag`（DESIGN.md「行囊（形态格背包）」「Tags（装备品阶）」） */
.g1 { color: var(--muted); } .g2 { color: oklch(0.78 0.12 145); } .g3 { color: oklch(0.78 0.09 215); } .g4 { color: oklch(0.76 0.13 300); } .g5 { color: var(--crit); }
.gtag { font-size: 11px; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.05em; white-space: nowrap; }
.gtag.g1 { background: oklch(0.3 0.014 262 / 0.55); } .gtag.g2 { background: oklch(0.72 0.14 145 / 0.12); } .gtag.g3 { background: oklch(0.74 0.10 215 / 0.12); } .gtag.g4 { background: oklch(0.7 0.14 300 / 0.14); } .gtag.g5 { background: oklch(0.72 0.16 50 / 0.14); box-shadow: inset 0 0 0 1px oklch(0.72 0.16 50 / 0.5); }
.wtag { font-size: 11px; color: var(--faint); padding: 1px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--hair); white-space: nowrap; }

.bag { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 28px; align-items: start; }
.bag .faint { color: var(--faint); font-weight: 400; letter-spacing: 0; font-family: var(--font-body); font-size: 12px; }
.worn { display: grid; }
.worn-i { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 4px 14px; padding: 14px 6px; border-top: 1px solid var(--hair); cursor: pointer; border-radius: 8px; }
.worn-i:first-child { border-top: 0; }
.worn-i:hover { background: oklch(0.3 0.016 262 / 0.2); }
.worn-i[aria-pressed="true"] { box-shadow: inset 0 0 0 1px oklch(0.78 0.13 78 / 0.5); }
.worn-i .slot-k { font-family: var(--font-display); letter-spacing: 0.3em; color: var(--faint); font-size: 13px; padding-top: 3px; grid-row: 1 / span 3; display: grid; gap: 6px; justify-items: start; }
.worn-i .slot-k .ink { width: 44px; height: 54px; object-fit: contain; opacity: 0.85; }
.worn-i .nm, .cmp .nm { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.worn-i.empty .nm { color: var(--faint); font-size: 14px; }
.worn-i.empty .slot-k { grid-row: auto; }
.worn-sum { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; line-height: 1.6; }
.worn-sum b { color: var(--ink); font-weight: 600; }

.bag-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.bag-head .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.jh-cats { display: inline-flex; background: var(--wash); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.jh-cats button { border: 0; background: none; padding: 4px 13px; border-radius: 7px; color: var(--muted); cursor: pointer; font-size: 13px; font-family: inherit; }
.jh-cats button[aria-pressed="true"] { background: var(--wash-2); color: var(--ink); }

/* 形态格：按部位占格（兵器 1×3、暗器 1×2、衣甲 2×2、佩饰 1×1），自动紧凑摆放，玩家不拖动 */
.bag-grid { --cell: 46px; display: grid; grid-template-columns: repeat(10, var(--cell)); grid-auto-rows: var(--cell); grid-auto-flow: dense; gap: 4px; justify-content: start; }
.bag-grid .cell { border-radius: 5px; box-shadow: inset 0 0 0 1px oklch(0.3 0.014 262 / 0.5); background: oklch(0.18 0.012 262 / 0.35); }
.bag-grid .item { position: relative; border: 0; color: inherit; cursor: pointer; border-radius: 6px; padding: 3px; background: oklch(0.22 0.015 262 / 0.55); box-shadow: inset 0 0 0 1px oklch(0.35 0.014 262 / 0.7); display: grid; place-items: center; transition: background .2s, box-shadow .2s; min-width: 0; min-height: 0; overflow: hidden; }
/* 品阶一眼可见：描边 + 底部品阶色晕 + 右下角标；凡品素色 */
.bag-grid .item.g2 { color: oklch(0.78 0.12 145); } .bag-grid .item.g3 { color: oklch(0.78 0.09 215); } .bag-grid .item.g4 { color: oklch(0.76 0.13 300); } .bag-grid .item.g5 { color: var(--crit); }
.bag-grid .item.g2, .bag-grid .item.g3, .bag-grid .item.g4, .bag-grid .item.g5 { box-shadow: inset 0 0 0 1.5px color-mix(in oklch, currentColor 70%, transparent); background: linear-gradient(to top, color-mix(in oklch, currentColor 28%, transparent), transparent 55%), oklch(0.22 0.015 262 / 0.55); }
.bag-grid .item.g2::after, .bag-grid .item.g3::after, .bag-grid .item.g4::after, .bag-grid .item.g5::after { content: ''; position: absolute; right: 0; bottom: 0; width: 0; height: 0; border-style: solid; border-width: 0 0 12px 12px; border-color: transparent transparent currentColor transparent; opacity: 0.9; }
.bag-grid .item.g5 { box-shadow: inset 0 0 0 1.5px currentColor, 0 0 10px color-mix(in oklch, currentColor 45%, transparent); }
.bag-grid .item:hover { background: oklch(0.27 0.017 262 / 0.65); }
.bag-grid .item[aria-pressed="true"] { box-shadow: inset 0 0 0 1px oklch(0.78 0.13 78 / 0.7), 0 0 12px oklch(0.78 0.13 78 / 0.25); }
.bag-grid .item .ink { width: 100%; height: 100%; object-fit: contain; opacity: 0.95; pointer-events: none; }
.bag-grid .item .up { position: absolute; top: 2px; right: 5px; font-size: 11px; color: var(--gold); }
.bag-grid .item .fresh { position: absolute; top: 6px; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.bag-grid .item.dim { opacity: 0.5; }

/* 比较面板 */
.cmp { margin-top: 18px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: start; }
.cmp.none { display: block; }
.cmp-art { position: relative; height: 210px; overflow: hidden; border-radius: 10px; display: grid; place-items: center; padding: 12px; background: radial-gradient(ellipse at 50% 60%, color-mix(in oklch, currentColor 22%, transparent), transparent 70%), oklch(0.17 0.012 262 / 0.8); box-shadow: inset 0 0 0 1px color-mix(in oklch, currentColor 40%, transparent); color: oklch(0.45 0.012 262); }
.cmp-art.g2 { color: oklch(0.78 0.12 145); } .cmp-art.g3 { color: oklch(0.78 0.09 215); } .cmp-art.g4 { color: oklch(0.76 0.13 300); } .cmp-art.g5 { color: var(--crit); }
.cmp-art .ink { height: 186px; width: 126px; object-fit: contain; }
.cmp-body { min-width: 0; }
.cmp-empty { font-size: 12.5px; color: var(--faint); line-height: 1.7; text-align: center; padding: 28px 8px; }
.cmp .cmp-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cmp .cmp-h .nm { font-size: 17px; }
.cmp .diff { display: grid; gap: 6px; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.cmp .diff .r { display: grid; grid-template-columns: auto 1fr auto; gap: 0 16px; align-items: baseline; }
.cmp .diff .k { color: var(--faint); } .cmp .diff .v { color: var(--ink); font-weight: 600; text-align: right; }
.cmp .diff .d { font-size: 12px; min-width: 3em; } .cmp .diff .d.up { color: var(--ink-gold); } .cmp .diff .d.dn { color: oklch(0.72 0.12 30); }
.cmp .acts { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

/* 战报拾得行：装备名按品阶着色，压过拾得行的金字 */
.page-battle .bt-log .p.loot .g1 { color: var(--muted); } .page-battle .bt-log .p.loot .g2 { color: oklch(0.78 0.12 145); } .page-battle .bt-log .p.loot .g3 { color: oklch(0.78 0.09 215); } .page-battle .bt-log .p.loot .g4 { color: oklch(0.76 0.13 300); } .page-battle .bt-log .p.loot .g5 { color: var(--crit); }

@media (max-width: 860px) {
  .bag { grid-template-columns: 1fr; }
  .bag-grid { --cell: 32px; grid-template-columns: repeat(10, var(--cell)); }
  .cmp { grid-template-columns: 110px minmax(0, 1fr); gap: 14px; } .cmp-art { height: 150px; } .cmp-art .ink { height: 126px; width: 86px; }
}

/* 市集 / 黑市 —— docs/design/battle-loot-prototype.html `#p-market`（DESIGN.md「市集与黑市」「黑市（暗调）」） */
.market { position: relative; }
.mk-silver { font-size: 13px; color: var(--muted); align-self: center; }
.mk-silver .gold { color: var(--gold); font-weight: 600; }
.mk-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.stall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stall-it { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 2px 10px; padding: 10px; border-radius: 10px; background: oklch(0.22 0.015 262 / 0.5); align-items: center; }
.stall-it .ink { grid-row: 1 / span 3; width: 54px; height: 70px; object-fit: contain; opacity: 0.85; }
.stall-it .nm { font-family: var(--font-display); font-size: 14.5px; letter-spacing: 0.06em; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.market .jh-row .wtag, .stall-it .wtag { font-size: 11px; color: var(--faint); padding: 1px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--hair); white-space: nowrap; }
/* 黑市入口：解锁后摊位条末尾多一个暗色页签（解锁前不渲染） */
.jh-seg button.blk { margin-left: 10px; color: oklch(0.72 0.1 300); box-shadow: inset 0 0 0 1px oklch(0.5 0.1 300 / 0.45); }
.jh-seg button.blk:hover { background: oklch(0.25 0.04 300 / 0.6); }
/* 进门：整页从左向右拉黑 */
.market.wipe::after { content: ''; position: absolute; inset: -24px; z-index: 5; background: oklch(0.08 0.02 300); animation: wipe-in .45s var(--ease-sharp) both; }
@keyframes wipe-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
/* 黑市：整页换紫黑调 */
.market.night { --wash: oklch(0.16 0.02 300 / 0.7); --wash-2: oklch(0.24 0.03 300 / 0.7); }
.market.night .jh-head h1 { color: oklch(0.82 0.09 300); }
.page-shop:has(.market.night) + .jh-art, .jh-art.art-shop:has(+ .page-shop .market.night) { filter: brightness(0.45) saturate(0.4) hue-rotate(30deg); }
.bk-right { display: flex; align-items: center; gap: 16px; }
.bk-clock { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: oklch(0.8 0.08 70); font-variant-numeric: tabular-nums; }
.bk-clock i { width: 10px; height: 14px; border-radius: 2px 2px 5px 5px; background: linear-gradient(to top, oklch(0.75 0.1 70), oklch(0.75 0.1 70) 45%, oklch(0.3 0.03 300) 45%); box-shadow: inset 0 0 0 1px oklch(0.6 0.08 70 / 0.6); }
.coins { display: flex; gap: 8px; margin-top: 16px; }
.coins i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, transparent 3px, oklch(0.72 0.1 70) 3.5px, oklch(0.6 0.09 60) 7px, oklch(0.5 0.07 55) 8px); box-shadow: 0 1px 2px oklch(0.05 0.01 262 / 0.6); }
.coins i.spent { background: radial-gradient(circle, transparent 3px, oklch(0.3 0.02 300) 3.5px, oklch(0.26 0.02 300) 8px); box-shadow: inset 0 0 0 1px oklch(0.4 0.03 300 / 0.5); }
.masked { display: grid; grid-template-columns: repeat(3, 200px); gap: 14px; }
.mask-it { position: relative; border: 0; color: inherit; cursor: pointer; border-radius: 10px; padding: 10px 8px; min-height: 0; display: grid; justify-items: center; align-content: center; gap: 6px; background: oklch(0.18 0.03 300 / 0.8); box-shadow: inset 0 0 0 1px oklch(0.45 0.08 300 / 0.4); transition: transform .3s var(--ease-sharp), box-shadow .3s; font-family: inherit; }
.mask-it:hover:not(:disabled) { box-shadow: inset 0 0 0 1px oklch(0.6 0.12 300 / 0.7); }
.mask-it:disabled { cursor: default; opacity: 0.6; }
.mask-it .mveil { width: 120px; height: 150px; border-radius: 6px; background: linear-gradient(160deg, oklch(0.3 0.04 300), oklch(0.18 0.03 300)); box-shadow: inset 0 0 0 1px oklch(0.5 0.08 300 / 0.5); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: oklch(0.6 0.08 300); }
.mask-it .nm { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.08em; text-align: center; }
.mask-it .nm.qi { color: var(--qi); }
.mask-it .pr { font-size: 12.5px; color: var(--muted); }
.mask-it.sold { cursor: default; }

.mask-it.sold .nm { animation: mask-in .6s var(--ease-sharp); }

@keyframes mask-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* 演出：暗门（灯笼暖光压紫黑）与话本段落 */

.jh-ceremony .story { max-width: 34em; margin: 18px auto 0; color: var(--muted); line-height: 1.9; font-size: 15px; text-align: left; }
.jh-ceremony .story em { font-style: normal; color: var(--ink); }
.jh-ceremony .story + .acts { margin-top: 26px; }
@media (max-width: 860px) { .masked { grid-template-columns: repeat(3, minmax(0, 1fr)); } .mask-it .mveil { width: 80px; height: 100px; } }
@media (prefers-reduced-motion: reduce) { .market.wipe::after { animation: none; } .mask-it.sold .ink, .mask-it.sold .nm { animation: none; } }

/*
 * 江湖编年右栏与转世醒来（活江湖第一期批四）。
 * 基准：docs/design/living-jianghu-prototype.html「江湖编年」「转世醒来」+ DESIGN.md「江湖编年右栏」。
 * 类别靠标签字与字色区分（不靠侧条）；玩家自己的事用墨金，江湖大事朱砂。
 */

/* ═══════ 外壳：第三栏 ═══════ */
.jh-app.has-dock { grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--dock-col, var(--dock-w)); }
.jh-app.has-dock .jh-art { right: var(--dock-col, var(--dock-w)); }
.jh-app.dock-min { --dock-col: 52px; }

.jh-dock { background: var(--bg-deep); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; min-width: 0; z-index: 2; }
.jh-dock .tabs { display: flex; gap: 22px; padding: 26px 22px 0; border-bottom: 1px solid var(--hair); }
.jh-dock .tabs button { border: 0; background: none; padding: 0 0 10px; font-family: var(--font-display); font-size: 15px; letter-spacing: 0.25em; color: var(--faint); cursor: pointer; position: relative; }
.jh-dock .tabs button[aria-selected="true"] { color: var(--ink); }
.jh-dock .tabs button[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0.25em; bottom: -1px; height: 1.5px; background: var(--ink-gold); }
.jh-dock .tabs .fold, .jh-dock .tabs .close { margin-left: auto; padding: 0 2px 10px; font-size: 20px; line-height: 1; letter-spacing: 0; color: var(--faint); font-family: var(--font-body); }
.jh-dock .tabs .close { font-size: 18px; }
.jh-dock .tabs .fold:hover, .jh-dock .tabs .close:hover { color: var(--ink); }
.jh-dock .feed { flex: 1; overflow-y: auto; padding: 6px 22px 30px; scrollbar-width: thin; scrollbar-color: oklch(0.3 0.016 262) transparent; }
.jh-dock .empty { color: var(--faint); font-size: 13px; padding: 18px 0; margin: 0; }

/* 头条简讯：最近一桩大事作头条，其下按类别筛的一行一事 */
.jh-dock .hd { padding: 18px 0 16px; border-bottom: 1px solid var(--hair); }
.jh-dock .hd .k { font-family: var(--font-display); color: var(--cinnabar); font-size: 13px; letter-spacing: 0.25em; }
.jh-dock .hd .k span { color: var(--faint); letter-spacing: 0.05em; margin-left: 8px; font-family: var(--font-body); font-size: 12px; }
.jh-dock .hd .t { font-family: var(--font-display); font-size: 19px; line-height: 1.6; margin-top: 8px; letter-spacing: 0.06em; text-wrap: balance; }
.jh-dock .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 0 6px; }
.jh-dock .chips button { border: 0; background: none; padding: 3px 7px; border-radius: 6px; font-size: 12.5px; color: var(--faint); cursor: pointer; }
.jh-dock .chips button:hover { color: var(--ink); }
.jh-dock .chips button[aria-pressed="true"] { background: var(--wash-2); color: var(--ink); }
.jh-dock .brief { margin: 0; padding: 7px 0; font-size: 13.5px; line-height: 1.7; color: var(--muted); text-wrap: pretty; animation: dock-in .7s var(--ease-quart) both; }
.jh-dock .brief b { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; margin-right: 8px; letter-spacing: 0.1em; }
.jh-dock .brief .yr { color: var(--faint); font-size: 11.5px; margin-left: 6px; white-space: nowrap; }
.jh-dock .brief.me { color: var(--ink); } .jh-dock .brief.me b { color: var(--ink-gold); }
.jh-dock .brief.zheng b { color: var(--camp-zheng); } .jh-dock .brief.xie b { color: var(--camp-xie); }
.jh-dock .brief.court b { color: var(--camp-court); } .jh-dock .brief.jh b { color: var(--camp-jh); } .jh-dock .brief.big b { color: var(--cinnabar); }
@keyframes dock-in { from { opacity: 0; transform: translateY(-6px); } }

/* 往世：一世一行，点开看那一世的年表 */
.jh-dock .past { border-bottom: 1px solid var(--hair); }
.jh-dock .past > button { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; width: 100%; border: 0; background: none; text-align: left; padding: 14px 0; cursor: pointer; color: var(--ink); }
.jh-dock .past .n { font-family: var(--font-display); color: var(--faint); font-size: 12.5px; letter-spacing: 0.15em; align-self: baseline; }
.jh-dock .past .nm { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.15em; font-weight: 600; }
.jh-dock .past .nm .hao { color: var(--ink-gold); font-size: 14px; letter-spacing: 0.06em; margin-right: 4px; }
.jh-dock .past .chev { color: var(--faint); font-size: 10px; align-self: center; transition: transform .25s var(--ease-sharp); }
.jh-dock .past .end { grid-column: 2 / 4; color: var(--faint); font-size: 12px; }
.jh-dock .past[data-open] .chev { transform: rotate(90deg); }

<script>
const D=JSON.parse(document.getElementById('scenes').textContent),st=document.getElementById('stage');
const base=document.getElementById('base-css').textContent,aft=document.getElementById('after-css').textContent;
let k=location.hash.slice(1).split(',')[0]||'track',a=location.hash.includes(',0')?0:1;
function fit(){const s=Math.min(innerWidth/1440,(innerHeight-document.getElementById('bar').offsetHeight)/900);st.style.transform=`translateX(-50%) scale(${s})`}
function show(){const d=D[k];
 st.srcdoc=`<!doctype html><html lang="zh-CN" data-theme="night" class="${d.cls} ${a?'after':''}"><head><meta charset="utf-8"><base href="${location.href}"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" rel="stylesheet"><style>${base}</style><style>${aft}</style></head><body><div id="root">${d.html}</div></body></html>`;
 document.querySelectorAll('#bar [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 document.querySelectorAll('#ab button').forEach(b=>b.classList.toggle('on',+b.dataset.a===a));
 history.replaceState(null,'','#'+k+','+a);fit()}
function ab(v){a=v;const h=st.contentDocument&&st.contentDocument.documentElement;if(h)h.classList.toggle('after',!!a);else show();
 document.querySelectorAll('#ab button').forEach(b=>b.classList.toggle('on',+b.dataset.a===a));history.replaceState(null,'','#'+k+','+a)}
document.getElementById('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k){k=b.dataset.k;show()}else ab(+b.dataset.a)});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='b'){e.preventDefault();ab(a?0:1)}});
addEventListener('resize',fit);show();
</script></body></html>
