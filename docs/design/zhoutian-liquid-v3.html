<!DOCTYPE html>
<html lang="zh-CN" data-theme="pomo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 丹田液面波浪三案 — 江湖无尽录</title>
<style>
:root {
  --bg: oklch(0.945 0.004 200);
  --surface: oklch(0.910 0.006 200);
  --ink: oklch(0.24 0.012 260);
  --muted: oklch(0.40 0.012 250);
  --faint: oklch(0.50 0.012 240);
  --line: oklch(0.80 0.01 210);
  --line-strong: oklch(0.58 0.015 230);
  --primary: oklch(0.30 0.02 260);
  --accent: oklch(0.45 0.065 220);
  --gold: oklch(0.62 0.12 78);
  --bar-track: oklch(0.855 0.008 200);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
body {
  background:
    radial-gradient(140% 70% at 88% -18%, oklch(0.24 0.012 260 / 0.07), transparent 55%),
    radial-gradient(120% 55% at -8% 108%, oklch(0.45 0.065 220 / 0.06), transparent 50%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size: 14px; line-height: 1.55; min-height: 100vh; padding-bottom: 48px;
}
.serif { font-family: "Songti SC","STSong","SimSun",serif; }
.scene-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 24px; background: oklch(0.90 0.007 200); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.scene-note b { color: var(--accent); font-size: 12px; letter-spacing: 0.05em; }
.stage { max-width: 880px; margin: 0 auto; padding: 26px 24px 0; display: flex; flex-direction: column; gap: 26px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 3px 14px oklch(0.24 0.012 260 / 0.10); overflow: hidden; }
.chead { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
.chead h2 { font-size: 15px; font-weight: 600; }
.chead .sub { font-size: 12px; color: var(--faint); margin-left: auto; }
.cbody { display: flex; justify-content: center; padding: 14px 0 18px; }
.ledger { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; padding: 10px 18px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl { display: flex; align-items: center; gap: 10px; padding: 0 18px 12px; font-size: 12px; color: var(--muted); }
.ctl input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--bar-track); outline: none; }
.ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); cursor: pointer; }

svg { display: block; }
svg text { font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }

.m-arc { fill: none; stroke: var(--line-strong); stroke-width: 2.5; opacity: 0.45; }
.m-arc.thru { stroke: var(--gold); opacity: 1; }
.m-arc.locked { stroke: var(--line-strong); stroke-dasharray: 3 7; opacity: 0.3; }
.m-flow { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 22; opacity: 0.5; animation: flow 2.8s linear infinite; }
.m-flow.thru { opacity: 0.9; stroke: var(--gold); }
@keyframes flow { to { stroke-dashoffset: -108; } }
.acu { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.acu.open { fill: var(--primary); stroke: var(--primary); }
.acu.thru { fill: var(--gold); stroke: var(--gold); }
.acu-t { font-size: 10px; fill: var(--faint); pointer-events: none; }
.acu-t.open { fill: var(--muted); }
.m-name { font-size: 12px; fill: var(--muted); letter-spacing: 0.1em; }
.m-name.thru { fill: var(--gold); font-weight: 600; }

.pool-rim { fill: none; stroke: var(--line-strong); stroke-width: 2; opacity: 0.55; }
.zt-seg { fill: none; stroke: var(--bar-track); stroke-width: 4; opacity: 0.45; }
.l-v { font-size: 21px; font-weight: 700; fill: var(--ink); }
.l-l { font-size: 10px; fill: var(--faint); letter-spacing: 0.1em; }
.l-c { font-size: 11px; fill: var(--accent); }

/* 液体填充 —— 顶部为波浪 path */
.liquid-body { clip-path: url(#lpClip); }
/* 液面高光 —— 紧跟波浪顶部的轮廓线 */
.surface-highlight { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0.32; }

.a-spiral { fill: none; stroke-width: 1; stroke-linecap: round; clip-path: url(#aSubClip); animation: spin 10s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.b-current { fill: none; stroke-linecap: round; clip-path: url(#bSubClip); }
.b-current.outer { animation: bSpin 13s linear infinite; }
.b-current.inner { animation: bSpin 8s linear infinite reverse; }
@keyframes bSpin { to { transform: rotate(360deg); } }
.c-node { fill: none; stroke: oklch(0.32 0.025 252 / 0.18); stroke-width: 1; }
@keyframes cPulse { 0%,100% { r: 8; opacity: 0.28; } 50% { r: 22; opacity: 0.05; } }

@media (prefers-reduced-motion: reduce) {
  .m-flow,.a-spiral,.b-current{ animation: none; }
  .c-node { animation: none; r: 12; opacity: 0.12; }
}
</style>
</head>
<body>

<div class="scene-note"><b>原型 · 液面波浪三案</b>液体填充顶部为波浪 path（非直线），rAF 持续驱动。拖动滑块看液面升降。</div>

<div class="stage">

<div class="card">
  <div class="chead"><h2>A · 暗流涌动</h2><span class="sub">液底暗旋 · 液面微波 · 气泡</span></div>
  <div class="cbody"><svg id="svgA" viewBox="0 0 480 440" width="480" height="440"></svg></div>
  <div class="ctl"><span>丹田充能</span><input type="range" min="0" max="100" value="45" data-id="A"><span class="pct">45%</span></div>
  <div class="ledger">微波（±5px），气泡均匀冒出。</div>
</div>

<div class="card">
  <div class="chead"><h2>B · 海眼漩涡</h2><span class="sub">双环对流 · 液面涟漪 · 气泡簇</span></div>
  <div class="cbody"><svg id="svgB" viewBox="0 0 480 440" width="480" height="440"></svg></div>
  <div class="ctl"><span>丹田充能</span><input type="range" min="0" max="100" value="58" data-id="B"><span class="pct">58%</span></div>
  <div class="ledger">涟漪（±4px），气泡成簇。</div>
</div>

<div class="card">
  <div class="chead"><h2>C · 气脉鼓荡</h2><span class="sub">三气眼鼓荡 · 较大波浪 · 多点气泡</span></div>
  <div class="cbody"><svg id="svgC" viewBox="0 0 480 440" width="480" height="440"></svg></div>
  <div class="ctl"><span>丹田充能</span><input type="range" min="0" max="100" value="32" data-id="C"><span class="pct">32%</span></div>
  <div class="ledger">较大波浪（±8px），气眼处气泡密集。</div>
</div>

</div>

<script>
const NS='http://www.w3.org/2000/svg';
const CX=240,CY=220,R_M=158,R_ML=126,R_AL=178;
const S_MID=[-90,30,150],SP=96;
const rad=d=>d*Math.PI/180;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(x,y,s,cls,p,anch){const t=el('text',{x,y,class:cls,'text-anchor':anch||'middle'},p);t.textContent=s;return t;}
function polar(r,d){return[CX+r*Math.cos(rad(d)),CY+r*Math.sin(rad(d))];}
function arc(r,d0,d1){const[x0,y0]=polar(r,d0),[x1,y1]=polar(r,d1);const l=Math.abs(d1-d0)>180?1:0;return`M ${x0} ${y0} A ${r} ${r} 0 ${l} 1 ${x1} ${y1}`;}

function drawMeridians(svg){
  S_MID.forEach((mid,si)=>{
    const d=arc(R_M,mid-SP/2,mid+SP/2),unlocked=si<2,thru=si===0,n=[3,3,2][si];
    el('path',{d,class:'m-arc'+(unlocked?(thru?' thru':''):' locked')},svg);
    if(unlocked)el('path',{d,class:'m-flow'+(thru?' thru':'')},svg);
    const[lx,ly]=polar(R_ML,mid);
    txt(lx,ly+4,['经脉·甲','经脉·乙','经脉·丙'][si],'m-name serif'+(thru?' thru':''),svg);
    txt(lx,ly+19,unlocked?(thru?'贯通':'1/3'):'境界5解锁','acu-t',svg);
    if(unlocked)for(let ai=0;ai<n;ai++){
      const a=rad(mid-SP/2+SP*(ai+0.5)/n),[x,y]=polar(R_M,a);
      el('circle',{cx:x,cy:y,r:8,class:'acu'+(thru?' thru':si===1&&ai===0?' open':'')},svg);
      const[tx,ty]=polar(R_AL,a);
      txt(tx,ty+4,['甲','乙','丙'][si]+['一','二','三'][ai],'acu-t'+(si===0||(si===1&&ai===0)?' open':''),svg);
    }
  });
}
function drawSegRings(svg,R){
  for(let i=0;i<5;i++)el('path',{d:arc(R+8,-90+72*i+3,-90+72*(i+1)-3),class:'zt-seg'},svg);
}
function centerText(svg){
  txt(CX,CY-18,'丹田内力','l-l',svg);
  const vt=txt(CX,CY+3,'','l-v',svg); vt.id=svg.id+'-val';
  txt(CX,CY+19,'/ 10,000','l-l',svg);
  const st=txt(CX,CY+38,'','l-c',svg); st.id=svg.id+'-sub';
}

// 液体填充 path——底部平直线，顶部波浪曲线
// 约束在圆形池边界内（clipPath 负责裁剪），返回 body 和 top 两条 path
function liquidPath(R,baseY,amp,freq,phase,t){
  const x0=CX-R+3,x1=CX+R-3,w=x1-x0,step=2;
  let body=`M ${x0} ${CY+R-2} L ${x1} ${CY+R-2}`;
  let top=`M ${x1}`;
  for(let x=x1;x>=x0;x-=step){
    const y=baseY+amp*Math.sin((x-x0)/w*freq*Math.PI*2+t+phase);
    const cy=Math.max(CY-R+3,Math.min(CY+R-2,y));
    body+=` L ${x} ${cy}`;
    top+=` L ${x} ${cy}`;
  }
  body+=` L ${x0} ${CY+R-2} Z`;
  return {body, top};
}

class BubblePool {
  constructor(svg,R,count){
    this.R=R; this.bubbles=[];
    for(let i=0;i<count;i++){
      const b=el('circle',{cx:CX,cy:CY+R,r:1.5,fill:'none',
        stroke:'oklch(0.42 0.05 220)','stroke-width':1.1,opacity:'0'},svg);
      b._alive=false; b._life=0; b._lifespan=0;
      b._baseX=CX+(Math.random()-0.5)*R*1.3;
      b._r=1.2+Math.random()*2.2;
      this.bubbles.push(b);
    }
  }
  tick(liquidPct,rMax){
    if(liquidPct<0.03){
      this.bubbles.forEach(b=>{b.setAttribute('opacity','0');b._alive=false;});
      return;
    }
    const yMid=liquidPct*2*this.R;
    this.bubbles.forEach(b=>{
      if(!b._alive){
        if(Math.random()<0.025){
          b._alive=true; b._life=0; b._lifespan=1.8+Math.random()*3.2;
          b._baseX=CX+(Math.random()-0.5)*this.R*1.3;
          b._r=1.2+Math.random()*rMax;
          b.setAttribute('r',b._r); b.setAttribute('opacity','0.5');
        }
        return;
      }
      b._life+=0.016;
      if(b._life>b._lifespan){b._alive=false;b.setAttribute('opacity','0');return;}
      const progress=b._life/b._lifespan;
      const startY=CY+this.R-2-yMid+8;
      const cy=startY+(startY-75-startY)*progress;
      const cx=b._baseX+Math.sin(b._life*2.5+b._baseX)*6;
      const dx=cx-CX,dy2=this.R*this.R-dx*dx;
      if(dy2<0){b._alive=false;b.setAttribute('opacity','0');return;}
      b.setAttribute('cx',cx);b.setAttribute('cy',cy);
      b.setAttribute('opacity',progress<0.1?progress/0.1*0.45:progress>0.75?(1-progress)/0.25*0.45:0.45);
    });
  }
}

// ═══ A ═══
{
  const svg=document.getElementById('svgA'),R=80;
  drawMeridians(svg);drawSegRings(svg,R);centerText(svg);
  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'lpClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},clip);
  const g=el('linearGradient',{id:'liqA',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'oklch(0.06 0.006 262)','stop-opacity':0.92},g);
  el('stop',{offset:'40%','stop-color':'oklch(0.10 0.010 258)','stop-opacity':0.78},g);
  el('stop',{offset:'75%','stop-color':'oklch(0.16 0.016 252)','stop-opacity':0.52},g);
  el('stop',{offset:'100%','stop-color':'oklch(0.22 0.020 248)','stop-opacity':0.18},g);
  el('circle',{cx:CX,cy:CY,r:R,class:'pool-rim'},svg);
  const body=el('path',{class:'liquid-body',fill:'url(#liqA)'},svg);
  const hl=el('path',{class:'surface-highlight'},svg);
  const subc=el('clipPath',{id:'aSubClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},subc);
  for(let k=0;k<3;k++){
    let d='';
    for(let a=0;a<360;a+=4){
      const rr=R*0.78*(1-0.55*a/360);
      const px=CX+rr*Math.cos(rad(a-90+k*120));
      const py=CY+rr*Math.sin(rad(a-90+k*120));
      d+=d?` L ${px} ${py}`:`M ${px} ${py}`;
    }
    el('path',{d,class:'a-spiral',stroke:`oklch(0.32 0.028 252 / ${0.14+k*0.05})`},svg);
  }
  const pool=new BubblePool(svg,R,8);

  let pct=0.45, baseY=CY+R-3-2*R*pct;
  function frame(ts){
    const t=ts/1000;
    const lp=liquidPath(R,baseY,5.0,2.6,0,t*1.3);
    body.setAttribute('d',lp.body); hl.setAttribute('d',lp.top);
    pool.tick(pct,2.5);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window._dA=v=>{
    pct=Math.max(0.01,Math.min(1,v/100));
    baseY=CY+R-3-2*R*pct;
    svg.querySelector('#svgA-val').textContent=Math.floor(pct*10000).toLocaleString();
    svg.querySelector('#svgA-sub').textContent='第三周天 '+Math.floor(pct*100)+'%';
  };
  window._dA(45);
}

// ═══ B ═══
{
  const svg=document.getElementById('svgB'),R=80;
  drawMeridians(svg);drawSegRings(svg,R);centerText(svg);
  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'lpClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},clip);
  const g=el('linearGradient',{id:'liqB',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'oklch(0.06 0.006 264)','stop-opacity':0.93},g);
  el('stop',{offset:'35%','stop-color':'oklch(0.09 0.010 258)','stop-opacity':0.80},g);
  el('stop',{offset:'75%','stop-color':'oklch(0.15 0.016 252)','stop-opacity':0.55},g);
  el('stop',{offset:'100%','stop-color':'oklch(0.20 0.020 248)','stop-opacity':0.22},g);
  el('circle',{cx:CX,cy:CY,r:R,class:'pool-rim'},svg);
  const body=el('path',{class:'liquid-body',fill:'url(#liqB)'},svg);
  const hl=el('path',{class:'surface-highlight'},svg);
  const subc=el('clipPath',{id:'bSubClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},subc);
  function mk(radii,cls){
    let d='';
    for(let k=0;k<radii.length;k++)for(let seg=0;seg<4;seg++){
      const a0=rad(-90+seg*95+15),a1=rad(-90+seg*95+75);
      const p0=polar(radii[k],a0),p1=polar(radii[k],a1);
      d+=`M ${p0[0]} ${p0[1]} A ${radii[k]} ${radii[k]} 0 0 1 ${p1[0]} ${p1[1]}`;
    }
    el('path',{d,class:cls,stroke:'oklch(0.32 0.026 252 / 0.14)'},svg);
  }
  mk([18,28,42],'b-current inner');
  mk([52,65],'b-current outer');
  const pool=new BubblePool(svg,R,10);

  let pct=0.58, baseY=CY+R-3-2*R*pct;
  function frame(ts){
    const t=ts/1000;
    const lp=liquidPath(R,baseY,4.0,2.4,0,t*0.9);
    body.setAttribute('d',lp.body); hl.setAttribute('d',lp.top);
    pool.tick(pct,2.2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window._dB=v=>{
    pct=Math.max(0.01,Math.min(1,v/100));
    baseY=CY+R-3-2*R*pct;
    svg.querySelector('#svgB-val').textContent=Math.floor(pct*10000).toLocaleString();
    svg.querySelector('#svgB-sub').textContent='第三周天 '+Math.floor(pct*100)+'%';
  };
  window._dB(58);
}

// ═══ C ═══
{
  const svg=document.getElementById('svgC'),R=80;
  drawMeridians(svg);drawSegRings(svg,R);centerText(svg);
  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'lpClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},clip);
  const g=el('linearGradient',{id:'liqC',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'oklch(0.06 0.006 260)','stop-opacity':0.90},g);
  el('stop',{offset:'50%','stop-color':'oklch(0.11 0.012 256)','stop-opacity':0.72},g);
  el('stop',{offset:'85%','stop-color':'oklch(0.18 0.018 250)','stop-opacity':0.42},g);
  el('stop',{offset:'100%','stop-color':'oklch(0.24 0.020 248)','stop-opacity':0.16},g);
  el('circle',{cx:CX,cy:CY,r:R,class:'pool-rim'},svg);
  const body=el('path',{class:'liquid-body',fill:'url(#liqC)'},svg);
  const hl=el('path',{class:'surface-highlight'},svg);
  const nodeAngles=[-90,30,150];
  nodeAngles.forEach(a=>{
    const[nx,ny]=polar(36,rad(a));
    el('circle',{cx:nx,cy:ny,r:8,class:'c-node',
      style:'animation:cPulse '+(2.0+Math.random()*1.2)+'s ease-in-out infinite;animation-delay:'+Math.random()*1.5+'s'
    },svg);
    const[nx2,ny2]=polar(33,rad(a));
    el('line',{x1:nx2,y1:ny2,x2:CX,y2:CY,
      stroke:'oklch(0.28 0.022 250 / 0.12)','stroke-width':0.8,'stroke-dasharray':'2 8'},svg);
  });
  const pool=new BubblePool(svg,R,12);

  let pct=0.32, baseY=CY+R-3-2*R*pct;
  function frame(ts){
    const t=ts/1000;
    const lp=liquidPath(R,baseY,8.0,3.0,0,t*1.1);
    body.setAttribute('d',lp.body); hl.setAttribute('d',lp.top);
    pool.tick(pct,3.0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window._dC=v=>{
    pct=Math.max(0.01,Math.min(1,v/100));
    baseY=CY+R-3-2*R*pct;
    svg.querySelector('#svgC-val').textContent=Math.floor(pct*10000).toLocaleString();
    svg.querySelector('#svgC-sub').textContent='第三周天 '+Math.floor(pct*100)+'%';
  };
  window._dC(32);
}

document.querySelectorAll('.ctl input').forEach(sl=>{
  sl.addEventListener('input',()=>{
    const pct=+sl.value, id=sl.dataset.id;
    sl.parentElement.querySelector('.pct').textContent=pct+'%';
    window['_d'+id](pct);
  });
});
</script>
</body>
</html>
