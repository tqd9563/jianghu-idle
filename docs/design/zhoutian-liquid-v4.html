<!DOCTYPE html>
<html lang="zh-CN" data-theme="pomo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 海眼丹田液面 + 冲穴时刻 — 江湖无尽录</title>
<style>
:root {
  --bg: oklch(0.945 0.004 200);
  --surface: oklch(0.910 0.006 200);
  --ink: oklch(0.24 0.012 260);
  --muted: oklch(0.40 0.012 250);
  --faint: oklch(0.50 0.012 240);
  --line: oklch(0.80 0.01 210);
  --line-strong: oklch(0.58 0.015 230);
  --primary: oklch(0.30 0.02 260);
  --accent: oklch(0.45 0.065 220);
  --gold: oklch(0.62 0.12 78);
  --bar-track: oklch(0.855 0.008 200);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
body {
  background:
    radial-gradient(140% 70% at 88% -18%, oklch(0.24 0.012 260 / 0.07), transparent 55%),
    radial-gradient(120% 55% at -8% 108%, oklch(0.45 0.065 220 / 0.06), transparent 50%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size: 14px; line-height: 1.55; min-height: 100vh; padding-bottom: 48px;
}
.serif { font-family: "Songti SC","STSong","SimSun",serif; }
.scene-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 24px; background: oklch(0.90 0.007 200); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.scene-note b { color: var(--accent); font-size: 12px; letter-spacing: 0.05em; }
.stage { max-width: 880px; margin: 0 auto; padding: 26px 24px 0; display: flex; flex-direction: column; gap: 26px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 3px 14px oklch(0.24 0.012 260 / 0.10); overflow: hidden; }
.chead { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
.chead h2 { font-size: 15px; font-weight: 600; }
.chead .sub { font-size: 12px; color: var(--faint); margin-left: auto; }
.cbody { display: flex; justify-content: center; padding: 14px 0 18px; }
.ledger { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; padding: 10px 18px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl { display: flex; align-items: center; gap: 10px; padding: 0 18px 12px; font-size: 12px; color: var(--muted); }
.ctl input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--bar-track); outline: none; }
.ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); cursor: pointer; }
.ctl-btns { display: flex; gap: 6px; }
.ctl-btns button { padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
.ctl-btns button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }

svg { display: block; }
svg text { font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }

.m-arc { fill: none; stroke: var(--line-strong); stroke-width: 2.5; opacity: 0.45; }
.m-arc.thru { stroke: var(--gold); opacity: 1; }
.m-arc.locked { stroke: var(--line-strong); stroke-dasharray: 3 7; opacity: 0.3; }
.m-flow { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 22; opacity: 0.5; animation: flow 2.8s linear infinite; }
.m-flow.thru { opacity: 0.9; stroke: var(--gold); }
@keyframes flow { to { stroke-dashoffset: -108; } }
.acu { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; transition: fill 0.25s, stroke 0.25s, r 0.25s; }
.acu.open { fill: var(--primary); stroke: var(--primary); }
.acu.thru { fill: var(--gold); stroke: var(--gold); }
.acu.actionable { animation: acuPulse 1.6s ease-in-out infinite; cursor: pointer; }
@keyframes acuPulse { 0%,100% { r: 8; stroke-width: 1.5; } 50% { r: 11; stroke-width: 2.5; stroke: var(--accent); } }
.acu-t { font-size: 10px; fill: var(--faint); pointer-events: none; }
.acu-t.open { fill: var(--muted); }
.m-name { font-size: 12px; fill: var(--muted); letter-spacing: 0.1em; }
.m-name.thru { fill: var(--gold); font-weight: 600; }

.pool-rim { fill: none; stroke: var(--line-strong); stroke-width: 2; opacity: 0.55; }
.zt-seg { fill: none; stroke: var(--bar-track); stroke-width: 4; opacity: 0.45; }
.l-v { font-size: 21px; font-weight: 700; fill: var(--ink); }
.l-l { font-size: 10px; fill: var(--faint); letter-spacing: 0.1em; }
.l-c { font-size: 11px; fill: var(--accent); }
.l-c.ready { fill: var(--gold); font-weight: 600; }

/* 液体 body — 顶部波浪 path */
.liquid-body { clip-path: url(#lClip); }
.surface-hl { fill: none; stroke: var(--accent); stroke-width: 1.1; opacity: 0.30; }

/* 海眼流线弧段 */
.b-current { fill: none; stroke-linecap: round; clip-path: url(#bSubClip); }
.b-current.outer { animation: bSpin 13s linear infinite; }
.b-current.inner { animation: bSpin 8s linear infinite reverse; }
@keyframes bSpin { to { transform: rotate(360deg); } }

/* 真气粒子 —— 参考原始方案 C 的 vapor 风格 */
.qi-particle {
  fill: var(--primary);
  animation: qiRise var(--qdur) ease-out infinite;
  animation-delay: var(--qdel);
  opacity: 0;
}
@keyframes qiRise {
  0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
  15%  { opacity: 0.40; }
  50%  { opacity: 0.15; transform: translate(0, -45px) scale(1); }
  100% { opacity: 0; transform: translate(0, -72px) scale(0.4); }
}

@media (prefers-reduced-motion: reduce) {
  .m-flow,.b-current,.acu.actionable,.qi-particle{ animation: none; }
  .qi-particle{ opacity: 0.18; }
  .acu.actionable{ r: 9; stroke: var(--accent); stroke-width: 2; }
}
</style>
</head>
<body>

<div class="scene-note"><b>原型 v4 · 海眼丹田</b>基于 B 方案（海眼漩涡），采用原始 C 的气泡风格（CSS 动画填色粒子）。包含周天圆满/冲穴时刻状态。</div>
<div class="stage">

<!-- ═══ 1: 正常运转中 ═══ -->
<div class="card">
  <div class="chead"><h2>正常运转中</h2><span class="sub">丹田充能 45% · 流线旋转 · 真气蒸腾</span></div>
  <div class="cbody"><svg id="svg1" viewBox="0 0 480 440" width="480" height="440"></svg></div>
  <div class="ctl"><span>丹田充能</span><input type="range" min="0" max="100" value="45" data-id="1"><span class="pct">45%</span></div>
  <div class="ledger">日常修炼状态：液面波浪起伏，真气粒子从液面飘散，双环对流暗示漩涡。</div>
</div>

<!-- ═══ 2: 周天圆满 · 丹田已满 ═══ -->
<div class="card">
  <div class="chead"><h2>周天圆满 · 丹田已满</h2><span class="sub">充能 100% · 冲穴机会 +1</span></div>
  <div class="cbody"><svg id="svg2" viewBox="0 0 480 440" width="480" height="440"></svg></div>
  <div class="ctl"><span>丹田充能</span><input type="range" min="100" max="100" value="100" data-id="2" disabled><span class="pct">100%</span></div>
  <div class="ledger">丹田满溢时：中央文本变为金色「周天圆满」，未冲开的窍穴脉动呼吸提示可冲穴。</div>
</div>

<!-- ═══ 3: 冲穴动画 ═══ -->
<div class="card">
  <div class="chead"><h2>冲穴瞬间</h2><span class="sub">点击可冲窍穴 → 行气冲穴</span></div>
  <div class="cbody"><svg id="svg3" viewBox="0 0 480 440" width="480" height="440"></svg></div>
  <div class="ctl">
    <span>冲穴操作</span>
    <span class="ctl-btns">
      <button data-act="attempt" class="on">尝试冲穴（乙二）</button>
      <button data-act="reset">重置</button>
    </span>
    <span class="pct" id="fb3"></span>
  </div>
  <div class="ledger">点击可冲穴窍穴：脉动呼吸 → 点击触发闪光/震动 → 成功=变亮并显示「已通」→ 整脉冲满=贯通金弧。</div>
</div>

</div>

<script>
const NS='http://www.w3.org/2000/svg';
const CX=240,CY=220,R_M=158,R_ML=126,R_AL=178;
const S_MID=[-90,30,150],SP=96;
const rad=d=>d*Math.PI/180;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(x,y,s,cls,p,anch){const t=el('text',{x,y,class:cls,'text-anchor':anch||'middle'},p);t.textContent=s;return t;}
function polar(r,d){return[CX+r*Math.cos(rad(d)),CY+r*Math.sin(rad(d))];}
function arc(r,d0,d1){const[x0,y0]=polar(r,d0),[x1,y1]=polar(r,d1);const l=Math.abs(d1-d0)>180?1:0;return`M ${x0} ${y0} A ${r} ${r} 0 ${l} 1 ${x1} ${y1}`;}

function drawMeridians(svg,openMask){
  S_MID.forEach((mid,si)=>{
    const d=arc(R_M,mid-SP/2,mid+SP/2);
    const unlocked=si<2,thru=si===0,nu=[3,3,2][si];
    el('path',{d,class:'m-arc'+(unlocked?(thru?' thru':''):' locked')},svg);
    if(unlocked)el('path',{d,class:'m-flow'+(thru?' thru':'')},svg);
    const[lx,ly]=polar(R_ML,mid);
    txt(lx,ly+4,['经脉·甲','经脉·乙','经脉·丙'][si],'m-name serif'+(thru?' thru':''),svg);
    txt(lx,ly+19,unlocked?(thru?'贯通':'1/3'):'境界5解锁','acu-t',svg);
    if(!unlocked)return;
    for(let ai=0;ai<nu;ai++){
      const a=rad(mid-SP/2+SP*(ai+0.5)/nu);
      const[x,y]=polar(R_M,a);
      const id=si+'-'+ai;
      const isOpen=openMask[id];
      const isActionable=openMask._actionable&&openMask._actionable.has(id);
      el('circle',{cx:x,cy:y,r:8,class:'acu'+
        (thru?' thru':isOpen?' open':'')+(isActionable?' actionable':''),
        id:'acu-'+svg.id+'-'+id,tabindex:isActionable?0:-1,
        'aria-label':['甲','乙','丙'][si]+['一','二','三'][ai]+(isOpen?' 已通':isActionable?' 可冲穴':' 未通')
      },svg);
      const[tx,ty]=polar(R_AL,a);
      txt(tx,ty+4,['甲','乙','丙'][si]+['一','二','三'][ai],
        'acu-t'+(isOpen?' open':''),svg);
    }
  });
}
function drawSegRings(svg,R){
  for(let i=0;i<5;i++)el('path',{d:arc(R+8,-90+72*i+3,-90+72*(i+1)-3),class:'zt-seg'},svg);
}
function centerText(svg,extraClass){
  txt(CX,CY-18,'丹田内力','l-l',svg);
  const vt=txt(CX,CY+3,'','l-v',svg); vt.id=svg.id+'-val';
  txt(CX,CY+19,'/ 10,000','l-l',svg);
  const st=txt(CX,CY+38,'','l-c'+(extraClass||''),svg); st.id=svg.id+'-sub';
}

function liquidPath(R,baseY,amp,freq,phase,t){
  const x0=CX-R+3,x1=CX+R-3,w=x1-x0,step=2;
  let body=`M ${x0} ${CY+R-2} L ${x1} ${CY+R-2}`;
  let top=`M ${x1}`;
  for(let x=x1;x>=x0;x-=step){
    const y=baseY+amp*Math.sin((x-x0)/w*freq*Math.PI*2+t+phase);
    body+=` L ${x} ${Math.max(CY-R+3,Math.min(CY+R-2,y))}`;
    top+=` L ${x} ${Math.max(CY-R+3,Math.min(CY+R-2,y))}`;
  }
  body+=` L ${x0} ${CY+R-2} Z`;
  return{body,top};
}

// 真气粒子：参考原始方案 C 的 CSS 动画风格
function makeQiParticles(svg,R,count){
  const g=el('g',{},svg);
  for(let i=0;i<count;i++){
    const cx=CX+(Math.random()-0.5)*R*1.3;
    const cy=CY+R-10-Math.random()*R*1.5;
    const p=el('circle',{cx,cy,r:1.5+Math.random()*2.5,class:'qi-particle',
      style:`--qdur:${2.2+Math.random()*2.2}s;--qdel:${Math.random()*4}s`},g);
  }
  return g;
}

// ═══ 1: 正常运转 ═══
{
  const svg=document.getElementById('svg1'),R=80;
  const openMask={'0-0':true,'0-1':true,'0-2':true,'1-0':true};
  drawMeridians(svg,openMask);
  drawSegRings(svg,R);
  centerText(svg,'');

  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'lClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},clip);
  const g=el('linearGradient',{id:'liq1',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'oklch(0.06 0.006 264)','stop-opacity':0.93},g);
  el('stop',{offset:'35%','stop-color':'oklch(0.09 0.010 258)','stop-opacity':0.80},g);
  el('stop',{offset:'75%','stop-color':'oklch(0.15 0.016 252)','stop-opacity':0.55},g);
  el('stop',{offset:'100%','stop-color':'oklch(0.20 0.020 248)','stop-opacity':0.22},g);
  el('circle',{cx:CX,cy:CY,r:R,class:'pool-rim'},svg);
  const body=el('path',{class:'liquid-body',fill:'url(#liq1)'},svg);
  const hl=el('path',{class:'surface-hl'},svg);

  const subc=el('clipPath',{id:'bSubClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},subc);
  function mk(radii,cls){
    let d='';
    for(let k=0;k<radii.length;k++)for(let seg=0;seg<4;seg++){
      const a0=rad(-90+seg*95+15),a1=rad(-90+seg*95+75);
      const p0=polar(radii[k],a0),p1=polar(radii[k],a1);
      d+=`M ${p0[0]} ${p0[1]} A ${radii[k]} ${radii[k]} 0 0 1 ${p1[0]} ${p1[1]}`;
    }
    el('path',{d,class:cls,stroke:'oklch(0.32 0.026 252 / 0.14)'},svg);
  }
  mk([18,28,42],'b-current inner');
  mk([52,65],'b-current outer');
  makeQiParticles(svg,R,12);

  let pct=0.45,baseY=CY+R-3-2*R*pct;
  function frame(ts){
    const t=ts/1000;
    const lp=liquidPath(R,baseY,3.5,2.4,0,t*0.9);
    body.setAttribute('d',lp.body);hl.setAttribute('d',lp.top);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window._d1=v=>{
    pct=Math.max(0.01,Math.min(1,v/100));
    baseY=CY+R-3-2*R*pct;
    svg.querySelector('#svg1-val').textContent=Math.floor(pct*10000).toLocaleString();
    svg.querySelector('#svg1-sub').textContent='第三周天 '+Math.floor(pct*100)+'%';
  };
  window._d1(45);
}

// ═══ 2: 周天圆满 ═══
{
  const svg=document.getElementById('svg2'),R=80;
  const openMask={'0-0':true,'0-1':true,'0-2':true,'1-0':true};
  // 乙二、乙三 为未通但可冲穴
  openMask._actionable=new Set(['1-1','1-2']);
  drawMeridians(svg,openMask);
  drawSegRings(svg,R);
  centerText(svg,'ready');

  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'lClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},clip);
  const g=el('linearGradient',{id:'liq2',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'oklch(0.06 0.006 264)','stop-opacity':0.93},g);
  el('stop',{offset:'35%','stop-color':'oklch(0.09 0.010 258)','stop-opacity':0.80},g);
  el('stop',{offset:'75%','stop-color':'oklch(0.15 0.016 252)','stop-opacity':0.55},g);
  el('stop',{offset:'100%','stop-color':'oklch(0.20 0.020 248)','stop-opacity':0.30},g);
  el('circle',{cx:CX,cy:CY,r:R,class:'pool-rim'},svg);
  const body=el('path',{class:'liquid-body',fill:'url(#liq2)'},svg);
  const hl=el('path',{class:'surface-hl'},svg);

  const subc=el('clipPath',{id:'bSubClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},subc);
  function mk(radii,cls){
    let d='';
    for(let k=0;k<radii.length;k++)for(let seg=0;seg<4;seg++){
      const a0=rad(-90+seg*95+15),a1=rad(-90+seg*95+75);
      const p0=polar(radii[k],a0),p1=polar(radii[k],a1);
      d+=`M ${p0[0]} ${p0[1]} A ${radii[k]} ${radii[k]} 0 0 1 ${p1[0]} ${p1[1]}`;
    }
    el('path',{d,class:cls,stroke:'oklch(0.32 0.026 252 / 0.14)'},svg);
  }
  mk([18,28,42],'b-current inner');
  mk([52,65],'b-current outer');
  makeQiParticles(svg,R,14);

  let pct=1.0,baseY=CY+R-3-2*R*pct;
  function frame(ts){
    const t=ts/1000;
    const lp=liquidPath(R,baseY,2.0,2.2,0,t*0.6);
    body.setAttribute('d',lp.body);hl.setAttribute('d',lp.top);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  svg.querySelector('#svg2-val').textContent='10,000';
  svg.querySelector('#svg2-sub').textContent='五周天圆满 · 丹田已满';
  window._d2=()=>{};
}

// ═══ 3: 冲穴交互 ═══
{
  const svg=document.getElementById('svg3'),R=80;
  // 甲全通、乙通1/3、乙二 actionable
  const openMask={'0-0':true,'0-1':true,'0-2':true,'1-0':true};
  openMask._actionable=new Set(['1-1']);
  drawMeridians(svg,openMask);
  drawSegRings(svg,R);
  centerText(svg,'ready');

  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'lClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},clip);
  const g=el('linearGradient',{id:'liq3',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'oklch(0.06 0.006 264)','stop-opacity':0.93},g);
  el('stop',{offset:'35%','stop-color':'oklch(0.09 0.010 258)','stop-opacity':0.80},g);
  el('stop',{offset:'75%','stop-color':'oklch(0.15 0.016 252)','stop-opacity':0.55},g);
  el('stop',{offset:'100%','stop-color':'oklch(0.20 0.020 248)','stop-opacity':0.30},g);
  el('circle',{cx:CX,cy:CY,r:R,class:'pool-rim'},svg);
  const body=el('path',{class:'liquid-body',fill:'url(#liq3)'},svg);
  const hl=el('path',{class:'surface-hl'},svg);

  const subc=el('clipPath',{id:'bSubClip'},defs);
  el('circle',{cx:CX,cy:CY,r:R-3},subc);
  function mk(radii,cls){
    let d='';
    for(let k=0;k<radii.length;k++)for(let seg=0;seg<4;seg++){
      const a0=rad(-90+seg*95+15),a1=rad(-90+seg*95+75);
      const p0=polar(radii[k],a0),p1=polar(radii[k],a1);
      d+=`M ${p0[0]} ${p0[1]} A ${radii[k]} ${radii[k]} 0 0 1 ${p1[0]} ${p1[1]}`;
    }
    el('path',{d,class:cls,stroke:'oklch(0.32 0.026 252 / 0.14)'},svg);
  }
  mk([18,28,42],'b-current inner');
  mk([52,65],'b-current outer');
  makeQiParticles(svg,R,14);

  let pct=1.0,baseY=CY+R-3-2*R*pct;
  function frame(ts){
    const t=ts/1000;
    const lp=liquidPath(R,baseY,2.0,2.2,0,t*0.6);
    body.setAttribute('d',lp.body);hl.setAttribute('d',lp.top);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  svg.querySelector('#svg3-val').textContent='10,000';
  svg.querySelector('#svg3-sub').textContent='五周天圆满 · 丹田已满';
  document.getElementById('fb3').textContent='冲穴机会 1';

  // 冲穴动画逻辑
  let animating=false;
  function doChongxue(){
    if(animating)return;
    const acu=svg.querySelector('#acu-svg3-1-1');
    if(!acu)return;
    animating=true;
    document.getElementById('fb3').textContent='行气冲穴...';
    // 阶段1：闪光收缩（150ms）
    acu.style.transition='r 0.15s ease-out, fill 0.15s, stroke 0.15s';
    acu.setAttribute('r','14');
    acu.style.fill='var(--accent)';
    acu.style.stroke='var(--accent)';
    setTimeout(()=>{
      acu.setAttribute('r','8');
    },150);
    // 阶段2：结果揭示（200ms 后）
    setTimeout(()=>{
      acu.setAttribute('r','8');
      acu.classList.remove('actionable');
      acu.classList.add('open');
      acu.style.fill='';acu.style.stroke='';acu.style.transition='';
      document.getElementById('fb3').textContent='行气冲穴 · 乙二 已通';
      // 更新文案
      const label=svg.querySelectorAll('.acu-t')[5]; // 乙二
      if(label)label.classList.add('open');
      animating=false;
    },400);
  }
  function reset(){
    const acu=svg.querySelector('#acu-svg3-1-1');
    if(!acu)return;
    acu.classList.remove('open');
    acu.classList.add('actionable');
    acu.style.fill='';acu.style.stroke='';acu.style.transition='';
    acu.setAttribute('r','8');
    const label=svg.querySelectorAll('.acu-t')[5];
    if(label)label.classList.remove('open');
    document.getElementById('fb3').textContent='冲穴机会 1';
    animating=false;
  }

  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.act==='attempt')doChongxue();
      else reset();
    });
  });

  window._d3=()=>{};
}

// 滑块
document.querySelectorAll('.ctl input:not([disabled])').forEach(sl=>{
  sl.addEventListener('input',()=>{
    const pct=+sl.value,id=sl.dataset.id;
    sl.parentElement.querySelector('.pct').textContent=pct+'%';
    window['_d'+id](pct);
  });
});
</script>
</body>
</html>
