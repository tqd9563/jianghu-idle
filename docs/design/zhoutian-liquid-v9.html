<!DOCTYPE html>
<html lang="zh-CN" data-theme="pomo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 v9 · 墨池潮汐（v8 技法 × 真实语义） — 江湖无尽录</title>
<style>
:root {
  --bg: oklch(0.945 0.004 200);
  --surface: oklch(0.910 0.006 200);
  --ink: oklch(0.24 0.012 260);
  --muted: oklch(0.40 0.012 250);
  --faint: oklch(0.50 0.012 240);
  --line: oklch(0.80 0.01 210);
  --line-strong: oklch(0.58 0.015 230);
  --primary: oklch(0.30 0.02 260);
  --accent: oklch(0.45 0.065 220);
  --gold: oklch(0.62 0.12 78);
  --gold-bright: oklch(0.83 0.11 84);   /* 贯通脉的流光：比管身亮两档，方能被看见 */
  --bar-track: oklch(0.855 0.008 200);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(140% 70% at 88% -18%, oklch(0.24 0.012 260 / 0.07), transparent 55%),
    radial-gradient(120% 55% at -8% 108%, oklch(0.45 0.065 220 / 0.06), transparent 50%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size: 14px; line-height: 1.55; min-height: 100vh; padding-bottom: 48px;
}
.serif { font-family: "Songti SC","STSong","SimSun",serif; }
.scene-note {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 8px 24px; background: oklch(0.90 0.007 200);
  border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
}
.scene-note b { color: var(--accent); font-size: 12px; letter-spacing: 0.05em; white-space: nowrap; }
.ctl { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.ctl button {
  padding: 4px 14px; border: 1px solid var(--line-strong); border-radius: 6px;
  background: transparent; color: var(--muted); font-size: 12.5px; cursor: pointer; font-family: inherit;
}
.ctl button.on { background: var(--primary); border-color: var(--primary); color: oklch(0.96 0.003 200); font-weight: 600; }
.ctl .stat { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 210px; text-align: right; }

.stage { max-width: 760px; margin: 0 auto; padding: 26px 24px 0; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 3px 14px oklch(0.24 0.012 260 / 0.10); overflow: hidden;
}
.chead { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
.chead h2 { font-size: 15px; font-weight: 600; }
.chead .sub { font-size: 12px; color: var(--faint); margin-left: auto; }
.cbody { display: flex; justify-content: center; padding: 12px 0 4px; }
/* 事件行：周天圆满/贯通等提示按冻结文案逐字出现，短暂停留后淡出 */
.eventline {
  min-height: 22px; text-align: center; font-size: 12.5px;
  color: var(--gold); font-weight: 600; padding-bottom: 10px;
  opacity: 0; transition: opacity 0.3s;
}
.eventline.show { opacity: 1; }
.ledger {
  display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
  padding: 10px 18px 14px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.ledger b { color: var(--ink); font-weight: 600; }
.v-note { max-width: 760px; margin: 14px auto 0; padding: 0 24px; font-size: 12px; color: var(--muted); line-height: 1.8; }

svg { display: block; }
svg text { font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }

/* 经脉外环（沿用年轮语言） */
/* 经脉 = 管道，流光 = 管中之气：两者必须异色，否则同色叠同色看不见流动。
   贯通脉的管身压暗、流光提亮并加快，气感强于未贯通脉（语义：贯通即气可通行）。 */
.m-arc { fill: none; stroke: var(--line-strong); stroke-width: 2.5; opacity: 0.45; }
.m-arc.thru { stroke: var(--gold); stroke-width: 3; opacity: 0.5; }
.m-arc.locked { stroke-dasharray: 3 7; opacity: 0.4; }
.m-flow {
  fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 5 22; opacity: 0.42; animation: flow 3.4s linear infinite;
}
.m-flow.thru {
  stroke: var(--gold-bright); stroke-width: 3.5;
  stroke-dasharray: 10 17; opacity: 1; animation-duration: 2s;
}
@keyframes flow { to { stroke-dashoffset: -108; } }
.acu { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.acu.open { fill: var(--primary); stroke: var(--primary); }
.acu.thru { fill: var(--gold); stroke: var(--gold); }
.acu-t { font-size: 10px; fill: var(--faint); pointer-events: none; }
.acu-t.open { fill: var(--muted); }
.m-name { font-size: 12px; fill: var(--muted); letter-spacing: 0.1em; }
.m-name.thru { fill: var(--gold); font-weight: 600; }
.m-name.locked { fill: var(--faint); opacity: 0.8; }

/* 墨池 */
.pool-rim { fill: none; stroke: var(--line-strong); stroke-width: 2; opacity: 0.55; transition: stroke 0.4s; }
.pool-rim.ready { stroke: var(--gold); opacity: 0.9; animation: rim-breath 2.2s var(--ease) infinite; }
@keyframes rim-breath { 0%,100% { stroke-width: 2; } 50% { stroke-width: 3.5; } }
/* 周天段刻度（池沿外圈）：淡轨常驻，圆满段转金（印记，不随回落消失） */
.zt-seg { fill: none; stroke: var(--bar-track); stroke-width: 4; opacity: 0.5; transition: stroke 0.4s, opacity 0.4s; }
.zt-seg.pearl { stroke: var(--gold); opacity: 0.55; }
/* 液面高光线 */
.surface-hl { fill: none; stroke: var(--accent); stroke-width: 1.1; opacity: 0.30; }
/* 池内暗流：极淡墨弧，缓转 */
.b-current { fill: none; stroke-linecap: round; stroke-width: 2; transform-box: view-box; transform-origin: 240px 220px; }
.b-current.outer { animation: bSpin 13s linear infinite; }
.b-current.inner { animation: bSpin 8s linear infinite reverse; }
@keyframes bSpin { to { transform: rotate(360deg); } }
/* 气：墨色粒子。位置与透明度由 JS 逐帧驱动——粒子只在完全透明的时刻重生，
   绝不在半空中被瞬移（那会读作「凭空冒出」）。 */
.qi-particle { fill: var(--primary); opacity: 0; }

.l-v { font-size: 21px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.l-l { font-size: 10px; fill: var(--faint); letter-spacing: 0.1em; }
.l-c { font-size: 11px; fill: var(--accent); font-variant-numeric: tabular-nums; }
.l-c.ready { fill: var(--gold); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .m-flow, .b-current, .qi-particle, .pool-rim.ready { animation: none; }
  .qi-particle { opacity: 0.18; }
}
</style>
</head>
<body>

<div class="scene-note">
  <b>原型 v9 · 墨池潮汐</b>v8 视觉技法 × 真实数值语义（境界 3：4 周天 × 2,500）。内力持续流入；<b>涨满一段 → 潮落入下一段</b>（取模翻转的呈现，非消耗）；「支取内力」才是真实回落。
  <span class="ctl">
    <button id="btnSpend">支取内力 −2,000</button>
    <button id="btnSpeed">快进 ×8</button>
    <button id="btnReset">重来</button>
    <span class="stat" id="statLine"></span>
  </span>
</div>

<div class="stage">
  <div class="card">
    <div class="chead"><h2>运转周天</h2><span class="sub" id="headSub"></span></div>
    <div class="cbody"><svg id="svg" viewBox="0 0 480 440" width="480" height="440"></svg></div>
    <div class="eventline" id="eventLine"></div>
    <div class="ledger">
      <span>丹田 <b id="ledDan">—</b></span>
      <span>周天印记 <b id="ledPearl">—</b></span>
      <span>冲穴机会 <b id="ledChance">—</b></span>
    </div>
  </div>
  <p class="v-note">
    与 v8 的差异：潮落时机从「点击冲穴」改到「周天圆满的瞬间」——冲穴消耗的是机会不是内力，液面不应因冲穴而动；
    段内液面 = 丹田内力对每周天 2,500 的取模，涨满即自然翻入下一段（0.6s 潮落过渡）。
    「支取内力」（升级武学）才触发真实回落，且池沿金珠（周天印记）不随回落消失。全部周天圆满后池满、金圈呼吸待突破。
  </p>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const CX = 240, CY = 220, R = 80, R_M = 158, R_ML = 126, R_AL = 178;
const S_MID = [-90, 30, 150], SP = 96;
const COST = 10000, N = 4, PER = COST / N, RATE = 14.1;
const CN = ['零','一','二','三','四','五','六','七','八','九'];
const fmt = n => Math.floor(n).toLocaleString('en-US');
const rad = d => d * Math.PI / 180;
const svg = document.getElementById('svg');

function el(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }
function txt(x, y, s, cls, anch) { const t = el('text', { x, y, class: cls, 'text-anchor': anch || 'middle' }); t.textContent = s; return t; }
const polar = (r, d) => [CX + r * Math.cos(rad(d)), CY + r * Math.sin(rad(d))];
function arc(r, d0, d1) { const [x0,y0] = polar(r,d0), [x1,y1] = polar(r,d1); const l = Math.abs(d1-d0) > 180 ? 1 : 0; return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${l} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; }

/* ── 经脉外环（境界 3：甲贯通 3 穴、乙 1/2、丙锁定占位） ── */
(function drawMeridians() {
  const slots = [
    { name: '经脉·甲', thru: true, acus: [1, 1, 1], label: '贯通' },
    { name: '经脉·乙', thru: false, acus: [1, 0], label: '1/2' },
    { name: '经脉·丙', locked: true },
  ];
  const ACU = [['甲一','甲二','甲三'], ['乙一','乙二'], []];
  slots.forEach((m, si) => {
    const mid = S_MID[si];
    const d = arc(R_M, mid - SP/2, mid + SP/2);
    const [lx, ly] = polar(R_ML, mid);
    if (m.locked) {
      el('path', { d, class: 'm-arc locked' });
      txt(lx, ly + 4, m.name, 'm-name serif locked');
      txt(lx, ly + 19, '境界 5 解锁', 'acu-t');
      return;
    }
    const thru = m.thru ? ' thru' : '';
    el('path', { d, class: 'm-arc' + thru });
    el('path', { d, class: 'm-flow' + thru });
    m.acus.forEach((open, ai) => {
      const a = mid - SP/2 + SP * (ai + 0.5) / m.acus.length;
      const [x, y] = polar(R_M, a);
      el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 8, class: 'acu' + (m.thru ? ' thru' : open ? ' open' : '') });
      const [tx, ty] = polar(R_AL, a);
      txt(tx, ty + 4, ACU[si][ai], 'acu-t' + (open ? ' open' : ''));
    });
    txt(lx, ly + 4, m.name, 'm-name serif' + thru);
    txt(lx, ly + 19, m.label, 'acu-t');
  });
})();

/* ── 周天段刻度（池沿外圈，N 段均分） ── */
const segEls = [];
for (let i = 0; i < N; i++) {
  const step = 360 / N;
  segEls.push(el('path', { d: arc(R + 8, -90 + step * i + 3, -90 + step * (i + 1) - 3), class: 'zt-seg' }));
}

/* ── 墨池 ── */
const defs = el('defs', {});
const clip = el('clipPath', { id: 'poolClip' }, defs);
el('circle', { cx: CX, cy: CY, r: R - 3 }, clip);
const grad = el('linearGradient', { id: 'liqGrad', x1: 0, y1: 1, x2: 0, y2: 0 }, defs);
el('stop', { offset: '0%', 'stop-color': 'oklch(0.06 0.006 264)', 'stop-opacity': 0.93 }, grad);
el('stop', { offset: '35%', 'stop-color': 'oklch(0.09 0.010 258)', 'stop-opacity': 0.80 }, grad);
el('stop', { offset: '75%', 'stop-color': 'oklch(0.15 0.016 252)', 'stop-opacity': 0.55 }, grad);
el('stop', { offset: '100%', 'stop-color': 'oklch(0.20 0.020 248)', 'stop-opacity': 0.30 }, grad);

const rim = el('circle', { cx: CX, cy: CY, r: R, class: 'pool-rim' });
const liqBody = el('path', { fill: 'url(#liqGrad)', 'clip-path': 'url(#poolClip)' });
const liqHl = el('path', { class: 'surface-hl', 'clip-path': 'url(#poolClip)' });

/* 暗流：极淡墨弧两簇，缓转 */
(function currents() {
  function mk(radii, cls) {
    let d = '';
    for (const r of radii) for (let s = 0; s < 4; s++) {
      const a0 = -90 + s * 95 + 15, a1 = -90 + s * 95 + 75;
      d += arc(r, a0, a1) + ' ';
    }
    el('path', { d, class: cls, stroke: 'oklch(0.32 0.026 252 / 0.14)', 'clip-path': 'url(#poolClip)' });
  }
  mk([18, 28, 42], 'b-current inner');
  mk([52, 65], 'b-current outer');
})();

/* ── 气粒子：墨色，自水面之下升起，抵达水面即散 ──
   逐帧驱动；重生只发生在 t 归零（完全透明）的瞬间，因此不会出现「凭空冒出」。 */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const POOL_BOTTOM = CY + R - 4;
const qiGroup = el('g', { 'clip-path': 'url(#poolClip)' });
const qiPs = [];
for (let i = 0; i < 14; i++) {
  qiPs.push({ el: el('circle', { cx: CX, cy: POOL_BOTTOM, r: 2, class: 'qi-particle' }, qiGroup), t: 1 });
}

/** 在液面之下选一个生点：depth 为距液面的深度，升程即 depth（升到面即散） */
function spawnQi(p, surfaceY, stagger) {
  const span = POOL_BOTTOM - surfaceY;
  if (span < 8) { p.dead = true; p.el.style.opacity = 0; return; }
  p.dead = false;
  const depth = 8 + Math.random() * (span - 8);
  const y = surfaceY + depth;
  const dy = y - CY;
  const half = Math.sqrt(Math.max(0, R * R - dy * dy));
  p.x = CX + (Math.random() - 0.5) * 1.6 * Math.max(3, half - 7);
  p.y0 = y;
  p.rise = depth - 2;                       // 恰好升到液面附近
  p.dur = 2.2 + Math.random() * 2.0;
  p.r = 1.5 + Math.random() * 2.0;
  p.phase = Math.random() * Math.PI * 2;
  p.t = stagger ? Math.random() : 0;
  p.el.setAttribute('r', p.r.toFixed(1));
}

function stepQi(dt, surfaceY) {
  for (const p of qiPs) {
    if (reduceMotion) {                      // 降级：静止的微尘，不做上升动画
      // 降级下 t 不推进，故用 dead 兜底重试（开局池空时也能在涨水后生出微尘）
      if (p.dead || p.t >= 1) { spawnQi(p, surfaceY, true); p.t = 0.4; }
      if (p.dead) continue;
      p.el.setAttribute('cx', p.x.toFixed(1));
      p.el.setAttribute('cy', (p.y0 - p.rise * 0.4).toFixed(1));
      p.el.style.opacity = 0.18;
      continue;
    }
    p.t += dt / (p.dur || 3);
    if (p.t >= 1) spawnQi(p, surfaceY, false);
    if (p.dead) continue;                    // 水太浅，无处可生
    // 液面已退到生点之上（支取内力）：就地加速淡出，而不是瞬移
    if (p.y0 < surfaceY - 2) p.t = Math.max(p.t, 0.78);
    const k = p.t;
    const y = p.y0 - p.rise * k;
    const x = p.x + Math.sin(k * Math.PI * 2 + p.phase) * 1.6;   // 微微摇曳
    const op = (k < 0.18 ? k / 0.18 : k > 0.7 ? (1 - k) / 0.3 : 1) * 0.42;
    p.el.setAttribute('cx', x.toFixed(1));
    p.el.setAttribute('cy', y.toFixed(1));
    p.el.style.opacity = op.toFixed(3);      // inline style：CSS 规则优先级高于 presentation attribute
  }
}

/* 中心文字 */
txt(CX, CY - 18, '丹田内力', 'l-l');
const valEl = txt(CX, CY + 3, '', 'l-v');
const capEl = txt(CX, CY + 19, '/ ' + fmt(COST), 'l-l');
const subEl = txt(CX, CY + 38, '', 'l-c');

/* 液面 path：正弦顶 + 平底（v8 技法） */
function liquidPath(baseY, amp, freq, t) {
  const x0 = CX - R + 3, x1 = CX + R - 3, w = x1 - x0, step = 2;
  let body = `M ${x0} ${(CY + R - 2).toFixed(1)} L ${x1} ${(CY + R - 2).toFixed(1)}`;
  let top = '';
  for (let x = x1; x >= x0; x -= step) {
    const y = baseY + amp * Math.sin((x - x0) / w * freq * Math.PI * 2 + t);
    const cy = Math.max(CY - R + 3, Math.min(CY + R - 2, y));
    body += ` L ${x} ${cy.toFixed(1)}`;
    top += (top ? ' L ' : 'M ') + x + ' ' + cy.toFixed(1);
  }
  body += ` L ${x0} ${(CY + R - 2).toFixed(1)} Z`;
  return { body, top };
}

/* ── 状态与主循环 ──
   dantian 为唯一真值；段内液面 = (dantian % PER)/PER 的平滑追踪。
   周天圆满瞬间取模翻转 1→0，display 用 lerp 追踪即自然呈现 0.6s 潮落。 */
let dantian = 5750;          // 开局：2 周天圆满 + 第三周天 30%
let highWater = 2;           // 周天印记（chargeHighWater 语义）
let chances = 2;
let speed = 1;
let dispPct = 0.30;          // 液面显示值（lerp 追踪目标）
let lastSegFull = 2;
let evTimer = null;

const eventLine = document.getElementById('eventLine');
function announce(msg) {
  eventLine.textContent = msg;
  eventLine.classList.add('show');
  clearTimeout(evTimer);
  evTimer = setTimeout(() => eventLine.classList.remove('show'), 2600);
}

function logic(dt) {
  if (dantian < COST) dantian = Math.min(COST, dantian + RATE * dt * speed);
  const segFull = Math.min(N, Math.floor(dantian / PER));
  if (segFull > lastSegFull) {
    // 周天圆满：印记点亮 + 机会 +1（冻结文案 §2）
    highWater = Math.max(highWater, segFull);
    chances += segFull - lastSegFull;
    announce(segFull >= N
      ? `${CN[N]}周天圆满 · 丹田已满`
      : `第${CN[segFull]}周天圆满 · 冲穴机会 +1`);
  }
  lastSegFull = segFull;
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  logic(dt);

  const ready = dantian >= COST;
  const segFull = Math.min(N, Math.floor(dantian / PER));
  const target = ready ? 1 : (dantian % PER) / PER;
  dispPct += (target - dispPct) * Math.min(1, dt * 7);   // 平滑追踪：翻转时即 0.6s 潮落

  const baseY = CY + R - 3 - 2 * R * Math.max(0.012, dispPct);
  stepQi(dt, baseY);
  const lp = liquidPath(baseY, 3.2, 2.3, now / 1000 * 0.85);
  liqBody.setAttribute('d', lp.body);
  liqHl.setAttribute('d', lp.top);

  // 文本与刻度
  valEl.textContent = fmt(Math.min(dantian, COST));
  subEl.textContent = ready ? `${CN[N]}周天圆满 · 可突破` : `第${CN[segFull + 1]}周天 ${Math.floor(target * 100)}%`;
  subEl.setAttribute('class', 'l-c' + (ready ? ' ready' : ''));
  segEls.forEach((s, i) => s.classList.toggle('pearl', i < highWater));
  rim.classList.toggle('ready', ready);

  document.getElementById('headSub').textContent =
    `境界 3 · 小有所成 · 每周天 ${fmt(PER)} × ${N}`;
  document.getElementById('ledDan').textContent = `${fmt(Math.min(dantian, COST))} / ${fmt(COST)}`;
  document.getElementById('ledPearl').textContent = `${highWater}/${N}`;
  document.getElementById('ledChance').textContent = chances;
  document.getElementById('statLine').textContent =
    `内力 ${fmt(Math.min(dantian, COST))} · +${(RATE * speed).toFixed(1)}/秒${ready ? ' · 可突破' : ''}`;

  requestAnimationFrame(frame);
}

qiPs.forEach(p => spawnQi(p, CY + R - 3 - 2 * R * dispPct, true));
requestAnimationFrame(frame);

document.getElementById('btnSpend').addEventListener('click', () => {
  dantian = Math.max(0, dantian - 2000);
  lastSegFull = Math.min(N, Math.floor(dantian / PER));
  announce('气机回落 · 周天印记仍在');
});
const btnSpeed = document.getElementById('btnSpeed');
btnSpeed.addEventListener('click', () => {
  speed = speed === 1 ? 8 : 1;
  btnSpeed.classList.toggle('on', speed === 8);
  btnSpeed.textContent = speed === 8 ? '快进中 ×8' : '快进 ×8';
});
document.getElementById('btnReset').addEventListener('click', () => {
  dantian = 0; highWater = 0; chances = 0; lastSegFull = 0; dispPct = 0;
});
</script>
