<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《江湖无尽录》视觉风格方向四象限对比</title>
<style>
  /* ============ 全局 ============ */
  :root {
    --page-bg: #0f1014;
    --page-ink: #f0f0f0;
    --page-muted: #999;
  }
  body {
    background: var(--page-bg);
    color: var(--page-ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    margin: 0;
    padding: 0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .serif { font-family: "Songti SC", "STSong", "SimSun", serif; }
  .sans { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif !important; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ============ 2x2 Board ============ */
  .page-header {
    padding: 24px 24px 0;
    max-width: 2560px;
    margin: 0 auto;
  }
  .page-header h1 {
    font-size: 24px; margin: 0 0 8px; color: var(--page-ink);
  }
  .page-header p {
    font-size: 14px; margin: 0; color: var(--page-muted);
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 24px;
    max-width: 2560px;
    margin: 0 auto;
  }
  @media (max-width: 1200px) {
    .board { grid-template-columns: 1fr; }
  }

  .theme-wrapper {
    container-type: inline-size;
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }

  /* ============ 主题变量 ============ */
  .theme-night {
    /* 夜色江湖 · 夜雨烛火剑气 */
    --bg: oklch(0.165 0.014 262);
    --surface: oklch(0.215 0.016 262);
    --surface-2: oklch(0.26 0.018 262);
    --ink: oklch(0.90 0.012 85);
    --muted: oklch(0.75 0.015 85);
    --faint: oklch(0.65 0.015 262);
    --line: oklch(0.32 0.02 262);
    --line-strong: oklch(0.48 0.03 262);
    --primary: oklch(0.76 0.13 78);
    --primary-ink: oklch(0.18 0.03 78);
    --accent: oklch(0.74 0.10 215);
    --accent-soft: oklch(0.74 0.10 215 / 0.14);
    --gold: oklch(0.76 0.13 78);
    --poison: oklch(0.72 0.14 145);
    --hp: oklch(0.64 0.17 25);
    --shield: oklch(0.70 0.10 240);
    --crit: oklch(0.70 0.16 45);
    --bar-track: oklch(0.28 0.018 262);
    --shadow: 0 2px 8px oklch(0.08 0.01 262 / 0.5);
    --glow-num: 0 0 12px oklch(0.76 0.13 78 / 0.35);

    --radius-panel: 8px;
    --radius-btn: 6px;
    --radius-tag: 4px;
    --radius-pill: 10px;
    --border-panel: 1px solid var(--line);
    --panel-shadow: var(--shadow);
  }

  .theme-xuan {
    /* 水墨留白 · 宣纸墨色朱印 */
    --bg: oklch(0.965 0.003 100);
    --surface: oklch(0.935 0.004 100);
    --surface-2: oklch(0.905 0.005 100);
    --ink: oklch(0.22 0.01 90);
    --muted: oklch(0.40 0.012 90);
    --faint: oklch(0.50 0.01 90);
    --line: oklch(0.80 0.008 90);
    --line-strong: oklch(0.65 0.01 90);
    --primary: oklch(0.50 0.185 29);
    --primary-ink: oklch(0.99 0.005 29);
    --accent: oklch(0.42 0.07 230);
    --accent-soft: oklch(0.42 0.07 230 / 0.12);
    --gold: oklch(0.52 0.11 80);
    --poison: oklch(0.45 0.11 145);
    --hp: oklch(0.50 0.16 25);
    --shield: oklch(0.50 0.09 240);
    --crit: oklch(0.50 0.185 29);
    --bar-track: oklch(0.87 0.006 100);
    --shadow: 0 1px 3px oklch(0.22 0.01 90 / 0.10);
    --glow-num: none;

    --radius-panel: 0;
    --radius-btn: 0;
    --radius-tag: 0;
    --radius-pill: 0;
    --border-panel: 1px solid var(--line-strong);
    --panel-shadow: none;
  }

  .theme-bronze {
    /* 山门铜刻 · 石刻古铜 */
    --bg: oklch(0.28 0.015 100);
    --surface: oklch(0.33 0.015 100);
    --surface-2: oklch(0.38 0.02 100);
    --ink: oklch(0.88 0.02 90);
    --muted: oklch(0.78 0.02 90);
    --faint: oklch(0.65 0.02 90);
    --line: oklch(0.44 0.02 100);
    --line-strong: oklch(0.55 0.03 90);
    --primary: oklch(0.68 0.14 65);
    --primary-ink: oklch(0.20 0.02 100);
    --accent: oklch(0.58 0.10 160);
    --accent-soft: oklch(0.58 0.10 160 / 0.20);
    --gold: oklch(0.75 0.14 70);
    --poison: oklch(0.58 0.14 145);
    --hp: oklch(0.62 0.16 25);
    --shield: oklch(0.62 0.10 240);
    --crit: oklch(0.68 0.16 45);
    --bar-track: oklch(0.40 0.02 100);
    --shadow: 0 3px 8px oklch(0.12 0.01 100 / 0.6);
    --glow-num: none;

    --radius-panel: 2px;
    --radius-btn: 2px;
    --radius-tag: 2px;
    --radius-pill: 2px;
    --border-panel: 2px solid var(--line-strong);
    --panel-shadow: inset 0 0 0 1px var(--surface-2), var(--shadow);
  }

  .theme-mist {
    /* 雾江行旅 · 雾冷舟青 */
    --bg: oklch(0.88 0.02 215);
    --surface: oklch(0.93 0.015 215);
    --surface-2: oklch(0.97 0.01 215);
    --ink: oklch(0.28 0.03 235);
    --muted: oklch(0.38 0.03 235);
    --faint: oklch(0.48 0.02 235);
    --line: oklch(0.80 0.02 215);
    --line-strong: oklch(0.68 0.03 225);
    --primary: oklch(0.42 0.12 250);
    --primary-ink: oklch(0.98 0.01 215);
    --accent: oklch(0.52 0.08 190);
    --accent-soft: oklch(0.52 0.08 190 / 0.15);
    --gold: oklch(0.60 0.14 70);
    --poison: oklch(0.50 0.14 145);
    --hp: oklch(0.52 0.16 25);
    --shield: oklch(0.50 0.10 240);
    --crit: oklch(0.52 0.18 45);
    --bar-track: oklch(0.82 0.02 215);
    --shadow: 0 4px 12px oklch(0.25 0.03 235 / 0.10);
    --glow-num: none;

    --radius-panel: 12px;
    --radius-btn: 8px;
    --radius-tag: 6px;
    --radius-pill: 12px;
    --border-panel: 1px solid var(--line);
    --panel-shadow: 0 4px 16px oklch(0.25 0.03 235 / 0.06), inset 0 1px 0 oklch(1 1 1 / 0.4);
  }

  /* ============ 顶栏与说明 ============ */
  .board-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line-strong);
    background: var(--surface);
  }
  .board-header h2 {
    font-size: 20px; font-weight: 700; margin: 6px 0 8px; display: flex; align-items: baseline; gap: 10px; color: var(--ink);
  }
  .board-header .en { font-size: 13px; font-weight: 400; color: var(--faint); font-family: sans-serif; letter-spacing: 0.05em; }
  .board-tag { display: inline-block; padding: 2px 6px; border-radius: var(--radius-tag); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; }
  .board-tag.current { background: var(--primary); color: var(--primary-ink); }
  .board-tag.candidate { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); }
  .board-desc { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .board-desc b { color: var(--ink); font-weight: 600; margin-right: 6px; }

  .topbar {
    display: flex; align-items: center; gap: 24px; padding: 12px 24px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .game-title { font-size: 19px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); white-space: nowrap; }
  .game-title .round { font-size: 12px; color: var(--primary); border: 1px solid currentColor; border-radius: var(--radius-tag); padding: 1px 8px; margin-left: 10px; vertical-align: 2px; letter-spacing: 0.1em; }
  .realm-chip { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .realm-chip .name { font-size: 16px; font-weight: 600; color: var(--primary); }
  .realm-chip .lv { font-size: 12px; color: var(--muted); }
  .res-group { display: flex; gap: 24px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .res { text-align: right; }
  .res .label { font-size: 11px; color: var(--faint); letter-spacing: 0.05em; white-space: nowrap; }
  .res .value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; text-shadow: var(--glow-num); color: var(--ink); white-space: nowrap; }
  .res .rate { font-size: 11px; color: var(--poison); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .res.rep .value { color: var(--gold); }

  /* ============ 内部布局与容器响应 ============ */
  .theme-content { flex: 1; overflow-y: auto; }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    gap: 16px;
    padding: 16px 24px 32px;
  }
  @container (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  @container (max-width: 1080px) and (min-width: 901px) {
    .layout { grid-template-columns: 280px 1fr; }
  }
  @container (max-width: 520px) {
    .topbar { flex-wrap: wrap; padding: 12px 16px; gap: 12px; }
    .res-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; width: 100%; margin-left: 0; justify-content: start; justify-items: start; }
    .res { text-align: left; }

    .fighters { grid-template-columns: 1fr; gap: 8px; }
    .vs { padding-top: 4px; padding-bottom: 4px; text-align: center; border-bottom: 1px solid var(--line); margin-bottom: 8px; }

    .skill-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    .skill-row .seff { margin-bottom: 4px; }
    .skill-row .skill-btn { align-self: stretch; width: 100%; }

    .layout > div, .fighter, .skill-row, .node-row, .topbar { min-width: 0; }
    .fname, .frealm, .sname, .nname { word-wrap: break-word; white-space: normal; }
  }

  /* ============ 面板 ============ */
  .panel { background: var(--surface); border: var(--border-panel); border-radius: var(--radius-panel); box-shadow: var(--panel-shadow); overflow: hidden; }
  .panel + .panel { margin-top: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; color: var(--ink); }
  .panel-head .sub { font-size: 12px; font-weight: 400; color: var(--muted); }
  .panel-body { padding: 12px 14px; }

  /* ============ 数据行与通用项 ============ */
  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 500; }

  .bar { height: 8px; border-radius: 4px; background: var(--bar-track); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--primary); transition: width 0.3s ease-out; }
  .bar.hp > i { background: var(--hp); }
  .bar.enemy-hp { height: 14px; border-radius: 5px; }
  .bar.enemy-hp > i { background: var(--hp); }

  .charge-track { display: flex; gap: 5px; margin: 10px 0 6px; }
  .charge-seg { flex: 1; height: 14px; border-radius: 4px; background: var(--bar-track); position: relative; overflow: hidden; }
  .charge-seg.full { background: var(--primary); }
  .charge-seg.part > i { position: absolute; inset: 0; width: 45%; background: var(--primary); opacity: 0.65; }
  .charge-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .btn {
    display: inline-block; width: 100%; padding: 9px 0; border: none; border-radius: var(--radius-btn);
    background: var(--primary); color: var(--primary-ink); font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; text-align: center; transition: filter 0.15s, background 0.15s; margin-top: 10px;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { background: var(--surface-2); color: var(--faint); border: 1px solid var(--line); cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); font-weight: 500; }
  .btn.ghost:hover:not(:disabled) { background: var(--accent-soft); }
  .btn.ghost:disabled { background: transparent; border-color: var(--line); color: var(--faint); cursor: not-allowed; }

  /* ============ 战斗区 ============ */
  .map-tabs { display: flex; border-bottom: 1px solid var(--line); }
  .map-tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; cursor: default; }
  .map-tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--primary); }
  .map-tab.locked { color: var(--faint); cursor: default; }
  .map-tab .prog { display: block; font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .map-tab.active .prog { color: var(--primary); }

  .battle-stage { padding: 16px 18px; }
  .fighters { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: start; }
  .fighter { padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-panel); }
  .fighter .fname { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fighter .frealm { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .vs { align-self: center; font-size: 15px; font-weight: 700; color: var(--faint); letter-spacing: 0.1em; padding-top: 30px; }
  .hp-num { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 8px 0 3px; }
  .mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px; font-size: 12px; }
  .mini-stats span { color: var(--muted); }
  .mini-stats b { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 3px; color: var(--ink); }

  .tag { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-tag); font-weight: 500; border: 1px solid; }
  .tag.elite { color: var(--gold); border-color: var(--gold); }
  .tag.trait { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tag.poison-tag { color: var(--poison); border-color: var(--poison); }

  .counter-hint { margin-top: 12px; padding: 8px 12px; background: var(--accent-soft); border-radius: var(--radius-btn); font-size: 12.5px; color: var(--ink); }
  .counter-hint b { color: var(--accent); }
  .counter-hint .src { color: var(--faint); font-size: 11px; margin-left: 6px; }

  .status-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--line-strong); font-variant-numeric: tabular-nums; }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-pill.p .dot { background: var(--poison); }
  .status-pill.p { color: var(--poison); border-color: var(--poison); }

  .log { border-top: 1px solid var(--line); padding: 12px 18px; max-height: 240px; overflow-y: auto; }
  .log-title { font-size: 12px; color: var(--faint); letter-spacing: 0.08em; margin-bottom: 8px; }
  .log-line { font-size: 13px; padding: 2.5px 0; font-variant-numeric: tabular-nums; color: var(--muted); }
  .log-line .turn { display: inline-block; width: 52px; color: var(--faint); font-size: 12px; }
  .log-line b { font-weight: 600; }
  .log-line .dmg { color: var(--ink); font-weight: 600; }
  .log-line .poison-t { color: var(--poison); font-weight: 600; }
  .log-line .crit-t { color: var(--crit); font-weight: 700; }
  .log-line .info-t { color: var(--accent); }

  /* ============ 乘区透视 ============ */
  .zone-box { background: var(--surface-2); border-radius: var(--radius-btn); padding: 10px 12px; margin-top: 8px; }
  .zone-box .zt { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
  .zone-line { font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1.8; }
  .zone-line .base { color: var(--muted); }
  .zone-line .perm { color: var(--gold); font-weight: 600; }
  .zone-line .temp { color: var(--accent); font-weight: 600; }
  .zone-line .result { color: var(--primary); font-weight: 700; font-size: 15px; }
  .zone-legend { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--faint); }
  .zone-legend .perm::before, .zone-legend .temp::before { content: "■"; margin-right: 4px; }
  .zone-legend .perm { color: var(--gold); }
  .zone-legend .temp { color: var(--accent); }

  /* ============ 节点与武学 ============ */
  .skill-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .skill-row:last-child { border-bottom: none; }
  .skill-row .sname { font-weight: 600; font-size: 13.5px; }
  .skill-row .slv { font-size: 12px; color: var(--primary); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .skill-row .seff { font-size: 12px; color: var(--muted); flex: 1; }
  .skill-btn { font-size: 12px; padding: 4px 12px; border-radius: var(--radius-btn); border: 1px solid var(--line-strong); background: transparent; color: var(--ink); cursor: pointer; font-family: inherit; white-space: nowrap; font-variant-numeric: tabular-nums; transition: background 0.15s; }
  .skill-btn:hover:not(:disabled) { background: var(--accent-soft); }
  .skill-btn:disabled { color: var(--faint); border-color: var(--line); cursor: not-allowed; background: var(--surface-2); }
  .cap-note { font-size: 11.5px; color: var(--faint); margin-top: 6px; }

  .node-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 13px; }
  .node-row .owned { color: var(--poison); white-space: nowrap; }
  .node-row .price { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .node-row .nname { color: var(--ink); }
  .node-row.dim .nname { color: var(--faint); }

  .route-mech { font-size: 12.5px; color: var(--muted); line-height: 1.8; }
  .route-mech li { list-style: none; padding-left: 14px; position: relative; }
  .route-mech li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 5px; height: 5px; border-radius: 50%; background: var(--poison); }
  .route-mech b { color: var(--ink); }
  .route-name { font-size: 16px; font-weight: 700; color: var(--poison); margin-bottom: 8px; }

  /* 归隐结算 */
  .retire-preview { display: flex; flex-direction: column; gap: 8px; }
  .retire-item { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 10px; border-radius: var(--radius-btn); background: var(--surface-2); font-size: 13px; border: 1px solid transparent; }
  .retire-item.gain { border-color: var(--gold); }
  .retire-item.gain .rv { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
  .retire-item.keep .rv { color: var(--accent); font-weight: 500; }
  .retire-item.loss .rv { color: var(--faint); text-decoration: line-through; }
  .retire-item .rt { font-size: 12px; font-weight: 600; color: var(--muted); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1 id="page-title">《江湖无尽录》视觉风格方向四象限对比</h1>
  <p>评估游戏核心界面的四个风格方向，共享同一套内容结构。</p>
</header>

<main class="board" id="board" aria-labelledby="page-title"></main>

<template id="board-template">
  <div class="theme-wrapper">
    <div class="board-header">
      <span class="board-tag"></span>
      <h2 class="serif"><span class="title-text"></span> <span class="en sans"></span></h2>
      <div class="board-desc"></div>
    </div>

    <div class="theme-content">
      <header class="topbar">
        <div class="game-title serif">江湖无尽录<span class="round sans">第 2 轮</span></div>
        <div class="realm-chip">
          <span class="name serif">小有所成</span>
          <span class="lv sans">境界 3 / 5</span>
        </div>
        <div class="res-group sans">
          <div class="res">
